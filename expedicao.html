<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Flow Suite">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Flow Suite — Expedição</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{
  --navy:#0b1e33; --navy2:#102A43; --navy3:#173a5e;
  --bg:#F8FAFC; --bg2:#ffffff; --bg3:#F1F5F9; --bg4:#E9EDF3;
  --border:#E5E7EB; --border-strong:#CBD5E1; --text:#111827; --text2:#6B7280; --text3:#9CA3AF;
  --blue:#1D4ED8; --blue-dim:#DBEAFE; --blue-hover:#1E40AF; --header-bg:#102A43;
  --green:#10B981; --green-dim:#D1FAE5;
  --amber:#b5690a; --amber-dim:#faedd9;
  --red:#DC2626; --red-dim:#FEE2E2;
  --radius:16px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 8px 20px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}

/* ── APP SHELL: header + sidebar + content ── */
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.app-header{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 22px;background:var(--header-bg);border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:100}
.app-header-brand{display:flex;align-items:center;gap:10px}
.app-header-brand .logo-full{height:42px;width:auto;flex-shrink:0;display:block}
.app-header-right{display:flex;align-items:center;gap:12px}
.header-user{font-size:12px;color:rgba(255,255,255,.6);text-align:right;line-height:1.3}
.header-user strong{color:#fff;font-weight:600;display:block;font-size:12.5px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn svg{width:15px;height:15px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4f8ef7,#7c6cf0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}

.app-body{flex:1;display:flex;min-height:0}
.sidebar{width:222px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:16px 10px;transition:width .15s ease}
.app-shell.sidebar-collapsed .sidebar{width:68px}
.app-shell.sidebar-collapsed .nav-label,.app-shell.sidebar-collapsed .collapse-label{display:none}
.sidebar-nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.66);text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--blue);color:#fff;font-weight:600}
.collapse-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.45);background:none;border:none;cursor:pointer;font-size:12.5px;width:100%;font-family:inherit}
.collapse-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.collapse-btn svg{width:15px;height:15px;transition:transform .15s;flex-shrink:0}
.app-shell.sidebar-collapsed .collapse-btn svg{transform:rotate(180deg)}

/* botão flutuante pra abrir/fechar o menu lateral — ver explicação nas outras
   páginas: o botão original fica preso embaixo da sidebar, que estica com o
   conteúdo. Esse é fixo na viewport, e o menu fecha sozinho alguns segundos
   depois de carregar, a não ser que a pessoa já tenha mexido nele antes. */
.sidebar-fab{position:fixed;bottom:20px;left:16px;z-index:260;width:46px;height:46px;border-radius:50%;background:var(--navy2);border:1px solid rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-md);transition:background .12s,transform .12s}
.sidebar-fab:hover{background:var(--navy3);transform:scale(1.06)}
.sidebar-fab svg{width:20px;height:20px;transition:transform .2s;flex-shrink:0}
.app-shell.sidebar-collapsed .sidebar-fab svg{transform:rotate(180deg)}

.content{flex:1;min-width:0;padding:1.75rem 2rem;overflow-y:auto}

.btn{display:inline-block;padding:8px 15px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:12.5px;cursor:pointer;font-weight:500;transition:border-color .12s,color .12s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--blue-hover);border-color:var(--blue-hover);color:#fff}
.btn-primary:disabled{opacity:.5;cursor:default}

.notice{margin:0 0 1.25rem;padding:11px 16px;background:var(--amber-dim);color:var(--amber);border-radius:var(--radius-sm);font-size:12.5px;border:1px solid rgba(181,105,10,.15)}

.tabs{display:flex;gap:8px;margin-bottom:1rem}
.tab{padding:9px 18px;font-size:13px;color:var(--text2);cursor:pointer;border-radius:var(--radius-sm);font-weight:500;background:var(--bg2);border:1px solid var(--border);transition:all .12s}
.tab:hover{background:var(--bg3);color:var(--text)}
.tab.active{background:var(--blue);color:#fff;font-weight:600;border-color:var(--blue)}

.nav-bar{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);margin-bottom:16px}
.nav-crumb{color:var(--text2);cursor:pointer;padding:3px 8px;border-radius:6px}
.nav-crumb:hover{background:var(--bg3);color:var(--text)}
.nav-crumb.active{color:var(--blue);font-weight:600}
.nav-sep{color:var(--text3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.search-row{display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap}
.search-row input{flex:1;min-width:220px;padding:13px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:16px}
.search-row input:focus{outline:none;border-color:var(--blue)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;cursor:pointer;transition:all .12s;box-shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04)}
.card:hover{border-color:var(--blue);background:var(--blue-dim);box-shadow:0 4px 10px rgba(16,24,40,.09),0 2px 4px rgba(16,24,40,.06)}
.card-title{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text)}
.card-sub{font-size:12px;color:var(--blue)}
.empty{text-align:center;padding:3rem 2rem;color:var(--text2);font-size:13px}

.tbl-wrap{overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl thead th{text-align:left;padding:8px 10px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap;background:var(--bg3)}
.dtbl tbody tr{border-bottom:1px solid var(--border)}
.dtbl tbody tr:hover td{background:var(--bg3)}
.dtbl tbody td{padding:7px 10px;vertical-align:middle}
.col-desc{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.desc-cell{max-width:240px}
.desc-txt{color:var(--text2)}
.btn-edit-desc{cursor:pointer;opacity:.5;margin-left:4px;font-size:12px}
.btn-edit-desc:hover{opacity:1}
.desc-edit-row{display:flex;gap:6px;align-items:center}
.desc-edit-row input{flex:1;min-width:140px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);color:var(--text);font-size:12px}
.desc-edit-row .btn{padding:4px 8px;font-size:11px}
.dtbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.dtbl td.chk{width:36px}
.qtd-input{width:80px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:12px;text-align:right;font-weight:600}
.qtd-input:focus{outline:none;border-color:var(--blue)}
.qtd-input.qtd-excede{border-color:var(--amber);background:var(--amber-dim);color:var(--amber);font-weight:700}
.qtd-input:disabled{background:transparent;border-style:dashed;color:var(--text3);font-weight:400}
.aviso-excede{font-size:10px;color:var(--amber);white-space:nowrap;margin-top:3px}
.vol-input{width:56px;padding:6px 6px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:12px;text-align:center}
.vol-input:focus{outline:none;border-color:var(--blue)}
.vol-input:disabled{background:transparent;border-style:dashed;color:var(--text3)}
.status-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600}
.sb-parcial{background:var(--amber-dim);color:var(--amber)}

.footer-bar{
  position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 1.5rem;background:var(--bg2);border-top:1px solid var(--border);margin-top:1rem;
}
.sel-count{font-size:12px;color:var(--text2)}
.msg-box{margin:0 0 1rem;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;display:none}
.msg-box.show{display:block}
.msg-box.err{background:var(--red-dim);color:var(--red)}
.msg-box.ok{background:var(--green-dim);color:var(--green)}
</style>
</head>
<body>

<script src="js/supabase-client.js"></script>
<script>
let AUTH = null;
let SOMENTE_LEITURA = false;
let aba = 'gerar';
let pedidoAtual = null;

// ── MENU LATERAL: fecha sozinho e tem botão flutuante sempre alcançável ────
let sidebarMexidoManualmente = false;
function alternarSidebar(manual){
  document.getElementById('appShell').classList.toggle('sidebar-collapsed');
  if (manual) sidebarMexidoManualmente = true;
  if (typeof posicionarBarraFlutuante === 'function') setTimeout(posicionarBarraFlutuante, 180);
}
setTimeout(() => {
  if (sidebarMexidoManualmente) return;
  document.getElementById('appShell').classList.add('sidebar-collapsed');
  if (typeof posicionarBarraFlutuante === 'function') setTimeout(posicionarBarraFlutuante, 180);
}, 5000);
let itensSelecionados = new Set();     // ids selecionados (checkbox marcado)
let disponivelPorItem = {};            // item_id -> quantidade disponível
let modoRevisao = false;               // true = editando (add/remover itens) um romaneio já gerado

function showMsg(text, ok){
  const box = document.getElementById('msgBox');
  box.textContent = text;
  box.className = 'msg-box show ' + (ok ? 'ok' : 'err');
}
function clearMsg(){
  document.getElementById('msgBox').classList.remove('show');
}

async function init(){
  AUTH = await exigirLogin(['expedicao', 'pcp', 'admin']);
  if (!AUTH) return;
  SOMENTE_LEITURA = AUTH.perfil === 'pcp';
  document.getElementById('userNome').textContent = AUTH.nome;
  document.getElementById('userAvatar').textContent = (AUTH.nome || '').trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase() || '··';
  iniciarSininho('sininhoWrap');
  iniciarCartinha('cartinhaWrap');

  if (SOMENTE_LEITURA){
    // PCP só acompanha (visualização) — quem gera romaneio é a Expedição.
    document.getElementById('tabGerar').style.display = 'none';
    mudarAba('historico');
    return;
  }

  // se existe um rascunho de seleção não finalizado (romaneio ainda não gerado),
  // reabre direto no mesmo pedido em vez de perder as marcações num refresh.
  const lastPedidoRaw = localStorage.getItem('fv_exp_last_pedido');
  if (lastPedidoRaw){
    try {
      const p = JSON.parse(lastPedidoRaw);
      if (p && p.id && localStorage.getItem(`fv_exp_draft_${p.id}`)){
        aba = 'gerar';
        document.getElementById('tabGerar').classList.add('active');
        document.getElementById('tabHistorico').classList.remove('active');
        abrirPedido(p);
        return;
      }
    } catch(e) { /* rascunho corrompido, ignora */ }
  }
  mudarAba('gerar');
}

function mudarAba(nome){
  aba = nome;
  pedidoAtual = null;
  itensSelecionados = new Set();
  clearMsg();
  document.getElementById('tabGerar').classList.toggle('active', nome === 'gerar');
  document.getElementById('tabHistorico').classList.toggle('active', nome === 'historico');
  if (nome === 'gerar') renderListaPedidos();
  else renderHistorico();
}

function renderNavGerar(){
  const nav = document.getElementById('navBar');
  if (!pedidoAtual){
    nav.innerHTML = `<span class="nav-crumb active">Pedidos</span>`;
    return;
  }
  nav.innerHTML = `
    <span class="nav-crumb" onclick="renderListaPedidos()">Pedidos</span>
    <span class="nav-sep">/</span>
    <span class="nav-crumb active">${esc(pedidoAtual.numero_pedido)}</span>`;
}

// ── GERAR ROMANEIO ───────────────────────────────────────────────────────
async function renderListaPedidos(){
  pedidoAtual = null;
  renderNavGerar();
  clearMsg();
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="search-row">
      <input id="buscaDesenho" placeholder="Buscar por número do desenho, tag ou pedido..." autocomplete="off">
      <button class="btn btn-primary" onclick="buscarItemExpedicao()">Buscar</button>
    </div>
    <div id="resultadosBusca"></div>
    <div style="font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin:1rem 0 .75rem">Pedidos em carteira</div>
    <div class="grid" id="grid"><div class="empty">Carregando...</div></div>`;
  document.getElementById('buscaDesenho').addEventListener('keydown', e => {
    if (e.key === 'Enter') buscarItemExpedicao();
  });

  const { data, error } = await sb.from('pedidos').select('*').order('numero_pedido');
  const grid = document.getElementById('grid');
  if (error){ grid.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }
  if (!data.length){ grid.innerHTML = `<div class="empty">Nenhum pedido cadastrado.</div>`; return; }

  grid.innerHTML = data.map(p => `
    <div class="card" onclick='abrirPedido(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
      <div class="card-title">${esc(p.numero_pedido)}</div>
      <div class="card-sub">${esc(p.cliente || '')}</div>
      <div class="card-sub">${esc(p.equipamento || '')}</div>
    </div>`).join('');
}

async function buscarItemExpedicao(){
  const termo = document.getElementById('buscaDesenho').value.trim();
  const res = document.getElementById('resultadosBusca');
  if (!termo){ res.innerHTML = ''; return; }
  res.innerHTML = `<div class="empty">Buscando...</div>`;

  const { data, error } = await sb
    .from('itens')
    .select('*, pedidos(id, numero_pedido, cliente, equipamento)')
    .in('status_expedicao', ['pendente', 'parcial'])
    .or(`desenho.ilike.%${termo}%,desenho_cliente.ilike.%${termo}%,tag.ilike.%${termo}%,remessa.ilike.%${termo}%`)
    .order('created_at', { ascending: false })
    .limit(30);

  if (error){ res.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }
  if (!data.length){ res.innerHTML = `<div class="empty">Nenhum item pendente de expedição encontrado.</div>`; return; }

  const porPedido = {};
  data.forEach(it => {
    if (!it.pedidos) return;
    porPedido[it.pedidos.id] = it.pedidos;
  });

  res.innerHTML = `

    <div class="card" onclick='abrirPedido(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
      <div class="card-title">${esc(p.numero_pedido)}</div>
      <div class="card-sub">${esc(p.cliente || '')}</div>
      <div class="card-sub">${esc(p.equipamento || '')}</div>

function abrirPedido(p){
  pedidoAtual = p;
  itensSelecionados = new Set();
  localStorage.setItem('fv_exp_last_pedido', JSON.stringify(p));
  renderItensPedido();
}

function draftKey(){
  return `fv_exp_draft_${pedidoAtual.id}`;
}

function salvarDraft(){
  if (!pedidoAtual) return;
  const dados = {};
  itensSelecionados.forEach(id => {
    const qtdEl = document.getElementById(`qtd-${id}`);
    const volEl = document.getElementById(`vol-${id}`);
    dados[id] = { qtd: qtdEl ? qtdEl.value : '', volume: volEl ? volEl.value : '' };
  });
  if (Object.keys(dados).length) localStorage.setItem(draftKey(), JSON.stringify(dados));
  else localStorage.removeItem(draftKey());
}

function limparDraft(){
  if (!pedidoAtual) return;
  localStorage.removeItem(draftKey());
  localStorage.removeItem('fv_exp_last_pedido');
}

function restaurarDraft(){
  if (!pedidoAtual) return;
  const raw = localStorage.getItem(draftKey());
  if (!raw) return;
  let dados;
  try { dados = JSON.parse(raw); } catch(e) { return; }
  let restaurou = false;
  Object.keys(dados).forEach(idStr => {
    const id = Number(idStr);
    const chk = document.querySelector(`.itemChk[value="${id}"]`);
    if (!chk) return;
    chk.checked = true;
    itensSelecionados.add(id);
    const qtdEl = document.getElementById(`qtd-${id}`);
    const volEl = document.getElementById(`vol-${id}`);
    if (qtdEl){ qtdEl.disabled = false; qtdEl.value = dados[idStr].qtd; }
    if (volEl){ volEl.disabled = false; volEl.value = dados[idStr].volume; }
    validarQtd(id);
    restaurou = true;
  });
  atualizarContagem();
  if (restaurou) showMsg('Seleção anterior restaurada — nada foi perdido na atualização da página.', true);
}

          <td>${esc(it.remessa || '—')}</td>

          <td class="r">

// filtro genérico client-side: procura o termo digitado no atributo data-search
// de cada <tr>, reaproveitado em todas as listas/tabelas de itens e romaneios.
function aplicarFiltroTabela(inputId, wrapId){
  const termo = (document.getElementById(inputId)?.value || '').trim().toLowerCase();
  document.querySelectorAll(`#${wrapId} tbody tr`).forEach(tr => {
    const alvo = tr.dataset.search || '';
    tr.style.display = (!termo || alvo.includes(termo)) ? '' : 'none';
  });
}

function filtrarItensTabela(){
  aplicarFiltroTabela('filtroItens', 'itensWrap');
}

function toggleAll(cb){
  document.querySelectorAll('.itemChk').forEach(el => {
    el.checked = cb.checked;
    toggleItem(Number(el.value), cb.checked, false);
  });
  atualizarContagem();
}

function toggleItem(id, checked){
  if (checked) itensSelecionados.add(id);
  else itensSelecionados.delete(id);
  const input = document.getElementById(`qtd-${id}`);
  input.disabled = !checked;
  document.getElementById(`vol-${id}`).disabled = !checked;
  if (checked) validarQtd(id);
  else salvarDraft();
  atualizarContagem();
}

function validarQtd(id){
  const input = document.getElementById(`qtd-${id}`);
  const disp = disponivelPorItem[id] || 0;
  // peça é sempre inteira — arredonda o que o usuário digitar
  if (input.value !== '' && !Number.isInteger(parseFloat(input.value))){
    input.value = Math.round(parseFloat(input.value));
  }
  const val = parseInt(input.value, 10) || 0;
  const row = document.getElementById(`row-${id}`);
  let aviso = row.querySelector('.aviso-excede');
  if (val > disp){
    input.classList.add('qtd-excede');
    if (!aviso){
      aviso = document.createElement('div');
      aviso.className = 'aviso-excede';
      input.closest('td').appendChild(aviso);
    }
    aviso.textContent = `⚠ acima do disponível (${disp.toLocaleString('pt-BR')})`;
  } else {
    input.classList.remove('qtd-excede');
    if (aviso) aviso.remove();
  }
  salvarDraft();
}

function atualizarContagem(){
  const n = itensSelecionados.size;
  document.getElementById('selCount').textContent = `${n} ite${n === 1 ? 'm' : 'ns'} selecionado${n === 1 ? '' : 's'}`;
  document.getElementById('btnGerar').disabled = n === 0;
}

async function gerarRomaneio(){
  const btn = document.getElementById('btnGerar');
  btn.disabled = true; btn.textContent = 'Gerando...';
  clearMsg();

  const p_itens = [...itensSelecionados].map(id => ({
    item_id: id,
    quantidade: parseInt(document.getElementById(`qtd-${id}`).value, 10) || 0,
    volume: document.getElementById(`vol-${id}`).value.trim() || null,
  })).filter(it => it.quantidade > 0);

  if (!p_itens.length){
    showMsg('Informe uma quantidade válida para os itens selecionados.', false);
    btn.disabled = false; btn.textContent = 'Gerar Romaneio';
    return;
  }

  const { data, error } = await sb.rpc('criar_romaneio', {
    p_pedido_id: pedidoAtual.id,
    p_itens,
  });

  if (error){
    showMsg('Erro ao gerar romaneio: ' + error.message, false);
    btn.disabled = false; btn.textContent = 'Gerar Romaneio';
    return;
  }

  itensSelecionados = new Set();
  limparDraft();
  const dataStr = new Date(data.data_criacao).toLocaleDateString('pt-BR');
  const rotulo = `${data.numero} — Pedido ${pedidoAtual.numero_pedido}${pedidoAtual.cliente ? ' · ' + pedidoAtual.cliente : ''} · ${dataStr}`;
  await renderItensPedido();
  showMsg(`Romaneio gerado com sucesso: ${rotulo}`, true);
}

// ── EDITAR DESCRIÇÃO DE UM ITEM (na tela "Ver itens" da LE) ────────────────
function editarDescricaoItem(itemId){
  const cell = document.getElementById(`descCell-${itemId}`);
  const atual = document.getElementById(`descTxt-${itemId}`).textContent;
  cell.dataset.original = atual;
  cell.innerHTML = `
    <div class="desc-edit-row">
      <input type="text" id="descInput-${itemId}" value="${esc(atual)}">
      <span class="btn" onclick="salvarDescricaoItem(${itemId})">Salvar</span>
      <span class="btn" onclick="cancelarEdicaoDescricao(${itemId})">Cancelar</span>
    </div>`;
  const input = document.getElementById(`descInput-${itemId}`);
  input.focus();
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') salvarDescricaoItem(itemId);
    if (e.key === 'Escape') cancelarEdicaoDescricao(itemId);
  });
}

function restaurarDescCell(itemId, texto){
  const cell = document.getElementById(`descCell-${itemId}`);
  cell.innerHTML = `
    <span class="desc-txt" id="descTxt-${itemId}">${esc(texto)}</span>
    <span class="btn-edit-desc" onclick="editarDescricaoItem(${itemId})" title="Editar descrição">✏️</span>`;
}

function cancelarEdicaoDescricao(itemId){
  const cell = document.getElementById(`descCell-${itemId}`);
  restaurarDescCell(itemId, cell.dataset.original || '');
}

async function salvarDescricaoItem(itemId){
  const input = document.getElementById(`descInput-${itemId}`);
  const novoTexto = input.value.trim();
  const { error } = await sb.rpc('editar_descricao_item_expedicao', { p_item_id: itemId, p_descricao: novoTexto });
  if (error){ alert('Erro ao salvar a descrição: ' + error.message); return; }

  restaurarDescCell(itemId, novoTexto);
  // mantém o Excel (já carregado em memória) consistente sem precisar recarregar a tela toda
  const ri = window.__romaneioAtualExcel?.itens?.find(r => r.item_id === itemId);
  if (ri?.itens) ri.itens.descricao = novoTexto;
}

            <td>${esc(it.desenho)}</td>
            <td>${esc(it.desenho_cliente || '—')}</td>
            <td>${esc(it.tag)}</td>
            <td>${esc(it.remessa || '—')}</td>
            <td>${esc(it.produto)}</td>
            <td class="r">${disp.toLocaleString('pt-BR')}</td>
            <td class="r"><input type="number" class="qtd-input" id="addQtd-${it.id}" step="1" min="1" value="${Math.round(disp)}" disabled></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>
    <button class="btn btn-primary" style="margin-top:10px" onclick="confirmarAdicaoItens(${romaneioId}, '${esc(numero)}')">Adicionar itens selecionados</button>`;
}

async function confirmarAdicaoItens(romaneioId, numero){
  const p_itens = [...document.querySelectorAll('.addChk:checked')].map(chk => {
    const id = Number(chk.value);
    const qtd = parseInt(document.getElementById(`addQtd-${id}`).value, 10) || 0;
    return { item_id: id, quantidade: qtd, volume: null };
  }).filter(it => it.quantidade > 0);

  if (!p_itens.length){ alert('Selecione ao menos um item com quantidade válida.'); return; }

  const { error } = await sb.rpc('adicionar_itens_romaneio', { p_romaneio_id: romaneioId, p_itens });
  if (error){ alert('Erro ao adicionar itens: ' + error.message); return; }

  await verItensRomaneio(romaneioId, numero);
}

// ── IMPORTAR ITENS (fixação/compra externa, comprada fora do sistema) ──────
// Lê uma planilha no mesmo formato da LE que o sistema gera (colunas ITEM,
// DESENHO MDE, DESENHO CLIENTE, DESCRIÇÃO DOS PRODUTOS, QTD, TAG, PESO UNIT,
// VOLUME) e cria os itens direto já como expedidos dentro deste romaneio —
// pra entrarem no Excel final da LE e no Dashboard. Ver importar_itens_romaneio
// no banco (só ela pode criar item com o perfil "expedicao").
const NOMES_COLUNA = {
  desenho: ['DESENHO MDE'],
  desenho_cliente: ['DESENHO CLIENTE'],
  descricao: ['DESCRICAO DOS PRODUTOS', 'DESCRICAO'],
  quantidade: ['QTD', 'QUANTIDADE'],
  tag: ['TAG'],
  peso_unitario: ['PESO UNIT', 'PESO UNITARIO'],
  volume: ['VOLUME'],
};
const RE_DIACRITICOS = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');
function semAcento(s){
  return String(s ?? '').normalize('NFD').replace(RE_DIACRITICOS, '').toUpperCase().trim();
}

function abrirImportarExcel(romaneioId, numero){
  const input = document.getElementById('inputImportarExcel');
  input.dataset.romaneioId = romaneioId;
  input.dataset.numero = numero;
  input.value = '';
  input.click();
}

async function onArquivoImportarSelecionado(inputEl){
  const romaneioId = Number(inputEl.dataset.romaneioId);
  const numero = inputEl.dataset.numero;
  const file = inputEl.files[0];
  if (!file) return;
  const box = document.getElementById('importarBox');
  box.innerHTML = `<div class="empty">Lendo planilha...</div>`;

  try {
    const buffer = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buffer);
    const ws = wb.worksheets[0];
    if (!ws) throw new Error('Planilha vazia ou em formato não reconhecido.');

    // acha a linha de cabeçalho procurando "ITEM" + "DESCRIÇÃO" (ignora
    // linhas de título/logo acima, iguais ao carimbo da própria LE)
    let linhaCabecalho = null, colunas = null;
    ws.eachRow((row, rowNumber) => {
      if (linhaCabecalho) return;
      const textos = row.values.map(semAcento);
      if (textos.includes('ITEM') && textos.some(t => t.startsWith('DESCRICAO'))){
        linhaCabecalho = rowNumber;
        colunas = {};
        row.eachCell((cell, colNumber) => {
          const texto = semAcento(cell.value);
          for (const [campo, nomes] of Object.entries(NOMES_COLUNA)){
            if (nomes.some(n => texto === n || texto.startsWith(n))) colunas[campo] = colNumber;
          }
        });
      }
    });

    if (!linhaCabecalho || !colunas.descricao || !colunas.quantidade){
      throw new Error('Não achei as colunas esperadas (DESCRIÇÃO, QTD...) — confira se é o mesmo formato da LE do sistema.');
    }

    const linhas = [];
    for (let r = linhaCabecalho + 1; r <= ws.rowCount; r++){
      const row = ws.getRow(r);
      const val = (campo) => colunas[campo] ? row.getCell(colunas[campo]).value : null;
      const descricao = val('descricao');
      const quantidade = Number(val('quantidade'));
      if (!descricao || !quantidade) continue; // linha em branco ou fim da tabela
      let tag = val('tag');
      if (tag) tag = String(tag).replace(/^TAG:\s*/i, '').trim();
      linhas.push({
        desenho: val('desenho') ? String(val('desenho')).trim() : null,
        desenho_cliente: val('desenho_cliente') ? String(val('desenho_cliente')).trim() : null,
        descricao: String(descricao).trim(),
        quantidade,
        tag: tag || null,
        peso_unitario: Number(val('peso_unitario')) || 0,
        volume: val('volume') ? String(val('volume')).trim() : null,
      });
    }

    if (!linhas.length) throw new Error('Nenhuma linha de item válida encontrada na planilha.');

    renderPreviewImportar(box, romaneioId, numero, linhas);
  } catch (err) {
    box.innerHTML = `<div class="empty" style="color:var(--red)">Erro ao ler a planilha: ${esc(err.message || err)}</div>`;
  }
}

function renderPreviewImportar(box, romaneioId, numero, linhas){
  window.__itensParaImportar = linhas;
  box.innerHTML = `
    <div style="font-size:12px;font-weight:600;color:var(--text2);margin:14px 0 8px">
      Conferir antes de importar (${linhas.length} item(ns)) — desmarque o que não deve entrar:
    </div>
    <div class="tbl-wrap">
    <table class="dtbl">
      <thead><tr><th class="chk"></th><th>Desenho MDE</th><th>Descrição</th><th>TAG</th><th class="r">Qtd.</th><th class="r">Peso unit. (kg)</th><th>Volume</th></tr></thead>
      <tbody>
        ${linhas.map((it, i) => `<tr>
          <td class="chk"><input type="checkbox" class="importChk" value="${i}" checked></td>
          <td>${esc(it.desenho || '—')}</td>
          <td>${esc(it.descricao)}</td>
          <td>${esc(it.tag || '—')}</td>
          <td class="r">${it.quantidade.toLocaleString('pt-BR')}</td>
          <td class="r">${it.peso_unitario.toLocaleString('pt-BR')}</td>
          <td>${esc(it.volume || '—')}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" onclick="document.getElementById('importarBox').innerHTML=''">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarImportacao(${romaneioId}, '${esc(numero)}')">Confirmar importação para ${esc(numero)}</button>
    </div>`;
}

async function confirmarImportacao(romaneioId, numero){
  const idxSelecionados = [...document.querySelectorAll('.importChk:checked')].map(chk => Number(chk.value));
  const p_itens = idxSelecionados.map(i => window.__itensParaImportar[i]);
  if (!p_itens.length){ alert('Selecione ao menos um item.'); return; }

  const { error } = await sb.rpc('importar_itens_romaneio', { p_romaneio_id: romaneioId, p_itens });
  if (error){ alert('Erro ao importar itens: ' + error.message); return; }

  document.getElementById('importarBox').innerHTML = '';
  showMsg(`${p_itens.length} item(ns) importado(s) para ${numero}.`, true);
  await verItensRomaneio(romaneioId, numero);
}

async function gerarExcelRomaneio(){
  const ctx = window.__romaneioAtualExcel;
  if (!ctx) return;
  const { romaneio, itens } = ctx;
  const dataStr = new Date(romaneio.data_criacao).toLocaleDateString('pt-BR');
  const numeroPedido = romaneio.pedidos?.numero_pedido || '';
  const cliente = romaneio.pedidos?.cliente || '';

  const AZUL_ESCURO = 'FF1A4FA0';
  const AZUL_CLARO  = 'FFDCE6F1';
  const VERDE       = 'FF2E7D32';
  const BRANCO      = 'FFFFFFFF';
  const CINZA_BORDA = 'FFB0B7C3';

  const borda = { style: 'thin', color: { argb: CINZA_BORDA } };
  const bordaFina = { top: borda, left: borda, bottom: borda, right: borda };

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('EXPEDIÇÃO', { views: [{ showGridLines: false }] });

  ws.columns = [
    { width: 9 }, { width: 9 }, { width: 16 }, { width: 16 }, { width: 34 },
    { width: 7 }, { width: 6 }, { width: 14 }, { width: 11 }, { width: 11 }, { width: 9 }, { width: 16 },
  ];
  const N_COLS = 12;

  function setBg(cell, argb){ cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb } }; }
  function whiteBold(cell, size){ cell.font = { bold: true, color: { argb: BRANCO }, size: size || 11 }; }
  function darkBold(cell){ cell.font = { bold: true, color: { argb: 'FF1A1A2E' } }; }

  // ── cabeçalho ──
  // colunas A-B reservadas para a logo (fundo branco), o resto do banner começa na coluna C
  ws.mergeCells(1, 1, 4, 2);
  ws.getCell(1, 1).border = { top: borda, left: borda, bottom: borda, right: borda };

  ws.mergeCells(1, 3, 1, N_COLS);
  const titulo = ws.getCell(1, 3);
  titulo.value = 'SISTEMA DE GESTÃO DA QUALIDADE (SGQ)';
  setBg(titulo, VERDE); whiteBold(titulo, 13);
  titulo.alignment = { horizontal: 'center', vertical: 'middle' };
  ws.getRow(1).height = 24;

  ws.getCell(2, 3).value = 'TIPO';
  ws.mergeCells(2, 4, 2, 7);
  ws.getCell(2, 4).value = 'LISTA DE EMBARQUE';
  ws.getCell(2, 8).value = 'LE:';
  ws.mergeCells(2, 9, 2, N_COLS);
  ws.getCell(2, 9).value = romaneio.numero;

  ws.getCell(3, 3).value = 'TÍTULO';
  ws.mergeCells(3, 4, 3, 7);
  ws.getCell(3, 4).value = 'EXPEDIÇÃO';
  ws.getCell(3, 8).value = 'DATA:';
  ws.mergeCells(3, 9, 3, N_COLS);
  ws.getCell(3, 9).value = dataStr;

  ws.getCell(4, 3).value = 'PEDIDO';
  ws.mergeCells(4, 4, 4, 5);
  ws.getCell(4, 4).value = numeroPedido;
  ws.getCell(4, 6).value = 'CLIENTE';
  ws.mergeCells(4, 7, 4, N_COLS);
  ws.getCell(4, 7).value = cliente;

  [2, 3, 4].forEach(r => {
    for (let c = 3; c <= N_COLS; c++){
      const cell = ws.getCell(r, c);
      setBg(cell, AZUL_ESCURO);
      whiteBold(cell);
      cell.alignment = { vertical: 'middle' };
    }
    ws.getRow(r).height = 18;
  });

  // logo (extraída do modelo em Excel que a empresa já usa), centralizada no
  // bloco reservado A1:B4. Proporção real da imagem: 421x118px (~3.57:1).
  try {
    const logoResp = await fetch('assets/image1.png');
    const logoBuffer = await logoResp.arrayBuffer();
    const logoId = wb.addImage({ buffer: logoBuffer, extension: 'png' });

    // região reservada (colunas A+B, linhas 1-4) em pixels reais
    const colPx = c => Math.round(ws.getColumn(c).width * 7 + 5);
    const rowPx = r => Math.round(ws.getRow(r).height * 96 / 72);
    const regiaoLarguraPx = colPx(1) + colPx(2);
    const regiaoAlturaPx = rowPx(1) + rowPx(2) + rowPx(3) + rowPx(4);

    const RATIO = 421 / 118;
    const margem = 10;
    let logoLargura = regiaoLarguraPx - margem * 2;
    let logoAltura = logoLargura / RATIO;
    if (logoAltura > regiaoAlturaPx - margem * 2){
      logoAltura = regiaoAlturaPx - margem * 2;
      logoLargura = logoAltura * RATIO;
    }

    const offsetXpx = (regiaoLarguraPx - logoLargura) / 2;
    const offsetYpx = (regiaoAlturaPx - logoAltura) / 2;

    // converte o offset X (dentro das colunas 1-2) em unidade fracionária de coluna
    let tlCol;
    if (offsetXpx <= colPx(1)) tlCol = offsetXpx / colPx(1);
    else tlCol = 1 + (offsetXpx - colPx(1)) / colPx(2);

    // converte o offset Y (dentro das linhas 1-4) em unidade fracionária de linha
    let restanteY = offsetYpx, tlRow = 0;
    for (let r = 1; r <= 4; r++){
      const h = rowPx(r);
      if (restanteY <= h){ tlRow = (r - 1) + restanteY / h; break; }
      restanteY -= h;
    }

    ws.addImage(logoId, { tl: { col: tlCol, row: tlRow }, ext: { width: logoLargura, height: logoAltura } });
  } catch (e) {
    console.warn('Não foi possível carregar a logo:', e);
  }

  // ── linha em branco ──
  ws.getRow(5).height = 6;

  // ── cabeçalho da tabela ──
  const headerRow = 6;
  const headers = ['ITEM', 'COD.MDE', 'DESENHO MDE', 'DESENHO CLIENTE', 'DESCRIÇÃO DOS PRODUTOS', 'QTD', 'UNID', 'TAG', 'PESO UNIT', 'PESO TOTAL', 'VOLUME', 'DIMENSÃO'];
  headers.forEach((h, i) => {
    const cell = ws.getCell(headerRow, i + 1);
    cell.value = h;
    setBg(cell, AZUL_CLARO); darkBold(cell);
    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    cell.border = bordaFina;
  });
  ws.getRow(headerRow).height = 26;

  // ── linhas de dados ──
  let totalPeso = 0;
  itens.forEach((ri, i) => {
    const r = headerRow + 1 + i;
    const valores = [
      i + 1,
      ri.itens?.codigo_mde ?? '',
      ri.itens?.desenho ?? '',
      ri.itens?.desenho_cliente ?? '',
      ri.itens?.descricao ?? '',
      Number(ri.quantidade_expedida),
      'PÇ',
      ri.itens?.tag ?? '',
      Number(ri.peso_unitario),
      Number(ri.peso_total),
      ri.volume ?? '',
      '', // DIMENSÃO — preenchido manualmente no Excel
    ];
    valores.forEach((v, ci) => {
      const cell = ws.getCell(r, ci + 1);
      cell.value = v;
      cell.border = bordaFina;
      if (ci === 8 || ci === 9) cell.numFmt = '#,##0.00';
      if ([0,1,5,6,8,9].includes(ci)) cell.alignment = { horizontal: 'center' };
      if (ci === 4) cell.alignment = { horizontal: 'left', wrapText: true };
    });
    totalPeso += Number(ri.peso_total);
  });

  // mescla células consecutivas que compartilham o mesmo volume
  let inicio = null;
  for (let i = 0; i <= itens.length; i++){
    const vol = i < itens.length ? (itens[i].volume || '') : '__fim__';
    const volAnterior = i > 0 ? (itens[i - 1].volume || '') : null;
    if (i > 0 && vol !== volAnterior){
      if (volAnterior && i - inicio > 1){
        ws.mergeCells(headerRow + 1 + inicio, 11, headerRow + i, 11);
        ws.getCell(headerRow + 1 + inicio, 11).alignment = { horizontal: 'center', vertical: 'middle' };
        ws.mergeCells(headerRow + 1 + inicio, 12, headerRow + i, 12);
        ws.getCell(headerRow + 1 + inicio, 12).alignment = { horizontal: 'center', vertical: 'middle' };
      }
      inicio = i;
    }
  }

  // ── rodapé ──
  const rodapeInicio = headerRow + itens.length + 2;
  ws.mergeCells(rodapeInicio, 2, rodapeInicio, 5);
  ws.getCell(rodapeInicio, 1).value = 'EXPEDIDOR';
  ws.getCell(rodapeInicio, 7).value = 'PESO TOTAL DA LE:';
  ws.getCell(rodapeInicio, 8).value = Number(totalPeso.toFixed(2));
  ws.getCell(rodapeInicio, 8).numFmt = '#,##0.00 "kg"';

  ws.mergeCells(rodapeInicio + 1, 2, rodapeInicio + 1, 5);
  ws.getCell(rodapeInicio + 1, 1).value = 'VEÍCULO';
  ws.getCell(rodapeInicio + 1, 7).value = 'TOTAL DE VOLUMES:';
  // deixado em branco de propósito — preenchido manualmente no Excel

  [rodapeInicio, rodapeInicio + 1].forEach(r => {
    for (let c = 1; c <= N_COLS; c++){
      const cell = ws.getCell(r, c);
      cell.border = bordaFina;
      if (c === 1 || c === 7) darkBold(cell);
    }
    ws.getRow(r).height = 18;
  });

  ws.autoFilter = { from: { row: headerRow, column: 1 }, to: { row: headerRow, column: N_COLS } };
  ws.views = [{ state: 'frozen', ySplit: headerRow, showGridLines: false }];

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${romaneio.numero} - Pedido ${numeroPedido} - ${dataStr.replace(/\//g,'-')}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

init().catch(err => {
  document.getElementById('content').innerHTML =
    `<div class="empty">Erro ao iniciar a página: ${esc(err.message || err)}</div>`;
  console.error('Erro no init():', err);
});
</script>
