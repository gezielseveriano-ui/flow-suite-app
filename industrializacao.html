<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Flow Suite">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Flow Suite — Industrialização</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{
  --navy:#0b1e33; --navy2:#102A43; --navy3:#173a5e;
  --bg:#F8FAFC; --bg2:#ffffff; --bg3:#F1F5F9; --bg4:#E9EDF3;
  --border:#E5E7EB; --border-strong:#CBD5E1; --text:#111827; --text2:#6B7280; --text3:#9CA3AF;
  --blue:#1D4ED8; --blue-dim:#DBEAFE; --blue-hover:#1E40AF; --header-bg:#102A43;
  --green:#10B981; --green-dim:#D1FAE5;
  --amber:#b5690a; --amber-dim:#faedd9;
  --red:#DC2626; --red-dim:#FEE2E2;
  --radius:16px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 8px 20px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}

/* ── APP SHELL: header + sidebar + content ── */
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.app-header{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 22px;background:var(--header-bg);border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:100}
.app-header-brand{display:flex;align-items:center;gap:10px}
.app-header-brand .logo-full{height:42px;width:auto;flex-shrink:0;display:block}
.app-header-right{display:flex;align-items:center;gap:12px}
.header-user{font-size:12px;color:rgba(255,255,255,.6);text-align:right;line-height:1.3}
.header-user strong{color:#fff;font-weight:600;display:block;font-size:12.5px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn svg{width:15px;height:15px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4f8ef7,#7c6cf0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}

.app-body{flex:1;display:flex;min-height:0}
.sidebar{width:222px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:16px 10px;transition:width .15s ease}
.app-shell.sidebar-collapsed .sidebar{width:68px}
.app-shell.sidebar-collapsed .nav-label,.app-shell.sidebar-collapsed .collapse-label{display:none}
.sidebar-nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.66);text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--blue);color:#fff;font-weight:600}
.collapse-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.45);background:none;border:none;cursor:pointer;font-size:12.5px;width:100%;font-family:inherit}
.collapse-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.collapse-btn svg{width:15px;height:15px;transition:transform .15s;flex-shrink:0}
.app-shell.sidebar-collapsed .collapse-btn svg{transform:rotate(180deg)}

/* botão flutuante pra abrir/fechar o menu lateral — ver explicação nas outras
   páginas: o botão original fica preso embaixo da sidebar, que estica com o
   conteúdo. Esse é fixo na viewport, e o menu fecha sozinho alguns segundos
   depois de carregar, a não ser que a pessoa já tenha mexido nele antes. */
.sidebar-fab{position:fixed;bottom:20px;left:16px;z-index:260;width:46px;height:46px;border-radius:50%;background:var(--navy2);border:1px solid rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-md);transition:background .12s,transform .12s}
.sidebar-fab:hover{background:var(--navy3);transform:scale(1.06)}
.sidebar-fab svg{width:20px;height:20px;transition:transform .2s;flex-shrink:0}
.app-shell.sidebar-collapsed .sidebar-fab svg{transform:rotate(180deg)}

.content{flex:1;min-width:0;padding:1.75rem 2rem;overflow-y:auto}

.btn{display:inline-block;padding:8px 15px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:12.5px;cursor:pointer;font-weight:500;transition:border-color .12s,color .12s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--blue-hover);border-color:var(--blue-hover);color:#fff}
.btn-primary:disabled{opacity:.5;cursor:default}

.notice{margin:0 0 1.25rem;padding:11px 16px;background:var(--amber-dim);color:var(--amber);border-radius:var(--radius-sm);font-size:12.5px;border:1px solid rgba(181,105,10,.15)}

.tabs{display:flex;gap:8px;padding:.75rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border)}
.tab{padding:9px 18px;font-size:13px;color:var(--text2);cursor:pointer;border-radius:var(--radius-sm);font-weight:500;background:var(--bg3);border:1px solid var(--border);transition:all .12s}
.tab:hover{background:var(--bg4);color:var(--text)}
.tab.active{background:var(--blue);color:#fff;font-weight:600;border-color:var(--blue)}

.nav-bar{display:flex;align-items:center;gap:6px;padding:.6rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);font-size:12px}
.nav-crumb{color:var(--text2);cursor:pointer;padding:3px 8px;border-radius:6px}
.nav-crumb:hover{background:var(--bg3);color:var(--text)}
.nav-crumb.active{color:var(--blue);font-weight:500}
.nav-sep{color:var(--text3)}

.wrap{padding:1.25rem 1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.search-row{display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap}
.search-row input{flex:1;min-width:220px;padding:13px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:16px}
.search-row input:focus{outline:none;border-color:var(--blue)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;cursor:pointer;transition:all .12s;box-shadow:var(--shadow-sm)}
.card:hover{border-color:var(--blue);background:var(--blue-dim);box-shadow:var(--shadow-md)}
.card-title{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--text)}
.card-sub{font-size:12px;color:var(--blue)}
.empty{text-align:center;padding:3rem 2rem;color:var(--text2);font-size:13px}

.tbl-wrap{overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl thead th{text-align:left;padding:8px 10px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap;background:var(--bg3)}
.dtbl tbody tr{border-bottom:1px solid var(--border)}
.dtbl tbody tr:hover td{background:var(--bg3)}
.dtbl tbody td{padding:7px 10px;vertical-align:middle}
.dtbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.dtbl td.chk{width:36px}
.qtd-input{width:80px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:12px;text-align:right;font-weight:600}
.qtd-input:focus{outline:none;border-color:var(--blue)}
.qtd-input:disabled{background:transparent;border-style:dashed;color:var(--text3);font-weight:400}
.valor-input{width:80px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:12px;text-align:right}
.valor-input:focus{outline:none;border-color:var(--blue)}
.valor-input:disabled{background:transparent;border-style:dashed;color:var(--text3)}

.footer-bar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:.9rem 1.5rem;background:var(--bg2);border-top:1px solid var(--border);margin-top:1rem}
.sel-count{font-size:12px;color:var(--text2)}
.msg-box{margin:1rem 1.5rem;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;display:none}
.msg-box.show{display:block}
.msg-box.err{background:var(--red-dim);color:var(--red)}
.msg-box.ok{background:var(--green-dim);color:var(--green)}

.form-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem;margin:0 1.5rem 1.25rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;box-shadow:var(--shadow-sm)}
.form-box label{font-size:11px;color:var(--text2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-box input,.form-box select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text);font-size:13px}
.form-box input:focus,.form-box select:focus{outline:none;border-color:var(--blue)}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:200;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:1rem}
.field{margin-bottom:12px}
.field label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px}
.field input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text);font-size:13px}
.field input:focus{outline:none;border-color:var(--blue)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:1.25rem}
.err-box{background:var(--red-dim);color:var(--red);padding:9px 12px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:12px;display:none}
.err-box.show{display:block}
</style>
</head>

<script>
let AUTH = null;
let SOMENTE_LEITURA = false;
let aba = 'gerar';
let pedidoAtual = null;

// ── MENU LATERAL: fecha sozinho e tem botão flutuante sempre alcançável ────
let sidebarMexidoManualmente = false;
function alternarSidebar(manual){
  document.getElementById('appShell').classList.toggle('sidebar-collapsed');
  if (manual) sidebarMexidoManualmente = true;
  if (typeof posicionarBarraFlutuante === 'function') setTimeout(posicionarBarraFlutuante, 180);
}
setTimeout(() => {
  if (sidebarMexidoManualmente) return;
  document.getElementById('appShell').classList.add('sidebar-collapsed');
  if (typeof posicionarBarraFlutuante === 'function') setTimeout(posicionarBarraFlutuante, 180);
}, 5000);
let itensSelecionados = new Set();
let fornecedorEditandoId = null;

function showMsg(text, ok){
  const box = document.getElementById('msgBox');
  box.textContent = text;
  box.className = 'msg-box show ' + (ok ? 'ok' : 'err');
}
function clearMsg(){ document.getElementById('msgBox').classList.remove('show'); }
function abrirModal(id){ document.getElementById(id).classList.add('show'); }
function fecharModal(id){ document.getElementById(id).classList.remove('show'); }

async function init(){
  AUTH = await exigirLogin(['pcp', 'expedicao', 'admin']);
  if (!AUTH) return;
  SOMENTE_LEITURA = AUTH.perfil === 'pcp';
  document.getElementById('userNome').textContent = AUTH.nome;
  document.getElementById('userAvatar').textContent = (AUTH.nome || '').trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase() || '··';
  iniciarSininho('sininhoWrap');
  iniciarCartinha('cartinhaWrap');
  if (SOMENTE_LEITURA){
    // PCP só acompanha (visualização) — quem gera LI e cadastra fornecedor é a Expedição.
    document.getElementById('tabGerar').style.display = 'none';
    document.getElementById('tabFornecedores').style.display = 'none';
    mudarAba('historico');
    return;
  }
  mudarAba('gerar');
}

function mudarAba(nome){
  aba = nome;
  pedidoAtual = null;
  itensSelecionados = new Set();
  clearMsg();
  document.getElementById('tabGerar').classList.toggle('active', nome === 'gerar');
  document.getElementById('tabHistorico').classList.toggle('active', nome === 'historico');
  document.getElementById('tabFornecedores').classList.toggle('active', nome === 'fornecedores');
  if (nome === 'gerar') renderListaPedidos();
  else if (nome === 'historico') renderHistorico();
  else renderFornecedores();
}

function aplicarFiltroTabela(inputId, wrapId){
  const termo = (document.getElementById(inputId)?.value || '').trim().toLowerCase();
  document.querySelectorAll(`#${wrapId} tbody tr`).forEach(tr => {
    const alvo = tr.dataset.search;
    if (alvo === undefined) return;
    tr.style.display = (!termo || alvo.includes(termo)) ? '' : 'none';
  });
}

// ── GERAR LI ─────────────────────────────────────────────────────────────
function renderNavGerar(){
  const nav = document.getElementById('navBar');
  if (!pedidoAtual){ nav.innerHTML = `<span class="nav-crumb active">Pedidos</span>`; return; }
  nav.innerHTML = `
    <span class="nav-crumb" onclick="renderListaPedidos()">Pedidos</span>
    <span class="nav-sep">/</span>
    <span class="nav-crumb active">${esc(pedidoAtual.numero_pedido)}</span>`;
}

async function renderListaPedidos(){
  pedidoAtual = null;
  renderNavGerar();
  clearMsg();
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="wrap">
    <div class="search-row"><input id="filtroPedidos" placeholder="Filtrar por número do pedido ou cliente..." oninput="filtrarPedidosLI()"></div>

    </div>`;

  const { data, error } = await sb.from('pedidos').select('*').order('numero_pedido');

  if (error){ grid.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }
  if (!data.length){ grid.innerHTML = `<div class="empty">Nenhum pedido cadastrado.</div>`; return; }
  desenharGridPedidosLI(data);
}

function desenharGridPedidosLI(data){
  const grid = document.getElementById('grid');
  grid.innerHTML = data.map(p => `
    <div class="card" onclick='abrirPedidoLI(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
      <div class="card-title">${esc(p.numero_pedido)}</div>
      <div class="card-sub">${esc(p.cliente || '')}</div>
      <div class="card-sub" style="color:var(--text2)">${esc(p.equipamento || '')}</div>
    </div>`).join('');
}

function filtrarPedidosLI(){
  const termo = document.getElementById('filtroPedidos').value.trim().toLowerCase();
  const lista = (window.__pedidosLI || []).filter(p =>
    !termo || p.numero_pedido.toLowerCase().includes(termo) || (p.cliente||'').toLowerCase().includes(termo));
  desenharGridPedidosLI(lista);
}

function abrirPedidoLI(p){
  pedidoAtual = p;
  itensSelecionados = new Set();
  renderItensPedidoLI();
}

function toggleAllLI(cb){
  document.querySelectorAll('.itemChkLI').forEach(el => {
    el.checked = cb.checked;
    toggleItemLI(Number(el.value), cb.checked);
  });
}

function toggleItemLI(id, checked){
  if (checked) itensSelecionados.add(id); else itensSelecionados.delete(id);
  document.getElementById(`qtdli-${id}`).disabled = !checked;
  document.getElementById(`valli-${id}`).disabled = !checked;
  const n = itensSelecionados.size;
  document.getElementById('selCountLI').textContent = `${n} ite${n===1?'m':'ns'} selecionado${n===1?'':'s'}`;
  document.getElementById('btnGerarLI').disabled = n === 0;
}

async function gerarLI(){
  const fornecedorId = document.getElementById('liFornecedor').value;
  if (!fornecedorId){ showMsg('Selecione o fornecedor.', false); return; }

  const btn = document.getElementById('btnGerarLI');
  btn.disabled = true; btn.textContent = 'Gerando...';
  clearMsg();

  const p_itens = [...itensSelecionados].map(id => ({
    item_id: id,
    quantidade: parseInt(document.getElementById(`qtdli-${id}`).value, 10) || 0,
    valor_unitario: parseFloat(document.getElementById(`valli-${id}`).value) || 0,
  })).filter(it => it.quantidade > 0);

  if (!p_itens.length){
    showMsg('Informe uma quantidade válida para os itens selecionados.', false);
    btn.disabled = false; btn.textContent = 'Gerar LI';
    return;
  }

  const { data, error } = await sb.rpc('criar_industrializacao', {
    p_pedido_id: pedidoAtual.id,
    p_fornecedor_id: Number(fornecedorId),
    p_natureza_operacao: document.getElementById('liNatureza').value.trim() || null,
    p_oc: document.getElementById('liOc').value.trim() || null,
    p_itens,
  });

  if (error){
    showMsg('Erro ao gerar LI: ' + error.message, false);
    btn.disabled = false; btn.textContent = 'Gerar LI';
    return;
  }

  itensSelecionados = new Set();
  const rotulo = `${data.numero} — Pedido ${pedidoAtual.numero_pedido}`;
  await renderItensPedidoLI();
  showMsg(`LI gerada com sucesso: ${rotulo}`, true);
}

}

async function carregarItensParaAdicionarLI(liId, pedidoId, numero){
  const box = document.getElementById('addItemLIBox');
  if (!box) return;
  box.innerHTML = `<div class="empty">Carregando itens disponíveis...</div>`;

  const [{ data: itens, error }, { data: jaNaLi, error: errJa }] = await Promise.all([
    sb.from('itens').select('*').eq('pedido_id', pedidoId).order('desenho'),
    sb.from('industrializacao_itens').select('item_id').eq('industrializacao_id', liId),
  ]);
  if (error || errJa){ box.innerHTML = `<div class="empty">Erro: ${esc((error||errJa).message)}</div>`; return; }

  const jaIds = new Set((jaNaLi || []).map(r => r.item_id));
  const disponiveis = itens.filter(it => !jaIds.has(it.id));

  if (!disponiveis.length){
    box.innerHTML = `<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:8px">+ Adicionar item a esta LI</div><div class="empty">Todos os itens deste pedido já estão nesta LI.</div>`;

      <tbody>
        ${disponiveis.map(it => {
          const chave = `${it.codigo_mde} ${it.desenho||''} ${it.desenho_cliente||''} ${it.tag||''} ${it.remessa||''} ${it.produto||''}`.toLowerCase();

            <td>${esc(it.tag)}</td>

            <td class="r"><input type="number" class="qtd-input" id="addQtdLI-${it.id}" step="1" min="1" value="${Math.round(Number(it.quantidade))}" disabled></td>
            <td class="r"><input type="number" class="valor-input" id="addValLI-${it.id}" step="0.01" min="0" placeholder="0,00" disabled></td>
          </tr>`;
        }).join('')}

async function confirmarAdicaoItensLI(liId, numero){
  const p_itens = [...document.querySelectorAll('.addChkLI:checked')].map(chk => {
    const id = Number(chk.value);
    return {
      item_id: id,
      quantidade: parseInt(document.getElementById(`addQtdLI-${id}`).value, 10) || 0,
      valor_unitario: parseFloat(document.getElementById(`addValLI-${id}`).value) || 0,
    };
  }).filter(it => it.quantidade > 0);

  if (!p_itens.length){ alert('Selecione ao menos um item com quantidade válida.'); return; }

  const { error } = await sb.rpc('adicionar_itens_industrializacao', { p_industrializacao_id: liId, p_itens });
  if (error){ alert('Erro ao adicionar itens: ' + error.message); return; }

  await verItensLI(liId, numero);
}

function abrirNovoFornecedor(){
  fornecedorEditandoId = null;
  document.getElementById('tituloFornecedor').textContent = 'Novo Fornecedor';
  document.getElementById('formFornecedor').reset();
  document.getElementById('errFornecedor').classList.remove('show');
  abrirModal('ovFornecedor');
}

function editarFornecedor(id){
  const f = (window.__fornecedoresLista || []).find(x => x.id === id);
  if (!f) return;
  fornecedorEditandoId = id;
  document.getElementById('tituloFornecedor').textContent = 'Editar Fornecedor';
  document.getElementById('ffRazaoSocial').value = f.razao_social || '';
  document.getElementById('ffEndereco').value = f.endereco || '';
  document.getElementById('ffCep').value = f.cep || '';
  document.getElementById('ffCidade').value = f.cidade || '';
  document.getElementById('ffUf').value = f.uf || '';
  document.getElementById('ffTelefone').value = f.telefone || '';
  document.getElementById('ffCnpj').value = f.cnpj || '';
  document.getElementById('ffInscEst').value = f.inscricao_estadual || '';
  document.getElementById('errFornecedor').classList.remove('show');
  abrirModal('ovFornecedor');
}

document.getElementById('formFornecedor').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('errFornecedor');
  errBox.classList.remove('show');

  const payload = {
    razao_social: document.getElementById('ffRazaoSocial').value.trim(),
    endereco: document.getElementById('ffEndereco').value.trim() || null,
    cep: document.getElementById('ffCep').value.trim() || null,
    cidade: document.getElementById('ffCidade').value.trim() || null,
    uf: document.getElementById('ffUf').value.trim().toUpperCase() || null,
    telefone: document.getElementById('ffTelefone').value.trim() || null,
    cnpj: document.getElementById('ffCnpj').value.trim() || null,
    inscricao_estadual: document.getElementById('ffInscEst').value.trim() || null,
  };

  const { error } = fornecedorEditandoId
    ? await sb.from('fornecedores').update(payload).eq('id', fornecedorEditandoId)
    : await sb.from('fornecedores').insert(payload);

  if (error){
    errBox.textContent = 'Erro ao salvar: ' + error.message;
    errBox.classList.add('show');
    return;
  }

  fecharModal('ovFornecedor');
  renderFornecedores();
});

async function gerarExcelLI(){
  const ctx = window.__liAtualExcel;
  if (!ctx) return;
  const { li, itens } = ctx;
  const dataStr = new Date(li.data_criacao).toLocaleDateString('pt-BR');
  const numeroPedido = li.pedidos?.numero_pedido || '';
  const cliente = li.pedidos?.cliente || '';
  const forn = li.fornecedores || {};

  const AZUL_ESCURO = 'FF1A4FA0';
  const AZUL_CLARO  = 'FFDCE6F1';
  const VERDE       = 'FF2E7D32';
  const BRANCO      = 'FFFFFFFF';
  const CINZA_BORDA = 'FFB0B7C3';

  const borda = { style: 'thin', color: { argb: CINZA_BORDA } };
  const bordaFina = { top: borda, left: borda, bottom: borda, right: borda };

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('INDUSTRIALIZAÇÃO', { views: [{ showGridLines: false }] });

  ws.columns = [
    { width: 7 }, { width: 14 }, { width: 8 }, { width: 10 }, { width: 30 },
    { width: 7 }, { width: 6 }, { width: 14 }, { width: 11 }, { width: 11 }, { width: 10 }, { width: 11 }, { width: 9 },
  ];
  const N_COLS = 13;

  function setBg(cell, argb){ cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb } }; }
  function whiteBold(cell, size){ cell.font = { bold: true, color: { argb: BRANCO }, size: size || 11 }; }
  function darkBold(cell){ cell.font = { bold: true, color: { argb: 'FF1A1A2E' } }; }

  // ── cabeçalho ──
  ws.mergeCells(1, 1, 4, 2);
  ws.getCell(1, 1).border = { top: borda, left: borda, bottom: borda, right: borda };

  ws.mergeCells(1, 3, 1, N_COLS);
  const titulo = ws.getCell(1, 3);
  titulo.value = 'SISTEMA DE GESTÃO DA QUALIDADE (SGQ)';
  setBg(titulo, VERDE); whiteBold(titulo, 13);
  titulo.alignment = { horizontal: 'center', vertical: 'middle' };
  ws.getRow(1).height = 24;

  ws.getCell(2, 3).value = 'TIPO';
  ws.mergeCells(2, 4, 2, 9);
  ws.getCell(2, 4).value = 'SOLICITAÇÃO';
  ws.getCell(2, 10).value = 'Nº LI:';
  ws.mergeCells(2, 11, 2, N_COLS);
  ws.getCell(2, 11).value = li.numero;

  ws.getCell(3, 3).value = 'TÍTULO';
  ws.mergeCells(3, 4, 3, 9);
  ws.getCell(3, 4).value = 'EMISSÃO DE NOTA FISCAL';
  ws.getCell(3, 10).value = 'DATA:';
  ws.mergeCells(3, 11, 3, N_COLS);
  ws.getCell(3, 11).value = dataStr;

  ws.getCell(4, 3).value = 'SOLICITANTE';
  ws.mergeCells(4, 4, 4, N_COLS);
  ws.getCell(4, 4).value = `Industrialização - Pedido ${numeroPedido}${cliente ? ' ' + cliente : ''}`;

  [2, 3, 4].forEach(r => {
    for (let c = 3; c <= N_COLS; c++){
      const cell = ws.getCell(r, c);
      setBg(cell, AZUL_ESCURO);
      whiteBold(cell);
      cell.alignment = { vertical: 'middle' };
    }
    ws.getRow(r).height = 18;
  });

  // logo (mesma extraída do modelo já usado na LE)
  try {
    const logoResp = await fetch('assets/image1.png');
    const logoBuffer = await logoResp.arrayBuffer();
    const logoId = wb.addImage({ buffer: logoBuffer, extension: 'png' });
    const colPx = c => Math.round(ws.getColumn(c).width * 7 + 5);
    const rowPx = r => Math.round(ws.getRow(r).height * 96 / 72);
    const regiaoLarguraPx = colPx(1) + colPx(2);
    const regiaoAlturaPx = rowPx(1) + rowPx(2) + rowPx(3) + rowPx(4);
    const RATIO = 421 / 118;
    const margem = 10;
    let logoLargura = regiaoLarguraPx - margem * 2;
    let logoAltura = logoLargura / RATIO;
    if (logoAltura > regiaoAlturaPx - margem * 2){
      logoAltura = regiaoAlturaPx - margem * 2;
      logoLargura = logoAltura * RATIO;
    }
    const offsetXpx = (regiaoLarguraPx - logoLargura) / 2;
    const offsetYpx = (regiaoAlturaPx - logoAltura) / 2;
    let tlCol;
    if (offsetXpx <= colPx(1)) tlCol = offsetXpx / colPx(1);
    else tlCol = 1 + (offsetXpx - colPx(1)) / colPx(2);
    let restanteY = offsetYpx, tlRow = 0;
    for (let r = 1; r <= 4; r++){
      const h = rowPx(r);
      if (restanteY <= h){ tlRow = (r - 1) + restanteY / h; break; }
      restanteY -= h;
    }
    ws.addImage(logoId, { tl: { col: tlCol, row: tlRow }, ext: { width: logoLargura, height: logoAltura } });
  } catch (e) { console.warn('Não foi possível carregar a logo:', e); }

  // ── natureza da operação / destinatário ──
  ws.getCell(5, 1).value = 'NAT. OPERAÇÃO / FINALIDADE NF:';
  ws.mergeCells(5, 1, 5, 3);
  ws.mergeCells(5, 4, 5, N_COLS);
  ws.getCell(5, 4).value = li.natureza_operacao || '';

  ws.getCell(6, 1).value = 'DESTINATÁRIO / RAZÃO SOCIAL:';
  ws.mergeCells(6, 1, 6, 2);
  ws.mergeCells(6, 3, 6, N_COLS);
  ws.getCell(6, 3).value = forn.razao_social || '';

  ws.getCell(7, 1).value = 'ENDEREÇO:';
  ws.mergeCells(7, 2, 7, 7);
  ws.getCell(7, 2).value = forn.endereco || '';
  ws.getCell(7, 8).value = 'CEP:';
  ws.getCell(7, 9).value = forn.cep || '';
  ws.getCell(7, 10).value = 'CIDADE:';
  ws.mergeCells(7, 11, 7, 12);
  ws.getCell(7, 11).value = forn.cidade || '';
  ws.getCell(7, 13).value = forn.uf || '';

  ws.getCell(8, 1).value = 'CNPJ:';
  ws.mergeCells(8, 2, 8, 4);
  ws.getCell(8, 2).value = forn.cnpj || '';
  ws.getCell(8, 5).value = 'INSC. EST.:';
  ws.mergeCells(8, 6, 8, 8);
  ws.getCell(8, 6).value = forn.inscricao_estadual || '';
  ws.getCell(8, 9).value = 'TELEFONE:';
  ws.mergeCells(8, 10, 8, N_COLS);
  ws.getCell(8, 10).value = forn.telefone || '';

  [5, 6, 7, 8].forEach(r => {
    for (let c = 1; c <= N_COLS; c++){
      const cell = ws.getCell(r, c);
      cell.border = bordaFina;
      cell.alignment = { vertical: 'middle' };
    }
    darkBold(ws.getCell(r, 1));
    ws.getRow(r).height = 16;
  });

  ws.getRow(9).height = 6;

  // ── cabeçalho da tabela ──
  const headerRow = 10;
  const headers = ['ITEM', 'DESENHO', 'POS', 'CÓD. PRODUTO', 'DESCRIÇÃO DOS PRODUTOS', 'QTD', 'UNID', 'TAG', 'PESO UNIT. (kg)', 'PESO TOTAL', 'VALOR UNIT.', 'VALOR TOTAL', 'O.C.'];
  headers.forEach((h, i) => {
    const cell = ws.getCell(headerRow, i + 1);
    cell.value = h;
    setBg(cell, AZUL_CLARO); darkBold(cell);
    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    cell.border = bordaFina;
  });
  ws.getRow(headerRow).height = 26;

  // ── linhas de dados ──
  let totalPeso = 0, totalValor = 0;
  itens.forEach((ii, i) => {
    const r = headerRow + 1 + i;
    const valores = [
      i + 1,
      ii.itens?.desenho ?? '',
      'N/A',
      'N/A',
      ii.itens?.descricao ?? '',
      Number(ii.quantidade),
      'PÇ',
      ii.itens?.tag ?? '',
      Number(ii.peso_unitario),
      Number(ii.peso_total),
      Number(ii.valor_unitario),
      Number(ii.valor_total),
      li.oc || '',
    ];
    valores.forEach((v, ci) => {
      const cell = ws.getCell(r, ci + 1);
      cell.value = v;
      cell.border = bordaFina;
      if (ci === 8 || ci === 9) cell.numFmt = '#,##0.00';
      if (ci === 10 || ci === 11) cell.numFmt = '"R$" #,##0.00';
      if ([0,1,2,3,5,6,8,9,10,11,12].includes(ci)) cell.alignment = { horizontal: 'center' };
      if (ci === 4) cell.alignment = { horizontal: 'left', wrapText: true };
    });
    totalPeso += Number(ii.peso_total);
    totalValor += Number(ii.valor_total);
  });

  // ── rodapé ──
  const totalRow = headerRow + itens.length + 1;
  ws.getCell(totalRow, 1).value = 'TOTAL';
  darkBold(ws.getCell(totalRow, 1));
  ws.getCell(totalRow, 9).value = Number(totalPeso.toFixed(2));
  ws.getCell(totalRow, 9).numFmt = '#,##0.00';
  ws.getCell(totalRow, 12).value = Number(totalValor.toFixed(2));
  ws.getCell(totalRow, 12).numFmt = '"R$" #,##0.00';
  for (let c = 1; c <= N_COLS; c++) ws.getCell(totalRow, c).border = bordaFina;

  const transpInicio = totalRow + 2;
  ws.mergeCells(transpInicio, 1, transpInicio, N_COLS);
  ws.getCell(transpInicio, 1).value = 'DADOS DA TRANSPORTADORA';
  setBg(ws.getCell(transpInicio, 1), AZUL_CLARO); darkBold(ws.getCell(transpInicio, 1));

  ws.getCell(transpInicio + 1, 1).value = 'TRANSPORTADORA:';
  ws.getCell(transpInicio + 1, 3).value = 'MDE';
  ws.getCell(transpInicio + 1, 10).value = 'PLACA DO VEÍCULO:';

  ws.getCell(transpInicio + 2, 1).value = 'FRETE:';
  ws.getCell(transpInicio + 2, 2).value = 'CIF (   )      FOB (   )';

  [transpInicio + 1, transpInicio + 2].forEach(r => {
    for (let c = 1; c <= N_COLS; c++) ws.getCell(r, c).border = bordaFina;
    darkBold(ws.getCell(r, 1));
    ws.getRow(r).height = 18;
  });

  ws.autoFilter = { from: { row: headerRow, column: 1 }, to: { row: headerRow, column: N_COLS } };
  ws.views = [{ state: 'frozen', ySplit: headerRow, showGridLines: false }];

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${li.numero} - Pedido ${numeroPedido} - ${dataStr.replace(/\//g,'-')}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

init().catch(err => {
  document.getElementById('content').innerHTML =
    `<div class="empty">Erro ao iniciar a página: ${esc(err.message || err)}</div>`;
  console.error('Erro no init():', err);
});
</script>
</body>
</html>
