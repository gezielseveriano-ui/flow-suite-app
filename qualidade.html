function linhaItemDatabook(it){
  const st = statusItemDatabook(it);
  const [cls, lbl] = DB_CHIP[st];
  const arqs = it.arquivos || [];
  const pags = arqs.reduce((s, a) => s + (a.paginas || 0), 0);
  const ehModelo = DB_MODELO.some(m => m[1] === it.codigo);
  const exportar = it.origem === 'rnc' ? `<button class="btn btn-sm so-editor" onclick="exportarRNCsDatabook(${it.id})" ${DB_SERVICO_ON && DB_ATUAL.pasta ? '' : 'disabled'} title="Gera o PDF de cada RNC deste pedido e salva na pasta do item">📤 Exportar RNCs do pedido</button>`
    : it.origem === 'desenhos' ? `<button class="btn btn-sm so-editor" onclick="exportarDesenhosDatabook(${it.id})" ${DB_SERVICO_ON && DB_ATUAL.pasta ? '' : 'disabled'} title="Gera a lista com os desenhos que a Engenharia subiu para este pedido">📤 Gerar lista de desenhos</button>` : '';
  return `<tr class="${it.aplicavel ? '' : 'na'}">
    <td class="chk"><input type="checkbox" ${it.aplicavel ? 'checked' : ''} ${SOMENTE_LEITURA ? 'disabled' : ''} title="Aplicável a este pedido" onchange="marcarAplicavelDatabook(${it.id}, this.checked)"></td>
    <td class="cod">${esc(it.codigo)}</td>
    <td>${esc(it.descricao)}${it.aplicavel && exportar ? `<div style="margin-top:4px">${exportar}</div>` : ''}</td>
    <td class="arq">${it.aplicavel ? (arqs.length ? `${arqs.length} arquivo(s) · ${pags} pág.<ul class="db-arq-lista">${arqs.slice(0, 6).map(a => `<li class="${a.erro ? 'erro' : ''}">${esc(a.nome)}${a.erro ? ' — ' + esc(a.erro) : ` (${a.paginas} pág.)`}</li>`).join('')}${arqs.length > 6 ? `<li>… mais ${arqs.length - 6}</li>` : ''}</ul>` : 'Nenhum arquivo na pasta') : ''}</td>
    <td class="st"><span class="status-badge ${cls}">${lbl}</span></td>
    <td style="white-space:nowrap;width:70px">${it.aplicavel ? `<button class="btn btn-sm" title="Abrir a pasta deste item" onclick="abrirPastaDatabook({capitulo:${it.capitulo}, codigo:'${esc(it.codigo)}'})" ${DB_SERVICO_ON && DB_ATUAL.pasta ? '' : 'disabled'}>📁</button>` : ''}
      ${!ehModelo ? `<button class="btn btn-sm so-editor" title="Remover item" onclick="removerItemDatabook(${it.id})">✕</button>` : ''}</td>
  </tr>`;
}

async function salvarCabecalhoDatabook(){
  const v = id => (document.getElementById('f_dbh_' + id)?.value ?? '').trim();
  const dados = {
    titulo: v('titulo') || 'DATA BOOK', projeto: v('projeto') || null, subtitulo: v('subtitulo') || null, classificacao: v('classificacao') || null,
    numero_cliente: v('numero_cliente') || null, numero_contratada: v('numero_contratada') || null, revisao: v('revisao') || '0',
    criado_por_nome: v('criado_por_nome') || null, criado_data: v('criado_data') || null, verificado_por_nome: v('verificado_por_nome') || null,
    verificado_data: v('verificado_data') || null, aprovado_por_nome: v('aprovado_por_nome') || null, departamento: v('departamento') || null,
    status: v('status') || 'em_montagem', numeracao: v('numeracao') || 'oficial', carimbar_anexos: v('carimbar') === '1',
    escopo_entregue: v('escopo_entregue') || null, pasta: v('pasta') || null,
  };
  const { error } = await sb.from('databooks').update(dados).eq('id', DB_ATUAL.id);
  if (error){ showMsg('Erro ao salvar: ' + error.message, false); return; }
  Object.assign(DB_ATUAL, dados);
  renderNav(); renderDatabook(); showMsg('Capa e carimbo salvos.', true);
}
async function salvarTituloCapitulo(num, titulo){
  const caps = DB_ATUAL.capitulos.map(c => c.num === num ? { ...c, titulo: titulo.trim().toUpperCase() } : c);
  const { error } = await sb.from('databooks').update({ capitulos: caps }).eq('id', DB_ATUAL.id);
  if (error){ showMsg('Erro ao salvar título do capítulo: ' + error.message, false); return; }
  DB_ATUAL.capitulos = caps;
}
async function marcarAplicavelDatabook(itemId, aplicavel){
  const { error } = await sb.from('databook_itens').update({ aplicavel }).eq('id', itemId);
  if (error){ showMsg('Erro: ' + error.message, false); return; }
  const it = DB_ITENS.find(x => x.id === itemId); if (it) it.aplicavel = aplicavel;
  renderDatabook();
}
async function adicionarItemDatabook(cap){
  const cod = document.getElementById('novoCod_' + cap).value.trim();
  const desc = document.getElementById('novoDesc_' + cap).value.trim();
  if (!cod || !desc){ showMsg('Informe código e descrição do item.', false); return; }
  if (DB_ITENS.some(x => x.codigo === cod)){ showMsg(`Já existe o item ${cod} neste databook.`, false); return; }
  const ordem = Math.max(0, ...DB_ITENS.filter(x => x.capitulo === cap).map(x => x.ordem)) + 10;
  const { data, error } = await sb.from('databook_itens').insert({ databook_id: DB_ATUAL.id, capitulo: cap, codigo: cod, descricao: desc, ordem, aplicavel: true }).select('*').single();
  if (error){ showMsg('Erro ao adicionar item: ' + error.message, false); return; }
  DB_ITENS.push(data); renderDatabook();
}
async function removerItemDatabook(itemId){
  if (!confirm('Remover este item do databook? (os arquivos na pasta não são apagados)')) return;
  const { error } = await sb.from('databook_itens').delete().eq('id', itemId);
  if (error){ showMsg('Erro: ' + error.message, false); return; }
  DB_ITENS = DB_ITENS.filter(x => x.id !== itemId); renderDatabook();
}
async function adicionarRevisaoDatabook(){
  const ordem = Math.max(0, ...DB_REVS.map(r => r.ordem)) + 1;
  const { data, error } = await sb.from('databook_revisoes').insert({ databook_id: DB_ATUAL.id, rev: String.fromCharCode(64 + Math.min(ordem, 26)), ordem }).select('*').single();
  if (error){ showMsg('Erro: ' + error.message, false); return; }
  DB_REVS.push(data); renderDatabook();
}
async function salvarRevisaoDatabook(id, campo, valor){
  const { error } = await sb.from('databook_revisoes').update({ [campo]: valor || null }).eq('id', id);
  if (error){ showMsg('Erro ao salvar revisão: ' + error.message, false); return; }
  const rv = DB_REVS.find(x => x.id === id); if (rv) rv[campo] = valor || null;
}
async function removerRevisaoDatabook(id){
  const { error } = await sb.from('databook_revisoes').delete().eq('id', id);
  if (error){ showMsg('Erro: ' + error.message, false); return; }
  DB_REVS = DB_REVS.filter(x => x.id !== id); renderDatabook();
}
async function excluirDatabook(){
  if (!confirm(`Excluir o databook do pedido ${DB_ATUAL.pedidos?.numero_pedido}? O checklist some do sistema; os arquivos na pasta continuam.`)) return;
  const { error } = await sb.from('databooks').delete().eq('id', DB_ATUAL.id);
  if (error){ showMsg('Erro: ' + error.message, false); return; }
  irDatabooks();
}

// ── ponte com o programa local ──
async function abrirPastaDatabook(extra){
  try { await servicoDatabook('/abrir', { pasta: DB_ATUAL.pasta, ...(extra || {}) }); }
  catch (e){ showMsg(e.message, false); }
}
async function criarPastasDatabook(silencioso){
  try {
    const r = await servicoDatabook('/estrutura', { pasta: DB_ATUAL.pasta, itens: DB_ITENS.map(it => ({ capitulo: it.capitulo, codigo: it.codigo, descricao: it.descricao, aplicavel: it.aplicavel })) });
    if (!silencioso) showMsg(r.criadas ? `${r.criadas} pasta(s) criada(s). Coloque os PDFs de cada item na pasta dele.` : 'As pastas já existiam — nada novo para criar.', true);
  } catch (e){ showMsg('Não consegui criar as pastas: ' + e.message, false); }
}
async function conferirArquivosDatabook(silencioso){
  try {
    const r = await servicoDatabook('/conferir', { pasta: DB_ATUAL.pasta, itens: DB_ITENS.map(it => ({ capitulo: it.capitulo, codigo: it.codigo })) });
    const agora = new Date().toISOString();
    const linhas = DB_ITENS.map(it => ({ ...it, arquivos: r.itens[it.codigo]?.arquivos || [], paginas: (r.itens[it.codigo]?.arquivos || []).reduce((s, a) => s + (a.paginas || 0), 0), conferido_em: agora }));
    const { error } = await sb.from('databook_itens').upsert(linhas, { onConflict: 'id' });
    if (error) throw new Error(error.message);
    DB_ITENS = linhas;
    renderDatabook();
    if (!silencioso){ const s = resumoItensDatabook(DB_ITENS); showMsg(`Arquivos conferidos: ${s.ok} item(ns) OK, ${s.pend} pendente(s)${s.err ? ', ' + s.err + ' com erro' : ''}.`, !s.err); }
    return true;
  } catch (e){ showMsg('Não consegui conferir os arquivos: ' + e.message, false); return false; }
}
async function exportarRNCsDatabook(itemId){
  const it = DB_ITENS.find(x => x.id === itemId);
  const rncs = RNCS.filter(r => r.pedido_id === DB_ATUAL.pedido_id);
  if (!rncs.length){ showMsg('Este pedido não tem RNC no sistema. Se não houver, marque o item 5.1 como N/A ou coloque uma declaração na pasta.', false); return; }
  try {
    for (let i = 0; i < rncs.length; i++){
      const arq = await gerarDocumentoRNC(rncs[i].id, { retornar: true });
      await servicoDatabook('/salvar', { pasta: DB_ATUAL.pasta, capitulo: it.capitulo, codigo: it.codigo, descricao: it.descricao, nome: arq.nome, base64: arq.base64, limpar_antes: i === 0, limpar_prefixo: 'RNC_' });
    }
    await conferirArquivosDatabook(true);
    const abertas = rncs.filter(r => r.status_nc !== 'encerrado').length;
    showMsg(`${rncs.length} RNC(s) salvos na pasta do item ${it.codigo}.` + (abertas ? ` Atenção: ${abertas} ainda em aberto — o PR-G-363 pede todas encerradas.` : ''), !abertas);
  } catch (e){ showMsg('Erro ao exportar RNCs: ' + e.message, false); }
}
async function exportarDesenhosDatabook(itemId){
  const it = DB_ITENS.find(x => x.id === itemId);
  let { data, error } = await sb.from('desenhos_engenharia').select('desenho_mde, desenho_cliente, revisao, nome_equipamento, remessas(numero)').eq('pedido_id', DB_ATUAL.pedido_id);
  if (error){ ({ data, error } = await sb.from('desenhos_engenharia').select('desenho_mde, desenho_cliente, revisao').eq('pedido_id', DB_ATUAL.pedido_id)); }
  if (error){ showMsg('Erro ao ler desenhos: ' + error.message, false); return; }
  const unicos = new Map();
  (data || []).forEach(d => { if (d.desenho_mde && !unicos.has(normDesenho(d.desenho_mde))) unicos.set(normDesenho(d.desenho_mde), d); });
  const lista = [...unicos.values()].sort((a, b) => a.desenho_mde.localeCompare(b.desenho_mde));
  if (!lista.length){ showMsg('A Engenharia ainda não subiu desenhos para este pedido.', false); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const M = 14, cols = [['Desenho MDE', 38], ['Rev.', 12], ['Desenho Cliente', 52], ['Equipamento / Descrição', 62], ['Rem.', 18]];
  let y = 0, pag = 0;
  const cab = () => {
    if (pag) doc.addPage(); pag++;
    doc.setFont(undefined, 'bold'); doc.setFontSize(13); doc.text('LISTA DE DESENHOS DO FORNECEDOR', 105, 18, { align: 'center' });
    doc.setFont(undefined, 'normal'); doc.setFontSize(9);
    doc.text(`Pedido ${DB_ATUAL.pedidos?.numero_pedido || ''} · ${DB_ATUAL.pedidos?.cliente || ''} · ${DB_ATUAL.titulo || ''}`, 105, 24, { align: 'center' });
    y = 32; let x = M; doc.setFillColor(233, 237, 243); doc.rect(M, y, 182, 7, 'F'); doc.setFont(undefined, 'bold');
    cols.forEach(([t, w]) => { doc.text(t, x + 1.5, y + 4.8); x += w; }); doc.setFont(undefined, 'normal'); y += 7;
  };
  cab();
  lista.forEach(d => {
    if (y > 280) cab();
    const vals = [d.desenho_mde, d.revisao ?? '', d.desenho_cliente ?? '', d.nome_equipamento ?? '', d.remessas?.numero ?? ''];
    let x = M; doc.setDrawColor(219, 225, 230); doc.line(M, y + 6, M + 182, y + 6);
    vals.forEach((v, i) => { doc.text(doc.splitTextToSize(String(v), cols[i][1] - 3)[0] || '', x + 1.5, y + 4.3); x += cols[i][1]; });
    y += 6;
  });
  doc.setFontSize(8); doc.text(`${lista.length} desenho(s) · gerado pelo Flow Suite em ${new Date().toLocaleString('pt-BR')}`, M, 290);
  const nome = `Lista_de_Desenhos_${(DB_ATUAL.pedidos?.numero_pedido || '').replace(/[^\w-]+/g, '')}.pdf`;
  try {
    await servicoDatabook('/salvar', { pasta: DB_ATUAL.pasta, capitulo: it.capitulo, codigo: it.codigo, descricao: it.descricao, nome, base64: doc.output('datauristring').split(',')[1], limpar_antes: true, limpar_prefixo: 'Lista_de_Desenhos' });
    await conferirArquivosDatabook(true);
    showMsg(`Lista com ${lista.length} desenho(s) salva na pasta do item ${it.codigo}.`, true);
  } catch (e){ showMsg('Erro ao salvar a lista: ' + e.message, false); }
}

async function gerarDatabook(){
  if (DB_GERANDO) return;
  if (!(await conferirArquivosDatabook(true))) return;
  const s = resumoItensDatabook(DB_ITENS);
  if (s.err){ showMsg(`Tem ${s.err} item(ns) com arquivo com erro (PDF com senha/defeito ou formato não aceito). Corrija na pasta e confira de novo.`, false); return; }
  if (s.pend){
    const lista = DB_ITENS.filter(it => statusItemDatabook(it) === 'pend').map(it => it.codigo).join(', ');
    showMsg(`Faltam arquivos em ${s.pend} item(ns): ${lista}. Coloque os arquivos nas pastas ou desmarque o que não se aplica a este pedido.`, false); return;
  }
  const abertas = RNCS.filter(r => r.pedido_id === DB_ATUAL.pedido_id && r.status_nc !== 'encerrado');
  if (abertas.length && !confirm(`Este pedido tem ${abertas.length} RNC em aberto (${abertas.map(formatarNumeroRNC).join(', ')}). O PR-G-363 pede todas encerradas antes do data book. Gerar mesmo assim?`)) return;
  const d = DB_ATUAL;
  const corpo = {
    pasta: d.pasta, cliente: d.pedidos?.cliente || '', capitulos: d.capitulos, revisoes: DB_REVS,
    itens: DB_ITENS.map(it => ({ capitulo: it.capitulo, codigo: it.codigo, descricao: it.descricao, aplicavel: it.aplicavel, ordem: it.ordem })),
    databook: { titulo: d.titulo, projeto: d.projeto, subtitulo: d.subtitulo, classificacao: d.classificacao, numero_cliente: d.numero_cliente, numero_contratada: d.numero_contratada,
      revisao: d.revisao, criado_por_nome: d.criado_por_nome, criado_data: d.criado_data, verificado_por_nome: d.verificado_por_nome, verificado_data: d.verificado_data,
      aprovado_por_nome: d.aprovado_por_nome, departamento: d.departamento, escopo_entregue: d.escopo_entregue, numeracao: d.numeracao, carimbar_anexos: d.carimbar_anexos },
  };
  try { await servicoDatabook('/gerar', corpo); }
  catch (e){ showMsg('Não consegui iniciar a geração: ' + e.message, false); return; }
  DB_GERANDO = true; clearMsg();
  const caixa = document.getElementById('dbProgresso');
  const tick = async () => {
    let p;
    try { p = await servicoDatabook('/progresso'); } catch (e){ p = { erro: 'Perdi a conexão com o programa do Data Book: ' + e.message }; }
    const pct = p.total ? Math.round((p.atual || 0) * 100 / p.total) : 0;
    if (caixa) caixa.innerHTML = `<div class="section"><b>Gerando data book…</b> ${esc(p.etapa || '')}<div class="db-progresso"><div style="width:${pct}%"></div></div><span style="font-size:11.5px;color:var(--text2)">${p.atual || 0} de ${p.total || '?'} arquivo(s) · ${p.segundos || 0}s</span></div>`;
    if (p.rodando){ setTimeout(tick, 1500); return; }
    DB_GERANDO = false;
    if (p.erro){ if (caixa) caixa.innerHTML = ''; showMsg('Erro ao gerar: ' + p.erro, false); return; }
    const info = p.resultado || {};
    const upd = { ultima_geracao: new Date().toISOString(), ultima_geracao_info: info, status: DB_ATUAL.status === 'em_montagem' ? 'gerado' : DB_ATUAL.status };
    await sb.from('databooks').update(upd).eq('id', DB_ATUAL.id);
    Object.assign(DB_ATUAL, upd);
    renderDatabook();
    showMsg(`Data book gerado: ${info.paginas} páginas, ${info.tamanho_mb} MB — ${info.arquivo}`, true);
  };
  tick();
}

init();
</script>
