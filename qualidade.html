<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Flow Suite">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Flow Suite — Qualidade</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#0b1e33; --navy2:#102A43; --navy3:#173a5e;
  --bg:#F8FAFC; --bg2:#ffffff; --bg3:#F1F5F9; --bg4:#E9EDF3;
  --border:#E5E7EB; --border-strong:#CBD5E1; --text:#111827; --text2:#6B7280; --text3:#9CA3AF;
  --blue:#1D4ED8; --blue-dim:#DBEAFE; --blue-hover:#1E40AF; --header-bg:#102A43;
  --green:#10B981; --green-dim:#D1FAE5;
  --amber:#b5690a; --amber-dim:#faedd9;
  --red:#DC2626; --red-dim:#FEE2E2;
  --purple:#7c3aed; --purple-dim:#ede9fe;
  --radius:16px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 8px 20px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}

.app-shell{min-height:100vh;display:flex;flex-direction:column}
.app-header{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 22px;background:var(--header-bg);border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:100}
.app-header-brand{display:flex;align-items:center;gap:10px}
.app-header-brand .logo-full{height:42px;width:auto;flex-shrink:0;display:block}
.app-header-right{display:flex;align-items:center;gap:12px}
.header-user{font-size:12px;color:rgba(255,255,255,.6);text-align:right;line-height:1.3}
.header-user strong{color:#fff;font-weight:600;display:block;font-size:12.5px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn svg{width:15px;height:15px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4f8ef7,#7c6cf0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}

.app-body{flex:1;display:flex;min-height:0}
.sidebar{width:222px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:16px 10px;transition:width .15s ease}
.app-shell.sidebar-collapsed .sidebar{width:68px}
.app-shell.sidebar-collapsed .nav-label,.app-shell.sidebar-collapsed .collapse-label{display:none}
.sidebar-nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.66);text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--blue);color:#fff;font-weight:600}
.collapse-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.45);background:none;border:none;cursor:pointer;font-size:12.5px;width:100%;font-family:inherit}
.collapse-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.collapse-btn svg{width:15px;height:15px;transition:transform .15s;flex-shrink:0}
.app-shell.sidebar-collapsed .collapse-btn svg{transform:rotate(180deg)}

.sidebar-fab{position:fixed;bottom:20px;left:16px;z-index:260;width:46px;height:46px;border-radius:50%;background:var(--navy2);border:1px solid rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-md);transition:background .12s,transform .12s}
.sidebar-fab:hover{background:var(--navy3);transform:scale(1.06)}
.sidebar-fab svg{width:20px;height:20px;transition:transform .2s;flex-shrink:0}
.app-shell.sidebar-collapsed .sidebar-fab svg{transform:rotate(180deg)}

.content{flex:1;min-width:0;padding:1.75rem 2rem;overflow-y:auto}

.btn{display:inline-block;padding:8px 15px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:12.5px;cursor:pointer;font-weight:500;transition:border-color .12s,color .12s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--blue-hover);border-color:var(--blue-hover);color:#fff}
.btn-primary:disabled{opacity:.5;cursor:default}

.msg-box{margin:0 0 1rem;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;display:none}
.msg-box.show{display:block}
.msg-box.err{background:var(--red-dim);color:var(--red)}
.msg-box.ok{background:var(--green-dim);color:var(--green)}

.nav-bar{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);margin-bottom:16px}
.nav-crumb{cursor:pointer;padding:3px 8px;border-radius:6px}
.nav-crumb:hover{background:var(--bg3);color:var(--text)}
.nav-crumb.active{color:var(--blue);font-weight:600;cursor:default}
.nav-crumb.active:hover{background:none}
.nav-sep{color:var(--text3)}

.search-row{display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
.search-row input, .search-row select{padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:13px}
.search-row input:focus, .search-row select:focus{outline:none;border-color:var(--blue)}
.search-row input.main{flex:1;min-width:220px}
.empty{text-align:center;padding:3rem 2rem;color:var(--text2);font-size:13px}

.tbl-wrap{overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl thead th{text-align:left;padding:8px 10px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap;background:var(--bg3);position:sticky;top:0}
.dtbl tbody tr{border-bottom:1px solid var(--border);cursor:pointer}
.dtbl tbody tr:hover td{background:var(--bg3)}
.dtbl tbody td{padding:8px 10px;vertical-align:middle;white-space:nowrap}
.dtbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.status-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.sb-aberto{background:var(--amber-dim);color:var(--amber)}
.sb-encerrado{background:var(--green-dim);color:var(--green)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.4rem;margin-bottom:1.1rem;box-shadow:var(--shadow-sm)}
.section-title{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.wide{grid-column:1/-1}
.field label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.02em}
.field input, .field select, .field textarea{padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:13px;font-family:inherit}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--blue)}
.field textarea{resize:vertical;min-height:64px}
.radio-group{display:flex;gap:14px;flex-wrap:wrap;padding-top:4px}
.radio-opt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);cursor:pointer}
.radio-opt input{width:15px;height:15px;cursor:pointer}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:.5rem}

.rnc-num{font-weight:700;color:var(--blue)}
.pill-count{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--blue-dim);color:var(--blue)}

.kpi-block{margin-bottom:1.5rem}
.kpi-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.kpi-obj{font-size:11.5px;color:var(--text2);margin-bottom:.7rem}
.kpi-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.kpi-tbl th,.kpi-tbl td{padding:6px 8px;text-align:center;border:1px solid var(--border);white-space:nowrap}
.kpi-tbl th{background:var(--bg3);color:var(--text2);font-weight:600}
.kpi-tbl td:first-child,.kpi-tbl th:first-child{text-align:left;font-weight:600}
.kpi-tbl td.tot{font-weight:700;color:var(--blue);background:var(--blue-dim)}
.kpi-warn td.tot{color:var(--red);background:var(--red-dim)}

.modo-tabs{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg2)}
.modo-tabs button{padding:8px 16px;border:none;background:none;font-size:12.5px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit}
.modo-tabs button+button{border-left:1px solid var(--border)}
.modo-tabs button.active{background:var(--blue);color:#fff;font-weight:600}
.grafico-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:.6rem}
.grafico-topo .kpi-obj{margin-bottom:0}
.grafico-legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text2)}
.grafico-legenda span{display:inline-flex;align-items:center;gap:6px}
.grafico-legenda i{width:11px;height:11px;border-radius:3px;display:inline-block}
.grafico-legenda i.leg-obj{width:18px;height:0;border-radius:0;border-top:2px dashed var(--red)}
.grafico-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:10px 12px 4px}
.grafico-card svg{display:block}

.mod-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:1rem}
.mod-tab{padding:9px 16px;border:none;background:none;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.mod-tab:hover{color:var(--text)}
.mod-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.dica-desenho{font-size:11px;color:var(--text2);margin-top:3px;min-height:14px}
.dica-desenho.ok{color:#15803d}
.dica-desenho.erro{color:#b91c1c}
.btn.btn-sm{padding:4px 9px;font-size:11.5px}
.somente-leitura .so-editor{display:none !important}
.aviso-leitura{margin:0 0 12px;padding:8px 14px;border-radius:10px;background:#FEF3C7;color:#92400E;font-size:12.5px}
.anexo-linha{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.dtbl td.desc-desvio{max-width:320px;overflow:hidden;text-overflow:ellipsis}

/* Databooks */
.db-servico{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:1rem}
.db-servico.on{background:var(--green-dim);color:#047857}
.db-servico.off{background:var(--bg3);color:var(--text2)}
.db-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.db-resumo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem}
.db-resumo span{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;background:var(--bg3);color:var(--text2)}
.db-resumo .ok{background:var(--green-dim);color:#047857}
.db-resumo .pend{background:var(--amber-dim);color:var(--amber)}
.db-resumo .err{background:var(--red-dim);color:var(--red)}
.db-cap-titulo{display:flex;align-items:center;gap:8px}
.db-cap-titulo input{flex:1;border:1px solid transparent;background:none;font:inherit;color:inherit;text-transform:uppercase;padding:2px 4px;border-radius:6px}
.db-cap-titulo input:hover,.db-cap-titulo input:focus{border-color:var(--border);outline:none;background:var(--bg2)}
.db-itens{width:100%;border-collapse:collapse;font-size:12.5px}
.db-itens td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.db-itens tr.na td{color:var(--text3)}
.db-itens td.cod{font-weight:700;color:var(--blue);white-space:nowrap;width:52px}
.db-itens td.chk{width:28px;text-align:center}
.db-itens td.st{width:96px;white-space:nowrap}
.db-itens td.arq{width:34%;color:var(--text2);font-size:11.5px}
.db-arq-lista{margin-top:4px;padding-left:14px}
.db-arq-lista li{margin:1px 0}
.db-arq-lista li.erro{color:var(--red)}
.st-ok{background:var(--green-dim);color:#047857}
.st-pend{background:var(--amber-dim);color:var(--amber)}
.st-na{background:var(--bg3);color:var(--text3)}
.st-err{background:var(--red-dim);color:var(--red)}
.db-progresso{height:8px;border-radius:8px;background:var(--bg4);overflow:hidden;margin:8px 0 4px}
.db-progresso div{height:100%;background:var(--blue);transition:width .3s}
.db-rev td input{width:100%;padding:5px 6px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:12px}

.print-only{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  .app-header,.sidebar,.sidebar-fab,.nav-bar,.mod-tabs,.msg-box,.search-row,.no-print{display:none !important}
  .app-shell,.app-body{display:block;min-height:0}
  .content{padding:0;overflow:visible}
  .print-only{display:block}
  .print-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #102A43;padding-bottom:6px;margin-bottom:10px}
  .print-head h1{font-size:16px;color:#102A43}
  .print-head div{font-size:11px;color:#444;text-align:right}
  .tbl-wrap{border:none;box-shadow:none;border-radius:0;overflow:visible}
  .dtbl{font-size:10.5px}
  .dtbl thead th{position:static;background:#eef1f5 !important;color:#111;border:1px solid #bbb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dtbl tbody td{border:1px solid #ccc;white-space:normal}
  .dtbl tbody tr{page-break-inside:avoid}
  .status-badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* gráficos: folha em pé, os 3 quadros numa página só */
  @page graficos{size:A4 portrait;margin:10mm}
  .graficos-print{page:graficos}
  .grafico-bloco{page-break-inside:avoid;margin-bottom:5mm}
  .grafico-bloco .kpi-title{font-size:12px}
  .grafico-card{padding:4px 6px 0}
  .grafico-card{box-shadow:none}
  .grafico-card svg,.grafico-legenda i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="app-shell" id="appShell">
  <header class="app-header">
    <div class="app-header-brand">
      <img class="logo-full" src="assets/logo.png" alt="Flow Suite">
    </div>
    <div class="app-header-right">
      <span class="header-user">Logado como<strong id="userNome">...</strong></span>
      <div id="sininhoWrap"></div>
      <div id="cartinhaWrap"></div>
      <button class="icon-btn" title="Início" onclick="window.location.href='index.html'">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9.5 10 3l7 6.5M5 8v8h10V8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" title="Sair" onclick="logout()">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3H4v14h4M13 6l4 4-4 4M6.5 10H17" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="avatar" id="userAvatar">··</div>
    </div>
  </header>
  <div class="app-body">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a class="nav-item" href="index.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9.5 10 3l7 6.5M5 8v8h10V8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">Início</span>
        </a>
        <a class="nav-item" href="contratos.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2.5h6l3 3v12h-9z" stroke-linejoin="round"/><path d="M12 2.5V6h3M8 10h4M8 13h4M8 7h1.5" stroke-linecap="round"/></svg>
          <span class="nav-label">Contratos</span>
        </a>
        <a class="nav-item" href="engenharia.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m3 17 8-8m0 0 4-4 2 2-4 4m-4-4 4 4M6 14l-1 3 3-1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">Engenharia</span>
        </a>
        <a class="nav-item" href="cadastro.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3h6a1 1 0 0 1 1 1v1H6V4a1 1 0 0 1 1-1Z" stroke-linejoin="round"/><path d="M6 4H5a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-1M7 10h6M7 13h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">PCP</span>
        </a>
        <a class="nav-item" href="apontamento.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 17V9l4-3 4 3v8M11 17V6l3-2 3 2v11" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">Produção</span>
        </a>
        <a class="nav-item" href="ponto.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10.5" r="7"/><path d="M10 6.5v4l3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">Apontamento de Horas</span>
        </a>
        <a class="nav-item" href="expedicao.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6h9v8H2zM11 9h4l3 3v2h-7z" stroke-linejoin="round"/><circle cx="6" cy="15.5" r="1.4"/><circle cx="14" cy="15.5" r="1.4"/></svg>
          <span class="nav-label">Expedição</span>
        </a>
        <a class="nav-item" href="industrializacao.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m10 2 7 3.5v9L10 18l-7-3.5v-9L10 2Z" stroke-linejoin="round"/><path d="M10 2v16M3 5.5 10 9l7-3.5M10 9v9" stroke-linejoin="round"/></svg>
          <span class="nav-label">Industrialização</span>
        </a>
        <a class="nav-item" href="almoxarifado.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h14M3 4v12M17 4v12M3 8h14M3 12h14M3 16h14" stroke-linecap="round"/></svg>
          <span class="nav-label">Almoxarifado</span>
        </a>
        <a class="nav-item active" href="qualidade.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5 16 5v5c0 4-2.5 6.5-6 7.5C6.5 16.5 4 14 4 10V5l6-2.5Z" stroke-linejoin="round"/><path d="m7.2 10 2 2 3.6-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">Qualidade</span>
        </a>
        <a class="nav-item" href="dashboard.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 15V9M10 15V4M16 15v-6" stroke-linecap="round"/></svg>
          <span class="nav-label">Dashboard</span>
        </a>
      </nav>
      <button class="collapse-btn" onclick="alternarSidebar(true)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12.5 4 7 10l5.5 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="collapse-label">Recolher menu</span>
      </button>
    </aside>
    <button class="sidebar-fab" id="sidebarFab" onclick="alternarSidebar(true)" title="Mostrar/ocultar menu">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12.5 4 7 10l5.5 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <main class="content">
      <div class="aviso-leitura" id="avisoLeitura" style="display:none">👁 Modo visualização — você pode consultar, imprimir e gerar documentos. Criar e alterar RNCs e desvios só pela Qualidade ou Administrador.</div>
      <div class="mod-tabs">
        <button class="mod-tab active" id="tabRNC" onclick="irLista()">📋 RNCs</button>
        <button class="mod-tab" id="tabDesvios" onclick="irDesvios()">⚠️ Controle de Desvio Cliente</button>
        <button class="mod-tab" id="tabDatabooks" onclick="irDatabooks()">📘 Databooks</button>
      </div>
      <div class="nav-bar" id="navBar"></div>
      <div id="msgBox" class="msg-box"></div>
      <div id="content"><div class="empty">Carregando...</div></div>
    </main>
  </div>
</div>

<script src="js/supabase-client.js?v=4"></script>
<script>
let AUTH = null;
let PEDIDOS = [];        // [{id, numero_pedido, cliente}]
let RNCS = [];           // lista carregada, com pedidos embutido
let VISAO = 'lista';     // 'lista' | 'form' | 'indicadores'
let RNC_EDITANDO = null; // registro sendo editado, ou null (novo)

let sidebarMexidoManualmente = false;
function alternarSidebar(manual){
  document.getElementById('appShell').classList.toggle('sidebar-collapsed');
  if (manual) sidebarMexidoManualmente = true;
}
setTimeout(() => {
  if (sidebarMexidoManualmente) return;
  document.getElementById('appShell').classList.add('sidebar-collapsed');
}, 5000);

function showMsg(text, ok){
  const box = document.getElementById('msgBox');
  box.textContent = text;
  box.className = 'msg-box show ' + (ok ? 'ok' : 'err');
}
function clearMsg(){ document.getElementById('msgBox').classList.remove('show'); }

async function init(){
  AUTH = await exigirLogin(['qualidade', 'admin', 'diretor']);
  if (!AUTH) return;
  SOMENTE_LEITURA = AUTH.perfil === 'diretor';
  if (SOMENTE_LEITURA){
    document.body.classList.add('somente-leitura');
    document.getElementById('avisoLeitura').style.display = '';
  }
  document.getElementById('userNome').textContent = AUTH.nome;
  document.getElementById('userAvatar').textContent = (AUTH.nome || '').trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase() || '··';
  iniciarSininho('sininhoWrap');
  iniciarCartinha('cartinhaWrap');

  const { data: pedidos } = await sb.from('pedidos').select('id, numero_pedido, cliente').order('numero_pedido');
  PEDIDOS = pedidos || [];

  await Promise.all([carregarRNCs(), carregarDesvios()]);
  irLista();
}

async function carregarRNCs(){
  const { data, error } = await sb
    .from('rnc')
    .select('*, pedidos(numero_pedido, cliente)')
    .order('ano_rnc', { ascending: false })
    .order('numero_rnc', { ascending: false });
  if (error){ showMsg('Erro ao carregar RNCs: ' + error.message, false); return; }
  RNCS = data || [];
}

// ── LABELS / FORMATAÇÃO ─────────────────────────────────────────────────────
function formatarNumeroRNC(r){ return String(r.numero_rnc).padStart(2, '0') + '/' + r.ano_rnc; }
function fmtData(d){ return d ? new Date(d + 'T00:00:00').toLocaleDateString('pt-BR') : '—'; }
const LABEL_STATUS = { em_aberto: 'Em Aberto', encerrado: 'Encerrado' };
const LABEL_ORIGEM = { interno: 'Interno', fornecedor: 'Externo — Fornecedor', cliente: 'Externo — Cliente' };
const LABEL_DISPOSICAO = { aceitar_como_esta: 'Aceitar como está', retrabalhar: 'Retrabalhar', sucatear: 'Sucatear', devolver_fornecedor: 'Devolver ao Fornecedor' };
const LABEL_EFICACIA = { aprovado: 'Aprovado', reprovado: 'Reprovado' };
const EMPRESAS = ['MDE- ENGENHARIA S/A', 'MDE - EQUIPAMENTOS LTDA'];

// sugestões (não travam o campo -- é datalist, o usuário pode digitar outra coisa)
const SUGESTOES_TIPO_DESVIO = ['ENGENHARIA/DESENHO', 'QUALIDADE', 'FABRICAÇÃO', 'MONTAGEM', 'LOGÍSTICA', 'MATERIAL'];
const SUGESTOES_RESPONSAVEL_NC = ['ENGENHARIA', 'FORNECEDOR', 'FÁBRICA', 'MONTAGEM', 'QUALIDADE', 'PCP'];
const SUGESTOES_ESPECIFICACAO = ['DESENHO DETALHE', 'ESPECIFICAÇÃO TÉCNICA', 'NORMA'];
const SUGESTOES_LOCAL_NC = ['RECEBIMENTO MDE', 'FABRICA MDE', 'MONTAGEM MDE', 'MONTAGEM OBRA', 'ENGENHARIA MDE'];
const SUGESTOES_DEBITO = ['ENGENHARIA', 'PCP', 'FÁBRICA', 'MONTAGEM', 'QUALIDADE', 'SUPRIMENTOS', 'LOGÍSTICA', 'FORNECEDOR', 'CLIENTE'];

// ── NAVEGAÇÃO ────────────────────────────────────────────────────────────
function renderNav(){
  const nav = document.getElementById('navBar');
  const emDesvios = VISAO === 'desvios' || VISAO === 'desvioForm';
  const emDatabooks = VISAO === 'databooks' || VISAO === 'databookNovo' || VISAO === 'databook';
  document.getElementById('tabRNC').classList.toggle('active', !emDesvios && !emDatabooks);
  document.getElementById('tabDesvios').classList.toggle('active', emDesvios);
  document.getElementById('tabDatabooks').classList.toggle('active', emDatabooks);
  let h;
  if (emDatabooks){
    h = `<span class="nav-crumb ${VISAO==='databooks'?'active':''}" onclick="irDatabooks()">Qualidade — Databooks</span>`;
    if (VISAO === 'databookNovo') h += `<span class="nav-sep">›</span><span class="nav-crumb active">Abrir Databook</span>`;
    if (VISAO === 'databook' && DB_ATUAL) h += `<span class="nav-sep">›</span><span class="nav-crumb active">${esc(DB_ATUAL.pedidos?.numero_pedido || '')} · ${esc(DB_ATUAL.titulo || '')}</span>`;
  } else if (emDesvios){
    h = `<span class="nav-crumb ${VISAO==='desvios'?'active':''}" onclick="irDesvios()">Qualidade — Controle de Desvio Cliente</span>`;
    if (VISAO === 'desvioForm') h += `<span class="nav-sep">›</span><span class="nav-crumb active">${DESVIO_EDITANDO ? 'Editar Desvio ' + formatarNumeroDesvio(DESVIO_EDITANDO) : 'Novo Desvio'}</span>`;
  } else {
    h = `<span class="nav-crumb ${VISAO==='lista'?'active':''}" onclick="irLista()">Qualidade — RNCs</span>`;
    if (VISAO === 'form') h += `<span class="nav-sep">›</span><span class="nav-crumb active">${RNC_EDITANDO ? 'Editar RNC ' + formatarNumeroRNC(RNC_EDITANDO) : 'Novo RNC'}</span>`;
    if (VISAO === 'indicadores') h += `<span class="nav-sep">›</span><span class="nav-crumb active">Indicador RNCs</span>`;
  }
  nav.innerHTML = h;
}

function irLista(){ VISAO = 'lista'; RNC_EDITANDO = null; renderNav(); renderLista(); clearMsg(); }
function irNovo(){ VISAO = 'form'; RNC_EDITANDO = null; renderNav(); renderForm(null); clearMsg(); }
function irEditar(id){
  const r = RNCS.find(x => x.id === id);
  if (!r) return;
  VISAO = 'form'; RNC_EDITANDO = r; renderNav(); renderForm(r); clearMsg();
}
function irIndicadores(){ VISAO = 'indicadores'; RNC_EDITANDO = null; renderNav(); renderIndicadores(); clearMsg(); }
function irDesvios(){ VISAO = 'desvios'; DESVIO_EDITANDO = null; renderNav(); renderListaDesvios(); clearMsg(); }
function irNovoDesvio(){ VISAO = 'desvioForm'; DESVIO_EDITANDO = null; renderNav(); renderFormDesvio(null); clearMsg(); }
function irEditarDesvio(id){
  const d = DESVIOS.find(x => x.id === id);
  if (!d) return;
  VISAO = 'desvioForm'; DESVIO_EDITANDO = d; renderNav(); renderFormDesvio(d); clearMsg();
}

// ── CONTROLE DE DESVIO CLIENTE (aba "Controle de Desvio Cliente" da MG-008) ──
// tipo "RNC" conta no quadro Reclamação de Cliente do Indicador; "Desvio" não.
let DESVIOS = [];
let DESVIO_EDITANDO = null;
let FILTRO_DESVIO_TERMO = '', FILTRO_DESVIO_STATUS = '', FILTRO_DESVIO_TIPO = '';
const LABEL_TIPO_DESVIO = { rnc: 'RNC', desvio: 'Desvio' };
const LABEL_STATUS_DESVIO = { em_aberto: 'Em Aberto', encerrado: 'Encerrado' };

async function carregarDesvios(){
  const { data, error } = await sb
    .from('desvios_cliente')
    .select('*, pedidos(numero_pedido, cliente), desvios_cliente_anexos(id, arquivo_path, arquivo_nome, enviado_em)')
    .order('ano_desvio', { ascending: false })
    .order('numero_desvio', { ascending: false });
  if (error){ DESVIOS = []; console.warn('desvios_cliente:', error.message); return; }
  DESVIOS = data || [];
}
function formatarNumeroDesvio(d){ return String(d.numero_desvio).padStart(2, '0') + '/' + d.ano_desvio; }

function filtrarDesvios(){
  const termo = FILTRO_DESVIO_TERMO.toLowerCase();
  return DESVIOS.filter(d => {
    if (FILTRO_DESVIO_STATUS && d.status_desvio !== FILTRO_DESVIO_STATUS) return false;
    if (FILTRO_DESVIO_TIPO && d.tipo !== FILTRO_DESVIO_TIPO) return false;
    if (!termo) return true;
    const chave = `${formatarNumeroDesvio(d)} ${d.empresa||''} ${d.cliente||''} ${d.pedidos?.numero_pedido||''} ${d.desenho||''} ${d.desenho_cliente||''} ${d.posicao||''} ${d.tag||''} ${LABEL_TIPO_DESVIO[d.tipo]||''} ${d.descricao||''} ${d.responsavel_resposta||''} ${d.resposta||''} ${d.debito||''}`.toLowerCase();
    return chave.includes(termo);
  });
}

function renderListaDesvios(){
  document.getElementById('content').innerHTML = `<div class="search-row">
    <input class="main" placeholder="🔍 Buscar por número, cliente, pedido, desenho, TAG, descrição, responsável..." value="${esc(FILTRO_DESVIO_TERMO)}" oninput="FILTRO_DESVIO_TERMO=this.value;renderTabelaDesvios()">
    <select onchange="FILTRO_DESVIO_TIPO=this.value;renderTabelaDesvios()">
      <option value="">Todos os tipos</option>
      <option value="rnc" ${FILTRO_DESVIO_TIPO==='rnc'?'selected':''}>RNC</option>
      <option value="desvio" ${FILTRO_DESVIO_TIPO==='desvio'?'selected':''}>Desvio</option>
    </select>
    <select onchange="FILTRO_DESVIO_STATUS=this.value;renderTabelaDesvios()">
      <option value="">Todos os status</option>
      <option value="em_aberto" ${FILTRO_DESVIO_STATUS==='em_aberto'?'selected':''}>Em Aberto</option>
      <option value="encerrado" ${FILTRO_DESVIO_STATUS==='encerrado'?'selected':''}>Encerrado</option>
    </select>
    <button class="btn" onclick="window.print()">🖨 Imprimir lista</button>
    <button class="btn btn-primary so-editor" onclick="irNovoDesvio()">+ Novo Desvio</button>
  </div>
  <div id="tabelaDesvios"></div>`;
  renderTabelaDesvios();
}

function renderTabelaDesvios(){
  const itens = filtrarDesvios();
  const filtros = [FILTRO_DESVIO_TERMO.trim() ? 'Busca: "' + FILTRO_DESVIO_TERMO.trim() + '"' : '', FILTRO_DESVIO_TIPO ? 'Tipo: ' + LABEL_TIPO_DESVIO[FILTRO_DESVIO_TIPO] : '', FILTRO_DESVIO_STATUS ? 'Status: ' + LABEL_STATUS_DESVIO[FILTRO_DESVIO_STATUS] : ''].filter(Boolean).join(' · ') || 'Todos os desvios';
  let h = `<div class="print-only print-head">
    <h1>Controle de Desvios Cliente — MDE</h1>
    <div>${esc(filtros)} · ${itens.length} registro(s)<br>Impresso em ${new Date().toLocaleString('pt-BR')}</div>
  </div>`;
  if (!itens.length){
    h += `<div class="empty">Nenhum desvio encontrado.</div>`;
  } else {
    h += `<div class="tbl-wrap"><table class="dtbl">
      <thead><tr>
        <th>Nº Desvio</th><th>Status</th><th>Tipo</th><th>Empresa</th><th>Cliente</th><th>Pedido</th><th>Desenho</th><th>Desenho Cliente</th>
        <th>Posição</th><th>TAG</th><th>Data</th><th>Descrição</th><th>Prazo Resposta</th><th>Responsável</th><th>Prazo Execução</th><th class="r">Custo</th><th>Débito</th><th class="no-print">Documento</th>
      </tr></thead>
      <tbody>${itens.map(d => `
        <tr onclick="irEditarDesvio(${d.id})">
          <td class="rnc-num">${formatarNumeroDesvio(d)}</td>
          <td><span class="status-badge ${d.status_desvio==='encerrado'?'sb-encerrado':'sb-aberto'}">${LABEL_STATUS_DESVIO[d.status_desvio]||d.status_desvio}</span></td>
          <td>${d.tipo==='rnc' ? '<span class="pill-count">RNC</span>' : 'Desvio'}</td>
          <td>${esc(d.empresa)}</td>
          <td>${esc(d.cliente || d.pedidos?.cliente || '—')}</td>
          <td>${esc(d.pedidos?.numero_pedido || '—')}</td>
          <td>${esc(d.desenho || '—')}</td>
          <td>${esc(d.desenho_cliente || '—')}</td>
          <td>${esc(d.posicao || '—')}</td>
          <td>${esc(d.tag || '—')}</td>
          <td>${fmtData(d.data_desvio)}</td>
          <td class="desc-desvio" title="${esc(d.descricao || '')}">${esc(d.descricao || '—')}</td>
          <td>${fmtData(d.prazo_resposta)}</td>
          <td>${esc(d.responsavel_resposta || '—')}</td>
          <td>${fmtData(d.prazo_execucao)}</td>
          <td class="r">${d.custo != null ? 'R$ ' + Number(d.custo).toLocaleString('pt-BR', {minimumFractionDigits:2}) : '—'}</td>
          <td>${esc(d.debito || '—')}</td>
          <td class="no-print" style="white-space:nowrap">${botoesAnexosDesvio(d)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
  }
  document.getElementById('tabelaDesvios').innerHTML = h;
}

function renderFormDesvio(d){
  const pedidoOpts = PEDIDOS.map(p => `<option value="${p.id}" ${d&&d.pedido_id===p.id?'selected':''}>${esc(p.numero_pedido)}${p.cliente?' · '+esc(p.cliente):''}</option>`).join('');
  document.getElementById('content').innerHTML = `<div class="section">
    <div class="section-title">Identificação</div>
    <div class="form-grid">
      <div class="field"><label>Número do Desvio</label><input value="${d ? formatarNumeroDesvio(d) : 'gerado automaticamente'}" disabled></div>
      ${campoSelect('status_desvio', 'Status do Desvio', d?.status_desvio || 'em_aberto', [['em_aberto','Em Aberto'],['encerrado','Encerrado']])}
      <div class="field">
        <label>Tipo de Desvio</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="tipo_desvio_cli" value="rnc" ${d?.tipo==='rnc'?'checked':''}> RNC <span style="color:var(--text2);font-size:11px">(entra no indicador)</span></label>
          <label class="radio-opt"><input type="radio" name="tipo_desvio_cli" value="desvio" ${!d || d.tipo==='desvio'?'checked':''}> Desvio</label>
        </div>
      </div>
      ${campoSelect('empresa', 'Empresa', d?.empresa, EMPRESAS.map(e => [e,e]))}
      <div class="field"><label for="f_pedido_id">Pedido</label><select id="f_pedido_id" onchange="preencherClienteDoPedido(this.value)"><option value="">— sem pedido —</option>${pedidoOpts}</select></div>
      ${campoTexto('cliente', 'Cliente', d?.cliente)}
      ${campoTexto('data_desvio', 'Data', d?.data_desvio || new Date().toISOString().slice(0,10), {type:'date'})}
    </div>
  </div>

  <div class="section">
    <div class="section-title">Desenho / Item</div>
    <div class="form-grid">
      ${campoTexto('desenho', 'Desenho', d?.desenho)}
      ${campoTexto('desenho_cliente', 'Desenho Cliente', d?.desenho_cliente)}
      ${campoTexto('posicao', 'Posição', d?.posicao)}
      ${campoTexto('tag', 'TAG', d?.tag)}
    </div>
  </div>

  <div class="section">
    <div class="section-title">Descrição e Resposta</div>
    <div class="form-grid">
      ${campoArea('descricao', 'Descrição', d?.descricao, true)}
      ${campoTexto('prazo_resposta', 'Prazo para Resposta', d?.prazo_resposta, {type:'date'})}
      ${campoTexto('responsavel_resposta', 'Responsável pela Resposta', d?.responsavel_resposta, {sugestoes: SUGESTOES_RESPONSAVEL_NC})}
      ${campoArea('resposta', 'Resposta', d?.resposta, true)}
      ${campoTexto('prazo_execucao', 'Prazo para Execução', d?.prazo_execucao, {type:'date'})}
      ${campoTexto('custo', 'Custo (R$)', d?.custo, {type:'number', step:'0.01'})}
      ${campoTexto('debito', 'Débito', d?.debito, {sugestoes: SUGESTOES_DEBITO})}
    </div>
  </div>

  <div class="section">
    <div class="section-title">Documentos do cliente</div>
    <div id="anexosDesvio"></div>
    <div class="field so-editor" style="margin-top:.8rem">
      <label for="f_anexos">Anexar documento (não conformidade do cliente, fotos, relatório...)</label>
      <input type="file" id="f_anexos" multiple onchange="listarAnexosNovos()">
      <div id="anexosNovos" style="font-size:12px;color:var(--text2);margin-top:4px"></div>
    </div>
  </div>

  <div class="form-actions">
    <button class="btn" onclick="irDesvios()">Cancelar</button>
    <button class="btn btn-primary so-editor" id="btnSalvarDesvio" onclick="salvarDesvio()">${d ? 'Salvar alterações' : 'Criar Desvio'}</button>
  </div>`;
  renderAnexosDesvio(d);
  travarFormSeLeitura();
}

// perfil diretor: abre RNC/desvio só pra consultar (o banco já bloqueia a gravação)
let SOMENTE_LEITURA = false;
function travarFormSeLeitura(){
  if (!SOMENTE_LEITURA) return;
  document.querySelectorAll('#content input, #content select, #content textarea').forEach(el => { if (el.type !== 'file') el.disabled = true; });
}

// ── documentos anexados ao desvio (bucket qualidade-docs, sql/080) ──
function botoesAnexosDesvio(d){
  const ax = d.desvios_cliente_anexos || [];
  if (!ax.length) return '—';
  return ax.map((a, i) => `<button class="btn btn-sm" title="${esc(a.arquivo_nome)}" onclick="event.stopPropagation();baixarAnexoDesvio(${a.id}, this)">⬇ ${ax.length === 1 ? 'Baixar' : i + 1}</button>`).join(' ');
}

function renderAnexosDesvio(d){
  const ax = d?.desvios_cliente_anexos || [];
  document.getElementById('anexosDesvio').innerHTML = ax.length
    ? ax.map(a => `<div class="anexo-linha">📎 <span>${esc(a.arquivo_nome)}</span>
        <span style="color:var(--text2);font-size:11px">${new Date(a.enviado_em).toLocaleDateString('pt-BR')}</span>
        <button class="btn btn-sm" onclick="baixarAnexoDesvio(${a.id}, this)">⬇ Baixar</button>
        <button class="btn btn-sm so-editor" onclick="removerAnexoDesvio(${a.id})" title="Remover documento">✕</button></div>`).join('')
    : `<div style="font-size:12.5px;color:var(--text2)">Nenhum documento anexado.</div>`;
}

function listarAnexosNovos(){
  const fs = [...(document.getElementById('f_anexos').files || [])];
  document.getElementById('anexosNovos').textContent = fs.length ? `${fs.length} arquivo(s) — sobem quando você salvar: ${fs.map(f => f.name).join(', ')}` : '';
}

function acharAnexoDesvio(anexoId){
  for (const d of DESVIOS){ const a = (d.desvios_cliente_anexos || []).find(x => x.id === anexoId); if (a) return { d, a }; }
  return {};
}

async function baixarAnexoDesvio(anexoId, btnEl){
  const { a } = acharAnexoDesvio(anexoId);
  if (!a) return;
  const txt = btnEl.textContent;
  btnEl.textContent = 'Abrindo...'; btnEl.disabled = true;
  try {
    const { data, error } = await sb.storage.from('qualidade-docs').createSignedUrl(a.arquivo_path, 3600, { download: nomeArquivoSeguro(a.arquivo_nome) || true });
    if (error) throw error;
    window.open(data.signedUrl, '_blank');
  } catch (err){
    showMsg('Não foi possível baixar o documento: ' + (err.message || err), false);
  } finally {
    btnEl.textContent = txt; btnEl.disabled = false;
  }
}

async function removerAnexoDesvio(anexoId){
  const { d, a } = acharAnexoDesvio(anexoId);
  if (!a || !confirm(`Remover o documento "${a.arquivo_nome}"?`)) return;
  const { error } = await sb.from('desvios_cliente_anexos').delete().eq('id', anexoId);
  if (error){ showMsg('Erro ao remover: ' + error.message, false); return; }
  await sb.storage.from('qualidade-docs').remove([a.arquivo_path]);
  d.desvios_cliente_anexos = d.desvios_cliente_anexos.filter(x => x.id !== anexoId);
  renderAnexosDesvio(d);
  showMsg('Documento removido.', true);
}

// sobe os arquivos escolhidos no formulário; devolve quantos falharam
async function enviarAnexosDesvio(desvioId){
  const arquivos = [...(document.getElementById('f_anexos')?.files || [])];
  let falhas = 0;
  for (const file of arquivos){
    const path = `desvios/${desvioId}/${Date.now()}_${file.name}`.replace(/[^\w.\-\/]/g, '_');
    const { error: upErr } = await sb.storage.from('qualidade-docs').upload(path, file);
    if (upErr){ falhas++; console.warn('anexo', file.name, upErr.message); continue; }
    const { error } = await sb.from('desvios_cliente_anexos').insert({ desvio_id: desvioId, arquivo_path: path, arquivo_nome: file.name });
    if (error){ falhas++; console.warn('anexo', file.name, error.message); await sb.storage.from('qualidade-docs').remove([path]); }
  }
  return falhas;
}

function preencherClienteDoPedido(pedidoId){
  const campo = document.getElementById('f_cliente');
  const p = PEDIDOS.find(x => x.id === Number(pedidoId));
  if (campo && p?.cliente && !campo.value.trim()) campo.value = p.cliente;
}

async function salvarDesvio(){
  const v = id => document.getElementById('f_' + id)?.value ?? '';
  const dados = {
    status_desvio: v('status_desvio') || 'em_aberto',
    tipo: document.querySelector('input[name="tipo_desvio_cli"]:checked')?.value || 'desvio',
    empresa: v('empresa'),
    pedido_id: v('pedido_id') ? Number(v('pedido_id')) : null,
    cliente: v('cliente') || null,
    data_desvio: v('data_desvio') || null,
    desenho: v('desenho') || null,
    desenho_cliente: v('desenho_cliente') || null,
    posicao: v('posicao') || null,
    tag: v('tag') || null,
    descricao: v('descricao') || null,
    prazo_resposta: v('prazo_resposta') || null,

    custo: v('custo') ? Number(v('custo')) : null,
    debito: v('debito') || null,
  };
  if (!dados.empresa){ showMsg('Selecione a Empresa.', false); return; }
  if (!dados.data_desvio){ showMsg('Informe a Data.', false); return; }

  const btn = document.getElementById('btnSalvarDesvio');
  btn.disabled = true; const txt = btn.textContent; btn.textContent = 'Salvando...';
  try {
    let desvioId, aviso;
    if (DESVIO_EDITANDO){
      const { error } = await sb.from('desvios_cliente').update(dados).eq('id', DESVIO_EDITANDO.id);
      if (error) throw error;
      desvioId = DESVIO_EDITANDO.id;
      aviso = 'Desvio ' + formatarNumeroDesvio(DESVIO_EDITANDO) + ' atualizado.';
    } else {
      const { data, error } = await sb.from('desvios_cliente').insert(dados).select('id').single();
      if (error) throw error;
      desvioId = data.id;
      aviso = 'Desvio criado com sucesso.';
    }
    btn.textContent = 'Enviando documentos...';
    const falhas = await enviarAnexosDesvio(desvioId);
    showMsg(falhas ? `${aviso} Mas ${falhas} documento(s) não subiram — abra o desvio e tente anexar de novo.` : aviso, !falhas);
    await carregarDesvios();
    VISAO = 'desvios'; DESVIO_EDITANDO = null; renderNav(); renderListaDesvios();
  } catch (e){
    showMsg('Erro ao salvar: ' + e.message, false);
  } finally {
    btn.disabled = false; btn.textContent = txt;
  }
}

let FILTRO_STATUS = '';
let FILTRO_TERMO = '';

function filtrarLista(){
  const termo = FILTRO_TERMO.toLowerCase();
  return RNCS.filter(r => {
    if (FILTRO_STATUS && r.status_nc !== FILTRO_STATUS) return false;
    if (!termo) return true;
    const chave = `${formatarNumeroRNC(r)} ${r.pedidos?.numero_pedido||''} ${r.fornecedor||''} ${r.tipo_desvio||''} ${r.desenho||''} ${r.emitido_por||''} ${r.debito||''}`.toLowerCase();
    return chave.includes(termo);
  });
}

// ── Desenho do RNC ligado aos desenhos que a Engenharia subiu pro pedido ──
// Campo continua opcional; se preencher, tem que ser um desenho cadastrado
// no pedido escolhido (os mesmos que o PCP e o Dashboard veem).
// Exceção: RNC antigo pode ser salvo com o desenho que já tinha.
const CACHE_DESENHOS_PEDIDO = {};
let DESENHOS_PEDIDO_RNC = [];
let DESENHO_RNC_ORIGINAL = '';
const normDesenho = s => String(s || '').trim().toUpperCase().replace(/\s+/g, '');

async function carregarDesenhosPedidoRNC(pedidoId){
  DESENHOS_PEDIDO_RNC = [];
  const dl = document.getElementById('dl_desenhos_rnc');
  if (pedidoId){
    if (!CACHE_DESENHOS_PEDIDO[pedidoId]){
      const { data, error } = await sb.from('desenhos_engenharia')
        .select('desenho_mde, revisao, nome_equipamento, setor, remessas(numero)')
        .eq('pedido_id', Number(pedidoId));
      if (error){ console.warn('desenhos do pedido:', error.message); }
      // um desenho pode ter várias linhas (uma por tag) -- fica uma por número
      const porNumero = new Map();
      (data || []).forEach(d => { if (d.desenho_mde && !porNumero.has(normDesenho(d.desenho_mde))) porNumero.set(normDesenho(d.desenho_mde), d); });
      CACHE_DESENHOS_PEDIDO[pedidoId] = [...porNumero.values()].sort((a, b) => a.desenho_mde.localeCompare(b.desenho_mde));
    }
    DESENHOS_PEDIDO_RNC = CACHE_DESENHOS_PEDIDO[pedidoId];
  }
  if (dl) dl.innerHTML = DESENHOS_PEDIDO_RNC.map(d => `<option value="${esc(d.desenho_mde)}">${esc([d.revisao != null && d.revisao !== '' ? 'Rev. ' + d.revisao : '', d.nome_equipamento, d.remessas?.numero ? 'Rem. ' + d.remessas.numero : ''].filter(Boolean).join(' · '))}</option>`).join('');
  conferirDesenhoRNC();
}

function acharDesenhoRNC(valor){ return DESENHOS_PEDIDO_RNC.find(d => normDesenho(d.desenho_mde) === normDesenho(valor)); }

// mostra embaixo do campo se o desenho existe no pedido; ao escolher um, preenche a revisão
function conferirDesenhoRNC(preencher){
  const inp = document.getElementById('f_desenho'), dica = document.getElementById('dicaDesenhoRNC');
  if (!inp || !dica) return;
  const valor = inp.value.trim();
  const pedidoId = document.getElementById('f_pedido_id')?.value;
  dica.className = 'dica-desenho';
  if (!valor){ dica.textContent = pedidoId ? (DESENHOS_PEDIDO_RNC.length ? `${DESENHOS_PEDIDO_RNC.length} desenho(s) neste pedido — digite ou escolha na lista` : 'Nenhum desenho cadastrado pela Engenharia neste pedido') : ''; return; }
  const d = acharDesenhoRNC(valor);
  if (d){
    dica.textContent = '✓ Desenho cadastrado' + (d.nome_equipamento ? ' — ' + d.nome_equipamento : '');
    dica.classList.add('ok');
    if (preencher){
      inp.value = d.desenho_mde;
      const rev = document.getElementById('f_revisao');
      if (rev && !rev.value.trim() && d.revisao != null) rev.value = d.revisao;
    }
  } else if (normDesenho(valor) === normDesenho(DESENHO_RNC_ORIGINAL)){
    dica.textContent = 'Desenho antigo deste RNC (não está cadastrado no pedido)';
  } else {
    dica.textContent = pedidoId ? '✕ Esse desenho não está cadastrado neste pedido' : '✕ Escolha o pedido primeiro';
    dica.classList.add('erro');
  }
}

function desenhoRNCValido(){
  const valor = (document.getElementById('f_desenho')?.value || '').trim();
  if (!valor) return true;
  if (normDesenho(valor) === normDesenho(DESENHO_RNC_ORIGINAL)) return true;
  if (!document.getElementById('f_pedido_id')?.value){ showMsg('Para informar o desenho, escolha primeiro o pedido.', false); return false; }
  if (!acharDesenhoRNC(valor)){ showMsg(`O desenho "${valor}" não está cadastrado neste pedido. Confira o número (tem que ser um dos desenhos que a Engenharia subiu) ou deixe o campo em branco.`, false); return false; }
  return true;
}

async function salvarRNC(){
  const dados = coletarDadosForm();
  if (!dados.empresa){ showMsg('Selecione a Empresa.', false); return; }
  if (!desenhoRNCValido()) return;

  const btn = document.getElementById('btnSalvarRNC');
  btn.disabled = true; const txtOriginal = btn.textContent; btn.textContent = 'Salvando...';

  try {
    if (RNC_EDITANDO){
      const { error } = await sb.from('rnc').update(dados).eq('id', RNC_EDITANDO.id);
      if (error) throw error;
      showMsg('RNC ' + formatarNumeroRNC(RNC_EDITANDO) + ' atualizado.', true);
    } else {
      const { error } = await sb.from('rnc').insert(dados);
      if (error) throw error;
      showMsg('RNC criado com sucesso.', true);
    }
    await carregarRNCs();
    irLista();
  } catch (e){
    showMsg('Erro ao salvar: ' + e.message, false);
  } finally {
    btn.disabled = false; btn.textContent = txtOriginal;
  }
}

// ── INDICADOR RNCs (painel de KPI mensal) ───────────────────────────────
const MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
let ANO_INDICADOR = new Date().getFullYear();

let MODO_INDICADOR = 'tabelas'; // 'tabelas' | 'graficos'

// os mesmos quadros (tabela e gráfico) usam esta contagem mensal por empresa
const INDICADORES = [
  { titulo: 'Reclamação de Cliente — Controle Externo de RNC', origem: 'cliente', objetivo: 5 },
  { titulo: 'Controle Interno de RNC', origem: 'interno', objetivo: 5 },
  { titulo: 'Controle de RNC Fornecedores', origem: 'fornecedor', objetivo: 5 },
];
function noMes(data, mIdx){
  if (!data) return false;
  const d = new Date(data + 'T00:00:00');
  return d.getFullYear() === ANO_INDICADOR && d.getMonth() === mIdx;
}
function contagensIndicador(origemFiltro){
  return EMPRESAS.map(emp => {
    const contagens = MESES.map((_, mIdx) =>
      RNCS.filter(r => r.empresa === emp && r.origem_rnc === origemFiltro && noMes(r.data_abertura, mIdx)).length
      // desvio de cliente marcado como "RNC" conta na reclamação de cliente
      + (origemFiltro === 'cliente' ? DESVIOS.filter(d => d.empresa === emp && d.tipo === 'rnc' && noMes(d.data_desvio, mIdx)).length : 0)
    );
    const total = contagens.reduce((a,b) => a+b, 0);
    return { emp, contagens, total };
  });
}

function tabelaIndicador(titulo, origemFiltro, objetivo){
  const linhas = contagensIndicador(origemFiltro);
  return `<div class="kpi-block">
    <div class="kpi-title">${titulo} — ${ANO_INDICADOR}</div>
    <div class="kpi-obj">Objetivo: máximo de ${objetivo} não conformidades por mês</div>
    <div class="tbl-wrap"><table class="kpi-tbl">
      <thead><tr><th>Empresa</th>${MESES.map(m => `<th>${m}/${String(ANO_INDICADOR).slice(2)}</th>`).join('')}<th>Total</th></tr></thead>
      <tbody>${linhas.map(l => {
        const acimaObjetivo = l.contagens.some(c => c > objetivo);
        return `<tr class="${acimaObjetivo?'kpi-warn':''}"><td>${esc(l.emp)}</td>${l.contagens.map(c => `<td>${c}</td>`).join('')}<td class="tot">${l.total}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

function renderIndicadores(){
  const anos = Array.from(new Set(RNCS.map(r => r.data_abertura ? new Date(r.data_abertura+'T00:00:00').getFullYear() : null).filter(Boolean)));
  if (!anos.includes(ANO_INDICADOR)) anos.push(ANO_INDICADOR);
  anos.sort((a,b) => b-a);

  let h = `<div class="search-row">
    <select onchange="ANO_INDICADOR=Number(this.value);renderIndicadores()">
      ${anos.map(a => `<option value="${a}" ${a===ANO_INDICADOR?'selected':''}>${a}</option>`).join('')}
    </select>
    <div class="modo-tabs">
      <button class="${MODO_INDICADOR==='tabelas'?'active':''}" onclick="MODO_INDICADOR='tabelas';renderIndicadores()">Tabelas</button>
      <button class="${MODO_INDICADOR==='graficos'?'active':''}" onclick="MODO_INDICADOR='graficos';renderIndicadores()">Gráficos</button>
    </div>
    ${MODO_INDICADOR==='graficos' ? `<button class="btn" onclick="window.print()">🖨 Imprimir gráficos</button>` : ''}
    <button class="btn" onclick="irLista()">← Voltar para lista de RNCs</button>
  </div>`;
  if (MODO_INDICADOR === 'graficos'){
    h += `<div class="graficos-print"><div class="print-only print-head"><h1>Indicadores de RNC — MDE — ${ANO_INDICADOR}</h1><div>Impresso em ${new Date().toLocaleString('pt-BR')}</div></div>`;
    h += INDICADORES.map(i => graficoIndicador(i.titulo, i.origem, i.objetivo)).join('') + `</div>`;
  } else {
    h += INDICADORES.map(i => tabelaIndicador(i.titulo, i.origem, i.objetivo)).join('');
  }

  document.getElementById('content').innerHTML = h;
}

// gráfico de barras agrupadas (SVG): 12 meses x empresas, linha tracejada no objetivo
const CORES_EMPRESA = ['#2a78d6', '#eb6834'];
function graficoIndicador(titulo, origemFiltro, objetivo){
  const linhas = contagensIndicador(origemFiltro);
  const W = 960, H = 235, mL = 34, mR = 12, mT = 16, mB = 28;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const maxVal = Math.max(objetivo + 1, ...linhas.flatMap(l => l.contagens));
  const passo = maxVal <= 8 ? 1 : maxVal <= 20 ? 2 : 5;
  const yMax = Math.ceil(maxVal / passo) * passo;
  const y = v => mT + plotH - (v / yMax) * plotH;
  const grupoW = plotW / 12;
  const barW = Math.min(22, (grupoW - 14) / linhas.length);
  const gap = 2;

  let svg = '';
  // faixa de destaque nos meses acima do objetivo
  MESES.forEach((_, m) => {
    if (linhas.some(l => l.contagens[m] > objetivo))
      svg += `<rect x="${mL + m*grupoW}" y="${mT}" width="${grupoW}" height="${plotH}" fill="#FEE2E2" opacity=".6"/>`;
  });
  // grade + eixo Y
  for (let v = 0; v <= yMax; v += passo){
    svg += `<line x1="${mL}" x2="${W-mR}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#9CA3AF':'#EEF0F3'}" stroke-width="1"/>`;
    svg += `<text x="${mL-8}" y="${y(v)+3.5}" text-anchor="end" font-size="10.5" fill="#6B7280">${v}</text>`;
  }
  // barras
  MESES.forEach((mes, m) => {
    const larguraGrupo = linhas.length * barW + (linhas.length - 1) * gap;
    const x0 = mL + m*grupoW + (grupoW - larguraGrupo) / 2;
    linhas.forEach((l, i) => {
      const v = l.contagens[m];
      if (!v) return;
      const x = x0 + i*(barW + gap), yt = y(v), hgt = mT + plotH - yt, rr = Math.min(4, hgt, barW/2);
      svg += `<path d="M${x},${mT+plotH} V${yt+rr} Q${x},${yt} ${x+rr},${yt} H${x+barW-rr} Q${x+barW},${yt} ${x+barW},${yt+rr} V${mT+plotH} Z" fill="${CORES_EMPRESA[i]}"/>`;
      svg += `<text x="${x+barW/2}" y="${yt-4}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111827">${v}</text>`;
    });
    svg += `<text x="${mL + m*grupoW + grupoW/2}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="#6B7280">${mes}/${String(ANO_INDICADOR).slice(2)}</text>`;
    // área de hover do mês inteiro (dica com os números das empresas)
    const dica = `${mes}/${ANO_INDICADOR}\n` + linhas.map(l => `${l.emp}: ${l.contagens[m]}`).join('\n') + `\nObjetivo: máx. ${objetivo}`;
    svg += `<rect x="${mL + m*grupoW}" y="${mT}" width="${grupoW}" height="${plotH}" fill="transparent"><title>${esc(dica)}</title></rect>`;
  });
  // linha do objetivo
  svg += `<line x1="${mL}" x2="${W-mR}" y1="${y(objetivo)}" y2="${y(objetivo)}" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  svg += `<text x="${W-mR-4}" y="${y(objetivo)-5}" text-anchor="end" font-size="10.5" font-weight="600" fill="#DC2626">Objetivo: máx. ${objetivo}</text>`;

  const totalGeral = linhas.reduce((a, l) => a + l.total, 0);
  return `<div class="kpi-block grafico-bloco">
    <div class="grafico-topo">
      <div>
        <div class="kpi-title">${titulo} — ${ANO_INDICADOR}</div>
        <div class="kpi-obj">Objetivo: máximo de ${objetivo} não conformidades por mês · Total no ano: <strong>${totalGeral}</strong></div>
      </div>
      <div class="grafico-legenda">
        ${linhas.map((l, i) => `<span><i style="background:${CORES_EMPRESA[i]}"></i>${esc(l.emp)} (${l.total})</span>`).join('')}
        <span><i class="leg-obj"></i>Objetivo</span>
      </div>
    </div>
    <div class="grafico-card"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(titulo)} ${ANO_INDICADOR}">${svg}</svg></div>
  </div>`;
}

let logoDataUrlMDE = null;
function carregarLogoMDEParaPdf(){
  return new Promise((resolve) => {
    if (logoDataUrlMDE){ resolve(logoDataUrlMDE); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      try { logoDataUrlMDE = canvas.toDataURL('image/png'); } catch { logoDataUrlMDE = null; }
      resolve(logoDataUrlMDE);
    };
    img.onerror = () => resolve(null);
    img.src = 'assets/logo-mde.png';
  });
}

// opts.retornar: devolve {nome, base64} em vez de baixar (usado pelo Databook, item 5.1)
async function gerarDocumentoRNC(id, opts){
  const r = RNCS.find(x => x.id === id);
  if (!r){ showMsg('RNC não encontrado.', false); return; }

  const logo = await carregarLogoMDEParaPdf();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const M = 14, CW = 182;
  const COR = { ink:[23,33,43], inkSoft:[91,107,120], line:[219,225,230], navy:[16,42,68], blue:[29,78,216], green:[16,150,90], amber:[181,105,10], red:[190,40,40] };

  function rodape(pagina){
    doc.setFont(undefined,'normal'); doc.setFontSize(8); doc.setTextColor(...COR.inkSoft);
    doc.text(`MDE Equipamentos Industriais · MG-008 · Gerado em ${new Date().toLocaleString('pt-BR')}`, M, 291);
    doc.text(`Pág. ${pagina}`, M+CW, 291, { align: 'right' });
  }
  function tituloSecao(y, texto){
    doc.setFont(undefined,'bold'); doc.setFontSize(10); doc.setTextColor(...COR.blue);
    doc.text(texto.toUpperCase(), M, y);
    doc.setDrawColor(...COR.line); doc.setLineWidth(0.35);
    doc.line(M, y+1.8, M+CW, y+1.8);
    return y + 6;
  }
  function checarQuebra(y, alturaNecessaria){
    if (y + alturaNecessaria > 284){
      rodape(doc.internal.getNumberOfPages());
      doc.addPage();
      return 20;
    }
    return y;
  }
  // campo rotulado simples numa linha; retorna y avançado
  function linhaCampos(y, campos){
    const w = CW / campos.length;
    campos.forEach(([label, valor], i) => {
      const x = M + i*w;
      doc.setFont(undefined,'normal'); doc.setFontSize(7); doc.setTextColor(...COR.inkSoft);
      doc.text(label.toUpperCase(), x, y);
      doc.setFont(undefined,'bold'); doc.setFontSize(9.5); doc.setTextColor(...COR.ink);
      doc.text(String(valor ?? '—') || '—', x, y+5, { maxWidth: w-4 });
    });
    return y + 10;
  }
  function blocoTexto(y, label, texto){
    doc.setFont(undefined,'normal'); doc.setFontSize(7); doc.setTextColor(...COR.inkSoft);
    doc.text(label.toUpperCase(), M, y);
    y += 4;
    doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(...COR.ink);
    const linhas = doc.splitTextToSize(texto && texto.trim() ? texto : '—', CW);
    y = checarQuebra(y, linhas.length * 4 + 3);
    doc.text(linhas, M, y);
    return y + linhas.length * 4 + 3.5;
  }
  function checkbox(x, y, marcado){
    doc.setDrawColor(...COR.ink); doc.setLineWidth(0.35);
    doc.rect(x, y-3, 3.2, 3.2);
    if (marcado){
      doc.setFont(undefined,'bold'); doc.setFontSize(8);
      doc.text('X', x+0.5, y-0.4);
    }
  }
  function grupoOpcoes(y, label, opcoesMap, valorAtual){
    doc.setFont(undefined,'normal'); doc.setFontSize(7); doc.setTextColor(...COR.inkSoft);
    doc.text(label.toUpperCase(), M, y);
    y += 5;
    let x = M;
    doc.setFont(undefined,'normal'); doc.setFontSize(8.5); doc.setTextColor(...COR.ink);
    Object.entries(opcoesMap).forEach(([v,l]) => {
      checkbox(x, y, valorAtual === v);
      doc.setFont(undefined,'normal'); doc.setFontSize(8.5);
      doc.text(l, x+5, y);
      x += doc.getTextWidth(l) + 16;
    });
    return y + 7;
  }

  // ── cabeçalho ──
  doc.setFillColor(...COR.navy);
  doc.rect(0, 0, 210, 26, 'F');
  if (logo){ try { doc.addImage(logo, 'PNG', M, 4, 26, 26*(98/219)); } catch {} }
  doc.setFont(undefined,'bold'); doc.setFontSize(14); doc.setTextColor(255,255,255);
  doc.text('RELATÓRIO DE NÃO CONFORMIDADE', M+CW, 11, { align: 'right' });
  doc.setFont(undefined,'normal'); doc.setFontSize(9);
  doc.text(`RNC Nº ${formatarNumeroRNC(r)}  ·  MG-008`, M+CW, 18, { align: 'right' });

  let y = 34;

  // status + empresa
  const corStatus = r.status_nc === 'encerrado' ? COR.green : COR.amber;
  doc.setFillColor(...corStatus); doc.roundedRect(M, y-4.5, 34, 7, 1.5, 1.5, 'F');
  doc.setFont(undefined,'bold'); doc.setFontSize(8.5); doc.setTextColor(255,255,255);
  doc.text((LABEL_STATUS[r.status_nc]||r.status_nc).toUpperCase(), M+17, y, { align:'center' });
  doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(...COR.ink);
  doc.text(esc_pdf(r.empresa), M+CW, y, { align:'right' });
  y += 9;

  y = tituloSecao(y, 'Identificação');
  y = linhaCampos(y, [
    ['Pedido', r.pedidos?.numero_pedido || 'NA'],
    ['Fornecedor', r.fornecedor || 'NA'],
    ['Tipo de Desvio', r.tipo_desvio || 'NA'],
    ['Responsável pela NC', r.responsavel_nc || 'NA'],
  ]);
  y = linhaCampos(y, [
    ['Ordem de Compra', r.ordem_compra || 'NA'],
    ['Item da OC', r.item_oc || 'NA'],
    ['Nota Fiscal', r.nota_fiscal || 'NA'],
  ]);
  y += 1;

  y = tituloSecao(y, 'Desenho / Item');
  y = linhaCampos(y, [
    ['Desenho', r.desenho || 'NA'],
    ['Revisão', r.revisao || 'NA'],
    ['Posição / Marca', r.posicao || 'NA'],
    ['Especificação Técnica', r.especificacao_tecnica || 'NA'],
  ]);
  y = linhaCampos(y, [
    ['Item', r.item || 'NA'],
    ['Quant. Inspecionada', r.quantidade_inspecionada ?? 'NA'],
    ['Quant. Segregada', r.quantidade_segregada ?? 'NA'],
    ['Unid. de Medida', r.unidade_medida || 'NA'],
  ]);
  y += 1;

  y = checarQuebra(y, 30);
  y = tituloSecao(y, 'Descrição da Não Conformidade');
  y = blocoTexto(y, 'Especificado', r.especificado);
  y = blocoTexto(y, 'Encontrado', r.encontrado);
  y = blocoTexto(y, 'Observações / Comentários', r.observacoes);

  y = checarQuebra(y, 20);
  y = tituloSecao(y, 'Emissão');
  y = linhaCampos(y, [
    ['Local da Não Conformidade', r.local_nc || 'NA'],
    ['Emitido por', r.emitido_por || 'NA'],
    ['Data de Abertura', fmtData(r.data_abertura)],
  ]);
  y += 1;

  y = checarQuebra(y, 25);
  y = tituloSecao(y, 'Causa e Origem');
  y = blocoTexto(y, 'Causa', r.causa);
  y = linhaCampos(y, [
    ['Origem do RNC', LABEL_ORIGEM[r.origem_rnc] || 'NA'],
    ['Débito', r.debito || 'NA'],
  ]);
  y += 1;

  y = checarQuebra(y, 35);
  y = tituloSecao(y, 'Disposição');
  y = linhaCampos(y, [
    ['Responsável pela Disposição', r.responsavel_disposicao || 'NA'],
    ['Prazo para Execução', fmtData(r.prazo_execucao)],
  ]);
  y = grupoOpcoes(y, 'Disposição', LABEL_DISPOSICAO, r.disposicao);
  y = blocoTexto(y, 'Descrição da Disposição', r.descricao_disposicao);
  y += 1;

  y = checarQuebra(y, 22);
  y = tituloSecao(y, 'Verificação de Eficácia');
  y = grupoOpcoes(y, 'Verificação de Eficácia', LABEL_EFICACIA, r.verificacao_eficacia);
  y = linhaCampos(y, [
    ['Data da Verificação', fmtData(r.data_verificacao)],
    ['Custo do Retrabalho', r.custo != null ? 'R$ ' + Number(r.custo).toLocaleString('pt-BR',{minimumFractionDigits:2}) : 'NA'],
  ]);

  rodape(doc.internal.getNumberOfPages());
  // nome do arquivo: RNC_02-2026_P-215_BOSTON.pdf (pedido e cliente quando houver)
  const partesNome = ['RNC_' + formatarNumeroRNC(r).replace('/','-'), r.pedidos?.numero_pedido, r.pedidos?.cliente]
    .filter(Boolean)
    .map(p => String(p).trim().replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '_'));
  if (opts?.retornar) return { nome: partesNome.join('_') + '.pdf', base64: doc.output('datauristring').split(',')[1] };
  doc.save(partesNome.join('_') + '.pdf');
}
function esc_pdf(s){ return s == null ? '' : String(s); }

const DB_ROMANO = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];

let DATABOOKS = [];
let DB_ATUAL = null, DB_ITENS = [], DB_REVS = [];
let DB_SERVICO_ON = false;
let DB_GERANDO = false;

function irDatabooks(){ VISAO = 'databooks'; DB_ATUAL = null; renderNav(); renderListaDatabooks(); clearMsg(); }
function irNovoDatabook(){ VISAO = 'databookNovo'; DB_ATUAL = null; renderNav(); renderNovoDatabook(); clearMsg(); }
async function irDatabook(id){
  VISAO = 'databook'; clearMsg();
  document.getElementById('content').innerHTML = '<div class="empty">Carregando databook...</div>';
  await carregarDatabook(id);
  renderNav(); renderDatabook();
}

async function servicoDatabook(rota, corpo){
  const r = await fetch(DB_SERVICO + rota, corpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || ('Programa do Data Book respondeu ' + r.status));
  return j;
}
async function checarServicoDatabook(){
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 1500);
    const r = await fetch(DB_SERVICO + '/status', { signal: ctl.signal }); clearTimeout(t);
    DB_SERVICO_ON = r.ok;
  } catch { DB_SERVICO_ON = false; }
  return DB_SERVICO_ON;
}
function htmlServicoDatabook(){
  return DB_SERVICO_ON
    ? `<div class="db-servico on">🟢 Programa do Data Book conectado neste PC — pode criar pastas, conferir arquivos e gerar.</div>`
    : `<div class="db-servico off">⚪ Programa do Data Book não está aberto neste PC. Para criar pastas, conferir arquivos e gerar, use o PC da Qualidade e abra <b>&nbsp;Iniciar-Databook&nbsp;</b> (atalho na área de trabalho). <button class="btn btn-sm" style="margin-left:auto" onclick="recarregarServicoDatabook()">Tentar de novo</button></div>`;
}
async function recarregarServicoDatabook(){ await checarServicoDatabook(); if (VISAO === 'databook') renderDatabook(); else renderListaDatabooks(); }

async function carregarDatabooks(){
  const { data, error } = await sb.from('databooks')
    .select('*, pedidos(numero_pedido, cliente), databook_itens(aplicavel, arquivos, origem)')
    .order('criado_em', { ascending: false });
  if (error){ DATABOOKS = []; showMsg('Databooks: ' + error.message + (/relation|does not exist|schema cache/i.test(error.message) ? ' — rode o sql/085_databooks.sql no Supabase.' : ''), false); return; }
  DATABOOKS = data || [];
}
async function carregarDatabook(id){
  const [a, b, c] = await Promise.all([
    sb.from('databooks').select('*, pedidos(numero_pedido, cliente)').eq('id', id).single(),
    sb.from('databook_itens').select('*').eq('databook_id', id).order('capitulo').order('ordem'),
    sb.from('databook_revisoes').select('*').eq('databook_id', id).order('ordem'),
  ]);
  if (a.error){ showMsg('Erro ao abrir databook: ' + a.error.message, false); return; }
  DB_ATUAL = a.data; DB_ITENS = b.data || []; DB_REVS = c.data || [];
  if (!Array.isArray(DB_ATUAL.capitulos) || !DB_ATUAL.capitulos.length) DB_ATUAL.capitulos = DB_CAPITULOS_PADRAO.map(x => ({...x}));
  await checarServicoDatabook();
}

function statusItemDatabook(it){
  if (!it.aplicavel) return 'na';
  const arqs = it.arquivos || [];
  if (arqs.some(a => a.erro)) return 'err';
  return arqs.length ? 'ok' : 'pend';
}
const DB_CHIP = { ok: ['st-ok', 'OK'], pend: ['st-pend', 'Pendente'], na: ['st-na', 'N/A'], err: ['st-err', 'Arquivo com erro'] };
function resumoItensDatabook(itens){
  const r = { ok: 0, pend: 0, na: 0, err: 0, paginas: 0 };
  itens.forEach(it => { r[statusItemDatabook(it)]++; if (it.aplicavel) r.paginas += (it.arquivos || []).reduce((s, a) => s + (a.paginas || 0), 0); });
  return r;
}

async function renderListaDatabooks(){
  document.getElementById('content').innerHTML = '<div class="empty">Carregando databooks...</div>';
  await carregarDatabooks();
  const linhas = DATABOOKS.map(d => {
    const r = resumoItensDatabook(d.databook_itens || []);
    const aplic = r.ok + r.pend + r.err;
    const pct = aplic ? Math.round(r.ok * 100 / aplic) : 0;
    return `<tr onclick="irDatabook(${d.id})">
      <td class="rnc-num">${esc(d.pedidos?.numero_pedido || '—')}</td>
      <td>${esc(d.pedidos?.cliente || '—')}</td>
      <td>${esc(d.titulo || '—')}</td>

      <td>${esc(d.revisao || '0')}</td>
      <td style="min-width:150px"><div class="db-progresso"><div style="width:${pct}%"></div></div><span style="font-size:11px;color:var(--text2)">${r.ok}/${aplic} itens · ${pct}%</span></td>
      <td><span class="status-badge ${d.status==='aprovado'?'sb-encerrado':'sb-aberto'}">${DB_LABEL_STATUS[d.status] || d.status}</span></td>
      <td>${d.ultima_geracao ? new Date(d.ultima_geracao).toLocaleString('pt-BR') + (d.ultima_geracao_info?.paginas ? ' · ' + d.ultima_geracao_info.paginas + ' pág.' : '') : '—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('content').innerHTML = `<div class="search-row">
      <div style="flex:1;color:var(--text2);font-size:12.5px">Só os pedidos que precisam de data book. Os certificados ficam na pasta do pedido no OneDrive; aqui fica o checklist.</div>
      <button class="btn btn-primary so-editor" onclick="irNovoDatabook()">+ Abrir Databook</button>
    </div>
    ${DATABOOKS.length ? `<div class="tbl-wrap"><table class="dtbl">
      <thead><tr><th>Pedido</th><th>Cliente</th><th>Título</th><th>Nº Cliente</th><th>Rev.</th><th>Andamento</th><th>Status</th><th>Última geração</th></tr></thead>
      <tbody>${linhas}</tbody></table></div>` : '<div class="empty">Nenhum databook aberto ainda.</div>'}`;
}

async function criarDatabook(){
  const v = id => (document.getElementById('f_' + id)?.value || '').trim();
  const pedidoId = Number(v('db_pedido'));
  if (!pedidoId){ showMsg('Escolha o pedido.', false); return; }
  if (!v('db_titulo')){ showMsg('Informe o título (equipamento) do databook.', false); return; }
  const btn = document.getElementById('btnCriarDb'); btn.disabled = true;
  const { data: db, error } = await sb.from('databooks').insert({
    pedido_id: pedidoId, titulo: v('db_titulo'), projeto: v('db_projeto') || null, subtitulo: v('db_subtitulo') || null,
    numero_cliente: v('db_numero_cliente') || null, numero_contratada: v('db_numero_contratada') || null,
    pasta: v('db_pasta') || null, capitulos: DB_CAPITULOS_PADRAO,
    criado_por_nome: AUTH.nome, criado_data: new Date().toISOString().slice(0, 10),
  }).select('id').single();
  if (error){ btn.disabled = false; showMsg('Erro ao abrir databook: ' + error.message, false); return; }
  const itens = DB_MODELO.map(([cap, cod, desc, aplic, origem], i) => ({ databook_id: db.id, capitulo: cap, codigo: cod, descricao: desc, aplicavel: !!aplic, origem: origem || 'pasta', ordem: (i + 1) * 10 }));
  const r2 = await sb.from('databook_itens').insert(itens);
  if (r2.error){ btn.disabled = false; showMsg('Databook criado, mas deu erro nos itens: ' + r2.error.message, false); return; }
  await sb.from('databook_revisoes').insert({ databook_id: db.id, rev: 'A', te: 'B', descricao: 'EMISSÃO INICIAL', ordem: 1 });
  await irDatabook(db.id);
  if (DB_ATUAL?.pasta && DB_SERVICO_ON) await criarPastasDatabook(true);
  showMsg('Databook aberto. Marque o que se aplica a este pedido e coloque os arquivos nas pastas.', true);
}
