<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Flow Suite">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Flow Suite — Apontamento de Horas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --navy:#0b1e33; --navy2:#102A43; --navy3:#173a5e;
  --bg:#F8FAFC; --bg2:#ffffff; --bg3:#F1F5F9; --bg4:#E9EDF3;
  --border:#E5E7EB; --border-strong:#CBD5E1; --text:#111827; --text2:#6B7280; --text3:#9CA3AF;
  --blue:#1D4ED8; --blue-dim:#DBEAFE; --blue-hover:#1E40AF; --header-bg:#102A43;
  --green:#10B981; --green-dim:#D1FAE5;
  --amber:#b5690a; --amber-dim:#faedd9;
  --red:#DC2626; --red-dim:#FEE2E2;
  --radius:16px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 8px 20px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}

/* ── APP SHELL ── */
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.app-header{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 22px;background:var(--header-bg);border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:100}
.app-header-brand{display:flex;align-items:center;gap:10px}
.app-header-brand .logo-full{height:42px;width:auto;flex-shrink:0;display:block}
.app-header-right{display:flex;align-items:center;gap:12px}
.header-user{font-size:12px;color:rgba(255,255,255,.6);text-align:right;line-height:1.3}
.header-user strong{color:#fff;font-weight:600;display:block;font-size:12.5px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn svg{width:15px;height:15px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4f8ef7,#7c6cf0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}

.app-body{flex:1;display:flex;min-height:0}
.sidebar{width:222px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:16px 10px;transition:width .15s ease}
.app-shell.sidebar-collapsed .sidebar{width:68px}
.app-shell.sidebar-collapsed .nav-label,.app-shell.sidebar-collapsed .collapse-label{display:none}
.sidebar-nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.66);text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--blue);color:#fff;font-weight:600}
.collapse-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.45);background:none;border:none;cursor:pointer;font-size:12.5px;width:100%;font-family:inherit}
.collapse-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.collapse-btn svg{width:15px;height:15px;transition:transform .15s;flex-shrink:0}
.app-shell.sidebar-collapsed .collapse-btn svg{transform:rotate(180deg)}

.content{flex:1;min-width:0;padding:1.75rem 2rem;overflow-y:auto}

.btn{display:inline-block;padding:8px 15px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:12.5px;cursor:pointer;font-weight:500;transition:border-color .12s,color .12s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--blue-hover);border-color:var(--blue-hover);color:#fff}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-red{color:var(--red);border-color:rgba(220,38,38,.35)}
.btn-red:hover{border-color:var(--red);background:var(--red-dim)}

.tabs{display:flex;gap:8px;padding:0 2rem;background:var(--bg2);border-bottom:1px solid var(--border)}
.tab{padding:12px 6px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

.msg-box{display:none;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;margin-bottom:1rem}
.msg-box.show{display:block}
.msg-box.ok{background:var(--green-dim);color:#047857}
.msg-box.err{background:var(--red-dim);color:var(--red)}

/* ── QUIOSQUE ── */
.kiosk-wrap{max-width:460px;margin:2rem auto}
.kiosk-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:2rem}
.kiosk-title{font-size:18px;font-weight:800;text-align:center;margin-bottom:1.5rem;color:var(--navy)}
.kiosk-field{margin-bottom:1.1rem}
.kiosk-field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.kiosk-field input,.kiosk-field select,.kiosk-field textarea{
  width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg3);color:var(--text);font-size:18px;text-align:center;letter-spacing:.04em;
}
.kiosk-field select{text-align:left;font-size:15px}
.kiosk-field textarea{text-align:left;font-size:14px;resize:vertical;min-height:60px}
.kiosk-field input:focus,.kiosk-field select:focus,.kiosk-field textarea:focus{outline:none;border-color:var(--blue)}
.kiosk-btn{width:100%;padding:15px;border-radius:var(--radius-sm);border:none;background:var(--blue);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:.4rem}
.kiosk-btn:hover{background:var(--blue-hover)}
.kiosk-btn.stop{background:var(--red)}
.kiosk-btn.stop:hover{background:#b91c1c}
.kiosk-link{display:block;text-align:center;margin-top:1rem;color:var(--text3);font-size:12.5px;cursor:pointer}
.kiosk-link:hover{color:var(--text2)}

.colab-box{text-align:center;margin-bottom:1.5rem}
.colab-nome{font-size:20px;font-weight:800;color:var(--navy)}
.colab-info{font-size:12.5px;color:var(--text2);margin-top:4px}
.colab-badge{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge-produtivo{background:var(--green-dim);color:#047857}
.badge-improdutivo{background:var(--red-dim);color:var(--red)}
.badge-apoio{background:var(--amber-dim);color:var(--amber)}

.aberto-box{background:var(--blue-dim);border-radius:var(--radius-sm);padding:1.25rem;text-align:center;margin-bottom:1.25rem}
.aberto-atividade{font-size:15px;font-weight:700;color:var(--navy)}
.aberto-cronometro{font-size:32px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;margin-top:6px}
.aberto-desde{font-size:11.5px;color:var(--text2);margin-top:4px}

/* ── CADASTRO (admin) ── */
.filter-row{display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filter-row input,.filter-row select{flex:1;min-width:160px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text);font-size:14px}
.filter-row input:focus,.filter-row select:focus{outline:none;border-color:var(--blue)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);box-shadow:var(--shadow-sm)}
.dtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.dtbl thead th{text-align:left;padding:10px;color:var(--text2);font-weight:600;white-space:nowrap;background:var(--bg3);border-bottom:1px solid var(--border)}
.dtbl tbody td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.dtbl tbody tr:hover td{background:rgba(0,0,0,.02)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase}
.empty{text-align:center;padding:3rem 2rem;color:var(--text2);font-size:14px}

/* ── RELATÓRIOS ── */
.rel-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.5rem}
.rel-kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow-sm)}
.rel-kpi-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.rel-kpi-value{font-size:22px;font-weight:800;color:var(--text)}
.rel-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:1.5rem}
@media (max-width:820px){ .rel-charts{grid-template-columns:1fr} }
.rel-chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem;box-shadow:var(--shadow-sm)}
.rel-chart-card h3{font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}
.rel-chart-card canvas{max-height:220px}
.rel-chart-hint{font-size:11px;color:var(--text3);margin-top:8px}
.rel-active-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.rel-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 12px;border-radius:20px;background:var(--blue-dim);color:var(--blue);font-size:12px;font-weight:600}
.rel-chip button{border:none;background:none;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0}
.rel-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow-sm);margin-bottom:1.5rem}
.rel-panel h3{font-size:14px;font-weight:800;margin-bottom:2px}
.rel-panel .sub{font-size:12px;color:var(--text2);margin-bottom:14px}

/* ── MONITORAMENTO ── */
.mon-row-normal{background:var(--bg2)}
.mon-row-atencao{background:var(--amber-dim)}
.mon-row-critico{background:var(--red-dim)}
.pill-normal{background:var(--blue-dim);color:var(--blue)}
.pill-atencao{background:var(--amber-dim);color:var(--amber)}
.pill-critico{background:var(--red-dim);color:var(--red)}
.pill-ok{background:var(--green-dim);color:var(--green)}
.pill-neutro{background:var(--bg3);color:var(--text3)}
.mon-status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mon-status-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.85rem 1rem;box-shadow:var(--shadow-sm)}
.mon-status-nome{font-weight:700;font-size:13.5px;margin-bottom:2px}
.mon-status-sub{font-size:11px;color:var(--text3);margin-bottom:8px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;font-weight:700;margin-bottom:14px}
.form-field{margin-bottom:.9rem}
.form-field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.form-field input,.form-field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text);font-size:14px}
.form-field input:focus,.form-field select:focus{outline:none;border-color:var(--blue)}
.form-check{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:.9rem}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

.sidebar-fab{position:fixed;bottom:20px;left:16px;z-index:260;width:46px;height:46px;border-radius:50%;background:var(--navy2);border:1px solid rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-md);transition:background .12s,transform .12s}
.sidebar-fab:hover{background:var(--navy3);transform:scale(1.06)}
.sidebar-fab svg{width:20px;height:20px;transition:transform .2s;flex-shrink:0}
.app-shell.sidebar-collapsed .sidebar-fab svg{transform:rotate(180deg)}
</style>
</head>
<body>

<div class="app-shell" id="appShell">
  <header class="app-header">
    <div class="app-header-brand">
      <img class="logo-full" src="assets/logo.png" alt="Flow Suite">
    </div>
    <div class="app-header-right">
      <span class="header-user">Logado como<strong id="userNome">...</strong></span>
      <div id="sininhoWrap"></div>
      <div id="cartinhaWrap"></div>
      <button class="icon-btn" title="Início" onclick="window.location.href='index.html'">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9.5 10 3l7 6.5M5 8v8h10V8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" title="Sair" onclick="logout()">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3H4v14h4M13 6l4 4-4 4M6.5 10H17" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="avatar" id="userAvatar">··</div>
    </div>
  </header>
  <div class="app-body">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a class="nav-item" href="index.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9.5 10 3l7 6.5M5 8v8h10V8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">Início</span>
        </a>
        <a class="nav-item" href="contratos.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2.5h6l3 3v12h-9z" stroke-linejoin="round"/><path d="M12 2.5V6h3M8 10h4M8 13h4M8 7h1.5" stroke-linecap="round"/></svg>
          <span class="nav-label">Contratos</span>
        </a>
        <a class="nav-item" href="engenharia.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m3 17 8-8m0 0 4-4 2 2-4 4m-4-4 4 4M6 14l-1 3 3-1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">Engenharia</span>
        </a>
        <a class="nav-item" href="cadastro.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3h6a1 1 0 0 1 1 1v1H6V4a1 1 0 0 1 1-1Z" stroke-linejoin="round"/><path d="M6 4H5a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-1M7 10h6M7 13h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">PCP</span>
        </a>
        <a class="nav-item" href="apontamento.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 17V9l4-3 4 3v8M11 17V6l3-2 3 2v11" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">Produção</span>
        </a>
        <a class="nav-item active" href="ponto.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10.5" r="7"/><path d="M10 6.5v4l3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">Apontamento de Horas</span>
        </a>
        <a class="nav-item" href="expedicao.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6h9v8H2zM11 9h4l3 3v2h-7z" stroke-linejoin="round"/><circle cx="6" cy="15.5" r="1.4"/><circle cx="14" cy="15.5" r="1.4"/></svg>
          <span class="nav-label">Expedição</span>
        </a>
        <a class="nav-item" href="industrializacao.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m10 2 7 3.5v9L10 18l-7-3.5v-9L10 2Z" stroke-linejoin="round"/><path d="M10 2v16M3 5.5 10 9l7-3.5M10 9v9" stroke-linejoin="round"/></svg>
          <span class="nav-label">Industrialização</span>
        </a>
        <a class="nav-item" href="almoxarifado.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h14M3 4v12M17 4v12M3 8h14M3 12h14M3 16h14" stroke-linecap="round"/></svg>
          <span class="nav-label">Almoxarifado</span>
        </a>
        <a class="nav-item" href="qualidade.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5 16 5v5c0 4-2.5 6.5-6 7.5C6.5 16.5 4 14 4 10V5l6-2.5Z" stroke-linejoin="round"/><path d="m7.2 10 2 2 3.6-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label">Qualidade</span>
        </a>
        <a class="nav-item" href="dashboard.html">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 15V9M10 15V4M16 15v-6" stroke-linecap="round"/></svg>
          <span class="nav-label">Dashboard</span>
        </a>
      </nav>
      <button class="collapse-btn" onclick="alternarSidebar(true)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12.5 4 7 10l5.5 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="collapse-label">Recolher menu</span>
      </button>
    </aside>
    <button class="sidebar-fab" id="sidebarFab" onclick="alternarSidebar(true)" title="Mostrar/ocultar menu">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12.5 4 7 10l5.5 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <main class="content">
      <div class="tabs" id="tabsBar" style="display:none;margin:-1.75rem -2rem 1.5rem">
        <div class="tab active" id="tabPonto" onclick="mudarTab('ponto')">Quiosque</div>
        <div class="tab" id="tabMonitoramento" onclick="mudarTab('monitoramento')" style="display:none">Monitoramento</div>
        <div class="tab" id="tabCorrecoes" onclick="mudarTab('correcoes')" style="display:none">Correções</div>
        <div class="tab" id="tabRelatorios" onclick="mudarTab('relatorios')" style="display:none">Relatórios</div>
        <div class="tab" id="tabColaboradores" onclick="mudarTab('colaboradores')" style="display:none">Colaboradores</div>
        <div class="tab" id="tabAtividades" onclick="mudarTab('atividades')" style="display:none">Atividades</div>
        <div class="tab" id="tabSetores" onclick="mudarTab('setores')" style="display:none">Setores / CC</div>
      </div>
      <div class="msg-box" id="msgBox"></div>
      <div id="content"></div>
    </main>
  </div>
</div>

<!-- MODAL: colaborador -->
<div class="overlay" id="ovColaborador">
  <div class="modal">
    <h3 id="colabModalTitulo">Novo colaborador</h3>
    <div class="form-field"><label>Matrícula</label><input id="cMatricula" placeholder="Ex: 1234"></div>
    <div class="form-field"><label>Nome</label><input id="cNome"></div>
    <div class="form-field"><label>Cargo</label><input id="cCargo"></div>
    <div class="form-field"><label>Setor / Centro de Custo</label><select id="cSetor"></select></div>
    <div class="form-field"><label>Supervisor</label><input id="cSupervisor"></div>
    <div class="form-field"><label>Classificação</label>
      <select id="cClassificacao">
        <option value="produtivo">Produtivo</option>
        <option value="improdutivo">Improdutivo</option>
        <option value="apoio">Apoio</option>
      </select>
    </div>
    <div class="form-field"><label>PIN (4 dígitos) — deixe em branco pra não alterar</label><input id="cPin" maxlength="4" inputmode="numeric" placeholder="••••"></div>
    <label class="form-check"><input type="checkbox" id="cAtivo" checked> Colaborador ativo</label>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="fecharModal('ovColaborador')">Cancelar</button>
      <button type="button" class="btn btn-primary" onclick="salvarColaborador()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: atividade -->
<div class="overlay" id="ovAtividade">
  <div class="modal">
    <h3 id="atividadeModalTitulo">Nova atividade</h3>
    <div class="form-field"><label>Código</label><input id="aCodigo" placeholder="Ex: AT24"></div>
    <div class="form-field"><label>Nome</label><input id="aNome"></div>
    <div class="form-field"><label>Tipo</label>
      <select id="aTipo">
        <option value="produtiva">Produtiva</option>
        <option value="improdutiva">Improdutiva</option>
        <option value="apoio">Apoio</option>
      </select>
    </div>
    <label class="form-check"><input type="checkbox" id="aExigePedido"> Exige pedido no apontamento</label>
    <label class="form-check"><input type="checkbox" id="aAtivo" checked> Atividade ativa</label>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="fecharModal('ovAtividade')">Cancelar</button>
      <button type="button" class="btn btn-primary" onclick="salvarAtividade()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: setor/CC -->
<div class="overlay" id="ovSetor">
  <div class="modal">
    <h3 id="setorModalTitulo">Novo setor / CC</h3>
    <div class="form-field"><label>Código do Centro de Custo</label><input id="sCodigo" placeholder="Ex: 1103"></div>
    <div class="form-field"><label>Nome do setor</label><input id="sNome" placeholder="Ex: Usinagem"></div>
    <label class="form-check"><input type="checkbox" id="sAtivo" checked> Setor ativo</label>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="fecharModal('ovSetor')">Cancelar</button>
      <button type="button" class="btn btn-primary" onclick="salvarSetor()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: correção / lançamento manual de apontamento -->
<div class="overlay" id="ovCorrecao">
  <div class="modal">
    <h3 id="corModalTitulo">Corrigir apontamento</h3>
    <input type="hidden" id="corId">
    <div class="form-field" id="corColabWrap">
      <label>Colaborador</label>
      <select id="corColaborador"></select>
    </div>
    <div class="form-field" id="corColabTexto" style="display:none">
      <label>Colaborador</label>
      <div style="padding:9px 12px;background:var(--bg3);border-radius:var(--radius-sm);font-weight:600" id="corColabNome"></div>
    </div>
    <div class="form-field"><label>Início</label><input type="datetime-local" id="corInicio"></div>
    <div class="form-field"><label>Fim (deixe em branco se ainda estiver em aberto)</label><input type="datetime-local" id="corFim"></div>
    <div class="form-field"><label>Atividade</label><select id="corAtividade" onchange="onAtividadeCorrecaoChange()"></select></div>
    <div class="form-field" id="corPedidoWrap" style="display:none"><label>Pedido</label><select id="corPedido"></select></div>
    <div class="form-field"><label>Observação</label><input id="corObs" placeholder="Motivo da correção, se quiser registrar"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-red" id="corBtnEstornar" style="display:none;margin-right:auto" onclick="estornarApontamento()">Estornar</button>
      <button type="button" class="btn" onclick="fecharModal('ovCorrecao')">Cancelar</button>
      <button type="button" class="btn btn-primary" onclick="salvarCorrecao()">Salvar</button>
    </div>
  </div>
</div>

<script src="js/supabase-client.js?v=3"></script>
<script>
let AUTH = null;
let sidebarMexidoManualmente = false;
function alternarSidebar(manual){
  document.getElementById('appShell').classList.toggle('sidebar-collapsed');
  if (manual) sidebarMexidoManualmente = true;
}
setTimeout(() => {
  if (sidebarMexidoManualmente) return;
  document.getElementById('appShell').classList.add('sidebar-collapsed');
}, 5000);

let aba = 'ponto';
let atividadesCache = [];
let setoresCache = [];
let sessaoMatricula = null;
let sessaoPin = null;
let cronometroInterval = null;
let monitoramentoInterval = null;

function showMsg(text, ok){
  const box = document.getElementById('msgBox');
  box.textContent = (ok ? '✓ ' : '✕ ') + text;
  box.className = 'msg-box show ' + (ok ? 'ok' : 'err');
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  clearTimeout(window.__msgTimeout);
  if (ok) window.__msgTimeout = setTimeout(() => box.classList.remove('show'), 4000);
}
function abrirModal(id){ document.getElementById(id).classList.add('show'); }
function fecharModal(id){ document.getElementById(id).classList.remove('show'); }

async function init(){
  AUTH = await exigirLogin(['apontamento', 'producao', 'admin']);
  if (!AUTH) return;
  document.getElementById('userNome').textContent = AUTH.nome;
  document.getElementById('userAvatar').textContent = (AUTH.nome || '').trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase() || '··';
  iniciarSininho('sininhoWrap');
  iniciarCartinha('cartinhaWrap');

  if (AUTH.perfil === 'admin' || AUTH.perfil === 'producao'){
    document.getElementById('tabsBar').style.display = 'flex';
    document.getElementById('tabMonitoramento').style.display = '';
    document.getElementById('tabCorrecoes').style.display = '';
    document.getElementById('tabRelatorios').style.display = '';
  }
  if (AUTH.perfil === 'admin'){
    document.getElementById('tabColaboradores').style.display = '';
    document.getElementById('tabAtividades').style.display = '';
    document.getElementById('tabSetores').style.display = '';
  }

  await Promise.all([carregarAtividades(), carregarSetores()]);
  mudarTab('ponto');
}

async function carregarAtividades(){
  const { data } = await sb.from('atividades').select('*').eq('ativo', true).order('codigo');
  atividadesCache = data || [];
}
async function carregarSetores(){
  const { data } = await sb.from('setores_cc').select('*').order('nome');
  setoresCache = data || [];
}

function mudarTab(nome){
  aba = nome;
  ['Ponto','Monitoramento','Correcoes','Relatorios','Colaboradores','Atividades','Setores'].forEach(t => {
    const el = document.getElementById('tab' + t);
    if (el) el.classList.toggle('active', t.toLowerCase() === nome);
  });
  clearInterval(monitoramentoInterval);
  if (nome === 'ponto') renderKioskIdentificar();
  else if (nome === 'monitoramento') renderMonitoramento();
  else if (nome === 'correcoes') renderCorrecoes();
  else if (nome === 'relatorios') renderRelatorios();
  else if (nome === 'colaboradores') renderColaboradores();
  else if (nome === 'atividades') renderAtividades();
  else if (nome === 'setores') renderSetores();
}

/* ══════════════════════════ QUIOSQUE ══════════════════════════ */

function renderKioskIdentificar(){
  clearInterval(cronometroInterval);
  sessaoMatricula = null;
  sessaoPin = null;
  document.getElementById('msgBox').classList.remove('show');
  document.getElementById('content').innerHTML = `
    <div class="kiosk-wrap">
      <div class="kiosk-card">
        <div class="kiosk-title">⏱ Apontamento de Horas</div>
        <div class="kiosk-field">
          <label>Matrícula</label>
          <input id="kMatricula" name="kiosk-matricula" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="0000">
        </div>
        <div class="kiosk-field">
          <label>PIN</label>
          <input id="kPin" name="kiosk-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" placeholder="••••">
        </div>
        <button class="kiosk-btn" onclick="identificar()">Entrar</button>
      </div>
    </div>`;
  document.getElementById('kMatricula').focus();
  document.getElementById('kPin').addEventListener('keydown', e => { if (e.key === 'Enter') identificar(); });
}

async function identificar(){
  const matricula = document.getElementById('kMatricula').value.trim();
  const pin = document.getElementById('kPin').value.trim();
  if (!matricula || !pin){ showMsg('Informe matrícula e PIN.', false); return; }

  const { data, error } = await sb.rpc('apontamento_identificar', { p_matricula: matricula, p_pin: pin });
  if (error || !data || !data.length){
    showMsg(error?.message || 'Matrícula ou PIN inválido.', false);
    document.getElementById('kPin').value = '';
    document.getElementById('kPin').focus();
    return;
  }

  document.getElementById('msgBox').classList.remove('show');
  sessaoMatricula = matricula;
  sessaoPin = pin;
  renderKioskColaborador(data[0]);
}

function renderKioskColaborador(col){
  const badgeClass = 'badge-' + col.classificacao;
  const setorNome = setoresCache.find(s => s.codigo_cc === col.setor_cc)?.nome || col.setor_cc || '—';

  let corpo;
  if (col.apontamento_aberto_id){
    const ativNome = atividadesCache.find(a => a.codigo === col.apontamento_aberto_atividade)?.nome || col.apontamento_aberto_atividade;
    corpo = `
      <div class="aberto-box">
        <div class="aberto-atividade">${esc(col.apontamento_aberto_atividade)} — ${esc(ativNome)}</div>
        <div class="aberto-cronometro" id="cronometro">00:00:00</div>
        <div class="aberto-desde">desde ${new Date(col.apontamento_aberto_inicio).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' })}</div>
      </div>
      <button class="kiosk-btn stop" onclick="finalizar()">⏹ Finalizar apontamento</button>`;
  } else {
    const opcoesAtiv = atividadesCache.map(a => `<option value="${esc(a.codigo)}" data-exige="${a.exige_pedido}">${esc(a.codigo)} — ${esc(a.nome)}</option>`).join('');
    corpo = `
      <div class="kiosk-field">
        <label>Atividade</label>
        <select id="kAtividade" onchange="onAtividadeChange()">${opcoesAtiv}</select>
      </div>
      <div class="kiosk-field" id="kPedidoWrap" style="display:none">
        <label>Pedido</label>
        <select id="kPedido"><option value="">Carregando...</option></select>
      </div>
      <div class="kiosk-field">
        <label>Observação (opcional)</label>
        <textarea id="kObs"></textarea>
      </div>
      <button class="kiosk-btn" onclick="iniciar()">▶ Iniciar apontamento</button>`;
  }

  document.getElementById('content').innerHTML = `
    <div class="kiosk-wrap">
      <div class="kiosk-card">
        <div class="colab-box">
          <div class="colab-nome">${esc(col.nome)}</div>
          <div class="colab-info">${esc(col.cargo || '—')} · ${esc(setorNome)}</div>
          <span class="colab-badge ${badgeClass}">${esc(col.classificacao)}</span>
        </div>
        ${corpo}
        <span class="kiosk-link" onclick="renderKioskIdentificar()">← Trocar usuário</span>
      </div>
    </div>`;

  if (col.apontamento_aberto_id){
    const inicio = new Date(col.apontamento_aberto_inicio).getTime();
    const atualizar = () => {
      const s = Math.max(0, Math.floor((Date.now() - inicio) / 1000));
      const hh = String(Math.floor(s / 3600)).padStart(2, '0');
      const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      const el = document.getElementById('cronometro');
      if (el) el.textContent = `${hh}:${mm}:${ss}`;
    };
    atualizar();
    cronometroInterval = setInterval(atualizar, 1000);
  } else {
    carregarPedidosParaSelect();
    onAtividadeChange();
  }
}

async function carregarPedidosParaSelect(){
  const sel = document.getElementById('kPedido');
  const { data, error } = await sb.from('pedidos').select('id, numero_pedido, cliente').order('numero_pedido');
  if (!sel) return;
  if (error || !data){ sel.innerHTML = '<option value="">Erro ao carregar pedidos</option>'; return; }
  sel.innerHTML = data.map(p => `<option value="${p.id}">${esc(p.numero_pedido)}${p.cliente ? ' — ' + esc(p.cliente) : ''}</option>`).join('');
}

function onAtividadeChange(){
  const sel = document.getElementById('kAtividade');
  const wrap = document.getElementById('kPedidoWrap');
  if (!sel || !wrap) return;
  const exige = sel.options[sel.selectedIndex]?.dataset.exige === 'true';
  wrap.style.display = exige ? 'block' : 'none';
}

async function iniciar(){
  const atividade = document.getElementById('kAtividade').value;
  const exige = document.getElementById('kAtividade').options[document.getElementById('kAtividade').selectedIndex]?.dataset.exige === 'true';
  const pedidoId = exige ? (document.getElementById('kPedido').value || null) : null;
  const obs = document.getElementById('kObs').value.trim() || null;

  if (exige && !pedidoId){ showMsg('Essa atividade exige um pedido.', false); return; }

  const { error } = await sb.rpc('apontamento_iniciar', {
    p_matricula: sessaoMatricula, p_pin: sessaoPin, p_atividade_codigo: atividade,
    p_pedido_id: pedidoId ? Number(pedidoId) : null, p_observacao: obs,
  });

  if (error){ showMsg(error.message, false); return; }
  showMsg('Apontamento iniciado.', true);
  setTimeout(renderKioskIdentificar, 1200);
}

async function finalizar(){
  const { error } = await sb.rpc('apontamento_finalizar', { p_matricula: sessaoMatricula, p_pin: sessaoPin });
  if (error){ showMsg(error.message, false); return; }
  showMsg('Apontamento finalizado.', true);
  setTimeout(renderKioskIdentificar, 1200);
}

/* ══════════════════════════ MONITORAMENTO (admin + producao/supervisor) ══════════════════════════ */

function formatarDuracao(ms){
  const min = Math.floor(ms / 60000);
  const h = Math.floor(min / 60), m = min % 60;
  return h > 0 ? `${h}h ${m}min` : `${m}min`;
}

async function renderMonitoramento(){
  document.getElementById('content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <div style="font-size:12px;color:var(--text2)">Atualiza sozinho a cada minuto.</div>
      <button class="btn" onclick="carregarMonitoramento()">🔄 Atualizar agora</button>
    </div>
    <div id="monAbertos"><div class="empty">Carregando...</div></div>
    <div style="margin:2rem 0 1rem">
      <h3 style="font-size:14px;font-weight:800">Status de hoje</h3>
      <div style="font-size:12px;color:var(--text2);margin-top:2px">Quem já bateu ponto hoje, quem está com algo aberto, e quem ainda não apareceu</div>
    </div>
    <div id="monHoje"><div class="empty">Carregando...</div></div>`;

  await Promise.all([carregarColaboradores(), carregarSetores(), carregarAtividades(), carregarPedidos()]);
  await carregarMonitoramento();
  monitoramentoInterval = setInterval(carregarMonitoramento, 60000);
}

async function carregarMonitoramento(){
  await Promise.all([carregarAbertos(), carregarStatusHoje()]);
}

async function carregarAbertos(){
  const wrap = document.getElementById('monAbertos');
  const { data, error } = await sb
    .from('apontamentos_horas')
    .select('id, matricula, hora_inicio, atividade_codigo, colaboradores(nome,cargo,setor_cc), pedidos(numero_pedido)')
    .is('hora_fim', null)
    .neq('status', 'estornado')
    .order('hora_inicio');

  if (error){ wrap.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }
  if (!data.length){
    wrap.innerHTML = `<div class="rel-panel" style="text-align:center;color:var(--green);font-weight:700;padding:1.5rem">✓ Nenhum apontamento em aberto no momento.</div>`;
    return;
  }

  const agora = Date.now();
  const linhas = data.map(r => {
    const ms = agora - new Date(r.hora_inicio).getTime();
    const horas = ms / 3600000;
    const nivel = horas >= 12 ? 'critico' : horas >= 6 ? 'atencao' : 'normal';
    const ativ = atividadesCache.find(a => a.codigo === r.atividade_codigo)?.nome || r.atividade_codigo;
    return { r, ms, nivel, ativ };
  });

  wrap.innerHTML = `
    <div class="tbl-wrap">
      <table class="dtbl">
        <thead><tr><th>Colaborador</th><th>Setor</th><th>Atividade</th><th>Pedido</th><th>Aberto desde</th><th>Há quanto tempo</th><th></th></tr></thead>
        <tbody>
          ${linhas.map(({ r, ms, nivel, ativ }) => `
            <tr class="mon-row-${nivel}">
              <td style="font-weight:700">${esc(r.colaboradores?.nome || r.matricula)}</td>
              <td>${esc(nomeSetor(r.colaboradores?.setor_cc))}</td>
              <td>${esc(r.atividade_codigo)} — ${esc(ativ)}</td>
              <td>${esc(r.pedidos?.numero_pedido || '—')}</td>
              <td>${new Date(r.hora_inicio).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td>
              <td><span class="pill pill-${nivel}">${formatarDuracao(ms)}</span></td>
              <td><span class="btn" style="cursor:pointer" onclick="fecharAbertoRapido(${r.id})">Fechar agora</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

async function carregarStatusHoje(){
  const wrap = document.getElementById('monHoje');
  const hoje = hojeStr();

  const [{ data: colabs }, { data: hojeRows, error }] = await Promise.all([
    sb.from('colaboradores').select('matricula,nome,cargo,setor_cc').eq('ativo', true).order('nome'),
    sb.from('apontamentos_horas').select('matricula, hora_fim, horas').eq('data', hoje).neq('status', 'estornado'),
  ]);

  if (error){ wrap.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }

  const porMatricula = {};
  (hojeRows || []).forEach(r => {
    if (!porMatricula[r.matricula]) porMatricula[r.matricula] = { horas: 0, aberto: false, sessoes: 0 };
    porMatricula[r.matricula].sessoes++;
    porMatricula[r.matricula].horas += Number(r.horas || 0);
    if (!r.hora_fim) porMatricula[r.matricula].aberto = true;
  });

  wrap.innerHTML = `<div class="mon-status-grid">
    ${(colabs || []).map(c => {
      const info = porMatricula[c.matricula];
      let status, classe;
      if (info?.aberto){ status = '🔴 Em aberto'; classe = 'pill-critico'; }
      else if (info){ status = `✅ ${info.sessoes} lançamento${info.sessoes !== 1 ? 's' : ''}`; classe = 'pill-ok'; }
      else { status = '⚪ Sem apontamento hoje'; classe = 'pill-neutro'; }
      return `<div class="mon-status-card">
        <div class="mon-status-nome">${esc(c.nome)}</div>
        <div class="mon-status-sub">${esc(c.cargo || '—')} · ${esc(nomeSetor(c.setor_cc))}</div>
        <span class="pill ${classe}">${status}</span>
        ${info ? `<div style="margin-top:6px;font-size:12px;color:var(--text2)" class="tabular">${info.horas.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}h hoje</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

async function fecharAbertoRapido(id){
  const { data: r, error } = await sb
    .from('apontamentos_horas')
    .select('*, pedidos(numero_pedido)')
    .eq('id', id).single();
  if (error){ showMsg(error.message, false); return; }
  editarCorrecao(r);
}

/* ══════════════════════════ CORREÇÕES (admin + producao/supervisor) ══════════════════════════ */

let colaboradoresCache = [];
let pedidosCache = [];

async function carregarColaboradores(){
  const { data } = await sb.from('colaboradores').select('*').eq('ativo', true).order('nome');
  colaboradoresCache = data || [];
}
async function carregarPedidos(){
  const { data } = await sb.from('pedidos').select('id, numero_pedido, cliente').order('numero_pedido');
  pedidosCache = data || [];
}

// datetime-local <-> timestamptz: o input não sabe de fuso, então tratamos
// sempre como horário local do navegador (igual à fábrica) nos dois sentidos.
function paraInputLocal(isoStr){
  if (!isoStr) return '';
  const d = new Date(isoStr);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function deInputLocal(val){
  if (!val) return null;
  return new Date(val).toISOString();
}

function renderCorrecoes(){
  const hoje = new Date().toISOString().slice(0,10);
  document.getElementById('content').innerHTML = `
    <div class="filter-row">
      <select id="corrColaborador" style="max-width:280px"></select>
      <input type="date" id="corrData" value="${hoje}" style="max-width:170px">
      <button class="btn btn-primary" onclick="buscarCorrecoes()">Buscar</button>
      <button class="btn" onclick="abrirNovoManual()" style="margin-left:auto">+ Lançar apontamento esquecido</button>
    </div>
    <div id="corrResultado"><div class="empty">Escolha um colaborador e uma data, depois clique em Buscar.</div></div>`;

  Promise.all([carregarColaboradores(), carregarPedidos()]).then(() => {
    const sel = document.getElementById('corrColaborador');
    if (sel) sel.innerHTML = colaboradoresCache.map(c => `<option value="${esc(c.matricula)}">${esc(c.matricula)} — ${esc(c.nome)}</option>`).join('');
  });
}

async function buscarCorrecoes(){
  const matricula = document.getElementById('corrColaborador').value;
  const data = document.getElementById('corrData').value;
  const wrap = document.getElementById('corrResultado');
  if (!matricula || !data){ wrap.innerHTML = `<div class="empty">Escolha colaborador e data.</div>`; return; }
  wrap.innerHTML = `<div class="empty">Carregando...</div>`;

  const { data: rows, error } = await sb
    .from('apontamentos_horas')
    .select('*, pedidos(numero_pedido)')
    .eq('matricula', matricula)
    .eq('data', data)
    .order('hora_inicio');

  if (error){ wrap.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }
  if (!rows.length){ wrap.innerHTML = `<div class="empty">Nenhum apontamento nesse dia.</div>`; return; }

  wrap.innerHTML = `
    <div class="tbl-wrap">
      <table class="dtbl">
        <thead><tr><th>Início</th><th>Fim</th><th>Atividade</th><th>Pedido</th><th>Status</th><th>Observação</th><th></th></tr></thead>
        <tbody>
          ${rows.map(r => {
            const ativ = atividadesCache.find(a => a.codigo === r.atividade_codigo)?.nome || r.atividade_codigo;
            const estornado = r.status === 'estornado';
            return `<tr style="${estornado ? 'opacity:.5;text-decoration:line-through' : ''}">
              <td>${new Date(r.hora_inicio).toLocaleString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td>
              <td>${r.hora_fim ? new Date(r.hora_fim).toLocaleString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '<span class="pill badge-apoio">Em aberto</span>'}</td>
              <td>${esc(r.atividade_codigo)} — ${esc(ativ)}</td>
              <td>${esc(r.pedidos?.numero_pedido || '—')}</td>
              <td><span class="pill ${r.status==='normal'?'badge-produtivo':r.status==='corrigido'?'badge-apoio':'badge-improdutivo'}">${esc(r.status)}</span></td>

async function salvarCorrecao(){
  const id = document.getElementById('corId').value;
  const inicio = deInputLocal(document.getElementById('corInicio').value);
  const fim = deInputLocal(document.getElementById('corFim').value);
  const atividade = document.getElementById('corAtividade').value;
  const exige = document.getElementById('corAtividade').options[document.getElementById('corAtividade').selectedIndex]?.dataset.exige === 'true';
  const pedidoId = exige ? Number(document.getElementById('corPedido').value) : null;
  const obs = document.getElementById('corObs').value.trim() || null;

  if (!inicio){ showMsg('Informe a hora de início.', false); return; }
  if (exige && !pedidoId){ showMsg('Essa atividade exige um pedido.', false); return; }

  let error;
  if (id){
    ({ error } = await sb.rpc('apontamento_corrigir', {
      p_id: Number(id), p_hora_inicio: inicio, p_hora_fim: fim,
      p_atividade_codigo: atividade, p_pedido_id: pedidoId, p_observacao: obs,
    }));
  } else {
    const matricula = document.getElementById('corColaborador').value;
    if (!matricula){ showMsg('Escolha o colaborador.', false); return; }
    ({ error } = await sb.rpc('apontamento_criar_manual', {
      p_matricula: matricula, p_hora_inicio: inicio, p_hora_fim: fim,
      p_atividade_codigo: atividade, p_pedido_id: pedidoId, p_observacao: obs,
    }));
  }

  if (error){ showMsg(error.message, false); return; }
  fecharModal('ovCorrecao');
  showMsg('Apontamento salvo.', true);
  atualizarTelaAposCorrecao();
}

function atualizarTelaAposCorrecao(){
  if (aba === 'correcoes') buscarCorrecoes();
  else if (aba === 'monitoramento') carregarMonitoramento();
}

async function estornarApontamento(){
  const id = document.getElementById('corId').value;
  if (!id) return;
  if (!confirm('Estornar este apontamento? Ele fica marcado como cancelado, mas continua no histórico.')) return;
  const { error } = await sb.rpc('apontamento_estornar', { p_id: Number(id) });
  if (error){ showMsg(error.message, false); return; }
  fecharModal('ovCorrecao');
  showMsg('Apontamento estornado.', true);
  atualizarTelaAposCorrecao();
}

function setFiltroEAplicar(campo, valor){

async function aplicarFiltrosRelatorio(){
  relFiltro.inicio = document.getElementById('relInicio').value;
  relFiltro.fim = document.getElementById('relFim').value;
  relFiltro.matricula = document.getElementById('relColaborador').value;
  relFiltro.pedidoId = document.getElementById('relPedido').value;
  relFiltro.setorCc = document.getElementById('relSetor').value;

  const wrap = document.getElementById('relConteudo');
  wrap.innerHTML = `<div class="empty">Carregando...</div>`;

  let q = sb.from('apontamentos_horas')
    .select('matricula, data, hora_inicio, hora_fim, horas, atividade_codigo, pedido_id, setor_cc, status, colaboradores(nome,cargo), pedidos(numero_pedido)')
    .gte('data', relFiltro.inicio).lte('data', relFiltro.fim)
    .neq('status', 'estornado')
    .not('hora_fim', 'is', null);
  if (relFiltro.matricula) q = q.eq('matricula', relFiltro.matricula);
  if (relFiltro.pedidoId) q = q.eq('pedido_id', Number(relFiltro.pedidoId));
  if (relFiltro.setorCc) q = q.eq('setor_cc', relFiltro.setorCc);

  const { data, error } = await q.order('data');
  if (error){ wrap.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }
  renderRelatorioResultado(data || []);
}

function nomeSetor(cc){ return setoresCache.find(s => s.codigo_cc === cc)?.nome || cc || '—'; }

function renderRelatorioResultado(rows){
  const wrap = document.getElementById('relConteudo');

  const chips = [];
  if (relFiltro.matricula){
    const c = colaboradoresCache.find(x => x.matricula === relFiltro.matricula);
    chips.push(['matricula', `Colaborador: ${c ? c.nome : relFiltro.matricula}`]);
  }
  if (relFiltro.pedidoId){
    const p = pedidosCache.find(x => String(x.id) === String(relFiltro.pedidoId));
    chips.push(['pedidoId', `Pedido: ${p ? p.numero_pedido : relFiltro.pedidoId}`]);
  }
  if (relFiltro.setorCc) chips.push(['setorCc', `CC: ${nomeSetor(relFiltro.setorCc)}`]);
  const chipsHtml = chips.length ? `<div class="rel-active-filters">${chips.map(([campo,label]) =>
    `<span class="rel-chip">${esc(label)}<button onclick="setFiltroEAplicar('${campo}','')" title="Remover filtro">✕</button></span>`).join('')}</div>` : '';

  if (!rows.length){
    wrap.innerHTML = chipsHtml + `<div class="empty">Nenhum apontamento encontrado nesse período/filtro.</div>`;
    return;
  }

  const totalHoras = rows.reduce((s,r) => s + Number(r.horas||0), 0);
  const colaboradoresSet = new Set(rows.map(r => r.matricula));
  const diasSet = new Set(rows.map(r => r.data));

  const porCC = {}, porCargo = {}, porPedido = {}, porColab = {};
  for (const r of rows){
    const cc = r.setor_cc || '—';
    porCC[cc] = (porCC[cc]||0) + Number(r.horas);
    const cargo = r.colaboradores?.cargo || '—';
    porCargo[cargo] = (porCargo[cargo]||0) + Number(r.horas);
    const ped = r.pedidos?.numero_pedido || 'Sem pedido';
    porPedido[ped] = (porPedido[ped]||0) + Number(r.horas);
    const key = r.matricula;
    if (!porColab[key]) porColab[key] = { nome: r.colaboradores?.nome || key, cargo: r.colaboradores?.cargo || '—', cc, horas: 0, dias: new Set() };
    porColab[key].horas += Number(r.horas);
    porColab[key].dias.add(r.data);
  }

  wrap.innerHTML = chipsHtml + `
    <div class="rel-kpis">
      <div class="rel-kpi"><div class="rel-kpi-label">Total de horas</div><div class="rel-kpi-value tabular">${totalHoras.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}h</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Colaboradores</div><div class="rel-kpi-value tabular">${colaboradoresSet.size}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Dias com apontamento</div><div class="rel-kpi-value tabular">${diasSet.size}</div></div>
      <div class="rel-kpi"><div class="rel-kpi-label">Apontamentos</div><div class="rel-kpi-value tabular">${rows.length}</div></div>
    </div>
    <div class="rel-charts">
      <div class="rel-chart-card"><h3>Horas por Centro de Custo</h3><canvas id="relChartCC"></canvas><div class="rel-chart-hint">Clique numa barra pra filtrar</div></div>
      <div class="rel-chart-card"><h3>Horas por Cargo</h3><canvas id="relChartCargo"></canvas></div>
      <div class="rel-chart-card" style="grid-column:1/-1"><h3>Horas por Pedido</h3><canvas id="relChartPedido"></canvas><div class="rel-chart-hint">Clique numa barra pra filtrar</div></div>
    </div>
    ${relFiltro.matricula ? renderRelatorioDetalheColaborador(rows) : ''}
    <div class="tbl-wrap">
      <table class="dtbl">
        <thead><tr><th>Colaborador</th><th>Cargo</th><th>CC</th><th class="r">Dias</th><th class="r">Horas</th><th></th></tr></thead>
        <tbody>
          ${Object.entries(porColab).sort((a,b)=>b[1].horas-a[1].horas).map(([mat,c]) => `
            <tr>
              <td>${esc(c.nome)}</td>
              <td>${esc(c.cargo)}</td>
              <td><span class="cc-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:${CORES_REL[Object.keys(porCC).indexOf(c.cc)%CORES_REL.length]}"></span>${esc(nomeSetor(c.cc))}</td>
              <td class="r tabular">${c.dias.size}</td>
              <td class="r tabular" style="font-weight:700">${c.horas.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
              <td><span class="btn" style="cursor:pointer" onclick="setFiltroEAplicar('matricula','${esc(mat)}')">Ver detalhe</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  desenharChartsRelatorio(porCC, porCargo, porPedido);
}

function renderRelatorioDetalheColaborador(rows){

          <tbody>
            ${linhas.map(r => {
              const ativ = atividadesCache.find(a=>a.codigo===r.atividade_codigo)?.nome || r.atividade_codigo;
              return `<tr>

                <td>${new Date(r.hora_inicio).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td>
                <td>${new Date(r.hora_fim).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td>
                <td>${esc(r.atividade_codigo)} — ${esc(ativ)}</td>
                <td>${esc(r.pedidos?.numero_pedido || '—')}</td>
                <td class="r tabular">${Number(r.horas).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                <td><span class="pill ${r.status==='normal'?'badge-produtivo':'badge-apoio'}">${esc(r.status)}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function desenharChartsRelatorio(porCC, porCargo, porPedido){
  Object.values(relCharts).forEach(c => c && c.destroy());

  const barOpts = (labels, onClickFiltro) => ({
    type: 'bar',
    data: { labels, datasets: [{ data: labels.map((_,i)=>0), backgroundColor: CORES_REL }] },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: { size: 10 } } }, y: { ticks: { font: { size: 11 }, autoSkip: false } } },
      onClick: onClickFiltro ? (evt, els) => { if (els.length) onClickFiltro(labels[els[0].index]); } : undefined,
    },
  });

  function montar(canvasId, obj, onClickFiltro){
    const entries = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
    const cfg = barOpts(entries.map(e=>e[0]), onClickFiltro);
    cfg.data.datasets[0].data = entries.map(e=>Math.round(e[1]*100)/100);
    const canvas = document.getElementById(canvasId);
    canvas.parentElement.style.height = Math.max(120, entries.length*44) + 'px';
    canvas.style.height = '100%';
    return new Chart(canvas, cfg);
  }

  relCharts.cc = montar('relChartCC', porCC, (label) => {
    const cc = Object.keys(porCC).find(k => nomeSetor(k) === label || k === label);
    setFiltroEAplicar('setorCc', cc || label);
  });
  relCharts.cargo = montar('relChartCargo', porCargo, null);
  relCharts.pedido = montar('relChartPedido', porPedido, (label) => {
    const p = pedidosCache.find(x => x.numero_pedido === label);
    if (p) setFiltroEAplicar('pedidoId', p.id);
  });
}

async function salvarColaborador(){
  const matricula = document.getElementById('cMatricula').value.trim();
  const nome = document.getElementById('cNome').value.trim();
  const pin = document.getElementById('cPin').value.trim();
  if (!matricula || !nome){ showMsg('Matrícula e nome são obrigatórios.', false); return; }
  if (pin && pin.length < 4){ showMsg('O PIN precisa ter 4 dígitos.', false); return; }

  const payload = {
    matricula,
    nome,
    cargo: document.getElementById('cCargo').value.trim() || null,
    setor_cc: document.getElementById('cSetor').value || null,
    supervisor: document.getElementById('cSupervisor').value.trim() || null,
    classificacao: document.getElementById('cClassificacao').value,
    ativo: document.getElementById('cAtivo').checked,
  };

  const { error } = await sb.from('colaboradores').upsert(payload, { onConflict: 'matricula' });
  if (error){ showMsg('Erro ao salvar: ' + error.message, false); return; }

  if (pin){
    const { error: errPin } = await sb.rpc('definir_pin_colaborador', { p_matricula: matricula, p_pin: pin });
    if (errPin){ showMsg('Colaborador salvo, mas erro ao definir PIN: ' + errPin.message, false); return; }
  }

  fecharModal('ovColaborador');
  showMsg('Colaborador salvo.', true);
  renderColaboradores();
}

/* ══════════════════════════ CADASTRO: ATIVIDADES (admin) ══════════════════════════ */

async function renderAtividades(){
  document.getElementById('content').innerHTML = `
    <div class="filter-row">
      <input id="filtroAtiv" placeholder="Filtrar por código ou nome..." oninput="aplicarFiltro('filtroAtiv','ativTblWrap')">
      <button class="btn btn-primary" onclick="abrirNovaAtividade()">+ Nova atividade</button>
    </div>
    <div class="tbl-wrap" id="ativTblWrap"><div class="empty">Carregando...</div></div>`;

  const { data, error } = await sb.from('atividades').select('*').order('codigo');
  const wrap = document.getElementById('ativTblWrap');
  if (error){ wrap.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }

  wrap.innerHTML = `
    <table class="dtbl">
      <thead><tr><th>Código</th><th>Nome</th><th>Tipo</th><th>Exige pedido?</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${data.map(a => {
          const chave = `${a.codigo} ${a.nome}`.toLowerCase();
          return `<tr data-search="${esc(chave)}">
          <td><strong>${esc(a.codigo)}</strong></td>
          <td>${esc(a.nome)}</td>
          <td><span class="pill badge-${a.tipo}">${esc(a.tipo)}</span></td>
          <td>${a.exige_pedido ? 'Sim' : 'Não'}</td>
          <td>${a.ativo ? '<span class="pill badge-produtivo">Ativa</span>' : '<span class="pill badge-improdutivo">Inativa</span>'}</td>
          <td><span class="btn" style="cursor:pointer" onclick='editarAtividade(${JSON.stringify(a).replace(/'/g, "&#39;")})'>Editar</span></td>
        </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function abrirNovaAtividade(){
  document.getElementById('atividadeModalTitulo').textContent = 'Nova atividade';
  document.getElementById('aCodigo').value = '';
  document.getElementById('aCodigo').disabled = false;
  document.getElementById('aNome').value = '';
  document.getElementById('aTipo').value = 'produtiva';
  document.getElementById('aExigePedido').checked = false;
  document.getElementById('aAtivo').checked = true;
  abrirModal('ovAtividade');
}

function editarAtividade(a){
  document.getElementById('atividadeModalTitulo').textContent = 'Editar atividade';
  document.getElementById('aCodigo').value = a.codigo;
  document.getElementById('aCodigo').disabled = true;
  document.getElementById('aNome').value = a.nome;
  document.getElementById('aTipo').value = a.tipo;
  document.getElementById('aExigePedido').checked = a.exige_pedido;
  document.getElementById('aAtivo').checked = a.ativo;
  abrirModal('ovAtividade');
}

async function salvarAtividade(){
  const codigo = document.getElementById('aCodigo').value.trim().toUpperCase();
  const nome = document.getElementById('aNome').value.trim();
  if (!codigo || !nome){ showMsg('Código e nome são obrigatórios.', false); return; }

  const payload = {
    codigo, nome,
    tipo: document.getElementById('aTipo').value,
    exige_pedido: document.getElementById('aExigePedido').checked,
    ativo: document.getElementById('aAtivo').checked,
  };

  const { error } = await sb.from('atividades').upsert(payload, { onConflict: 'codigo' });
  if (error){ showMsg('Erro ao salvar: ' + error.message, false); return; }

  fecharModal('ovAtividade');
  showMsg('Atividade salva.', true);
  await carregarAtividades();
  renderAtividades();
}

/* ══════════════════════════ CADASTRO: SETORES / CC (admin) ══════════════════════════ */

async function renderSetores(){
  document.getElementById('content').innerHTML = `
    <div class="filter-row">
      <input id="filtroSetor" placeholder="Filtrar por código ou nome..." oninput="aplicarFiltro('filtroSetor','setorTblWrap')">
      <button class="btn btn-primary" onclick="abrirNovoSetor()">+ Novo setor / CC</button>
    </div>
    <div class="tbl-wrap" id="setorTblWrap"><div class="empty">Carregando...</div></div>`;

  const { data, error } = await sb.from('setores_cc').select('*').order('nome');
  const wrap = document.getElementById('setorTblWrap');
  if (error){ wrap.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }

  wrap.innerHTML = `
    <table class="dtbl">
      <thead><tr><th>Centro de Custo</th><th>Setor</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${data.map(s => {
          const chave = `${s.codigo_cc} ${s.nome}`.toLowerCase();
          return `<tr data-search="${esc(chave)}">
          <td><strong>${esc(s.codigo_cc)}</strong></td>
          <td>${esc(s.nome)}</td>
          <td>${s.ativo ? '<span class="pill badge-produtivo">Ativo</span>' : '<span class="pill badge-improdutivo">Inativo</span>'}</td>
          <td><span class="btn" style="cursor:pointer" onclick='editarSetor(${JSON.stringify(s).replace(/'/g, "&#39;")})'>Editar</span></td>
        </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function abrirNovoSetor(){
  document.getElementById('setorModalTitulo').textContent = 'Novo setor / CC';
  document.getElementById('sCodigo').value = '';
  document.getElementById('sCodigo').disabled = false;
  document.getElementById('sNome').value = '';
  document.getElementById('sAtivo').checked = true;
  abrirModal('ovSetor');
}

function editarSetor(s){
  document.getElementById('setorModalTitulo').textContent = 'Editar setor / CC';
  document.getElementById('sCodigo').value = s.codigo_cc;
  document.getElementById('sCodigo').disabled = true;
  document.getElementById('sNome').value = s.nome;
  document.getElementById('sAtivo').checked = s.ativo;
  abrirModal('ovSetor');
}

async function salvarSetor(){
  const codigo_cc = document.getElementById('sCodigo').value.trim();
  const nome = document.getElementById('sNome').value.trim();
  if (!codigo_cc || !nome){ showMsg('Código e nome são obrigatórios.', false); return; }

  const payload = { codigo_cc, nome, ativo: document.getElementById('sAtivo').checked };
  const { error } = await sb.from('setores_cc').upsert(payload, { onConflict: 'codigo_cc' });
  if (error){ showMsg('Erro ao salvar: ' + error.message, false); return; }

  fecharModal('ovSetor');
  showMsg('Setor salvo.', true);
  await carregarSetores();
  renderSetores();
}

init();
</script>
