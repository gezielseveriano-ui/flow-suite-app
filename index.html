<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Flow Suite">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Flow Suite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#050b18; --bg2:#0c1730; --bg3:#122043; --border:rgba(79,142,247,0.22);
  --text:#f0f4ff; --text2:#8b9bc4; --text3:#4b5a80;
  --blue:#3b82f6; --blue2:#60a5fa; --blue-glow:rgba(59,130,246,0.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:
    radial-gradient(ellipse 900px 600px at 50% 0%, rgba(59,130,246,0.16), transparent 60%),
    radial-gradient(ellipse 700px 500px at 50% 100%, rgba(59,130,246,0.08), transparent 60%),
    var(--bg);
}

.top-bar{
  display:flex;align-items:center;justify-content:flex-end;gap:12px;
  padding:1rem 1.5rem;font-size:12px;color:var(--text2);
}
.user-box{display:flex;align-items:center;gap:12px}
.user-box strong{color:var(--text)}
.btn-logout{
  padding:6px 14px;border:1px solid var(--border);border-radius:8px;
  background:rgba(255,255,255,.03);color:var(--text);font-size:12px;cursor:pointer;
}
.btn-logout:hover{border-color:var(--blue2);background:rgba(59,130,246,.1)}

.hero{max-width:920px;margin:0 auto;padding:2.5rem 1.5rem 4rem;text-align:center}

.brand-logo{
  max-width:min(560px,90%);width:100%;height:auto;margin:0 auto 2rem;display:block;
  filter:drop-shadow(0 8px 28px var(--blue-glow));
}

.divider{
  width:220px;height:1px;margin:0 auto 3rem;
  background:linear-gradient(90deg,transparent,var(--blue2),transparent);
  opacity:.6;
}

.grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:16px;
  max-width:980px;margin:0 auto;
}
@media (max-width:820px){
  .grid{grid-template-columns:repeat(3,1fr);max-width:520px}
}
@media (max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
.card{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  text-decoration:none;color:var(--text);
  background:linear-gradient(180deg,var(--bg2),var(--bg3));
  border:1px solid var(--border);border-radius:16px;
  padding:1.6rem 1rem 1.3rem;transition:all .18s;
}
.card:hover{
  border-color:var(--blue2);transform:translateY(-4px);
  box-shadow:0 12px 28px var(--blue-glow);
}
.card.disabled{opacity:.32;pointer-events:none;filter:grayscale(70%)}
.card-icon{
  width:52px;height:52px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(59,130,246,.08);border:1px solid var(--border);
  color:var(--blue2);
}
.card-icon svg{width:26px;height:26px}
.card-title{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
</style>
</head>
<body>

<div class="top-bar">
  <div class="user-box">
    <span>Logado como <strong id="userNome">...</strong> (<span id="userPerfil">...</span>)</span>
  </div>
  <button class="btn-logout" onclick="logout()">Sair</button>
</div>

<div class="hero">
  <img class="brand-logo" src="assets/logo-flowsuite.webp" alt="Flow Suite">
  <div class="divider"></div>

  <div class="grid" id="modGrid"></div>
</div>

<script src="js/supabase-client.js?v=2"></script>
<script>
const ICONS = {
  contratos: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7Z"/><path d="M14 3v4h4M9.5 12h5M9.5 15.5h5M9.5 8.5h2"/></svg>`,
  engenharia: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21 L15 9"/><path d="M12 6 L18 12"/><path d="M15 3 L21 9"/><circle cx="19" cy="19" r="2.4"/></svg>`,
  pcp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3.5 h6 a1 1 0 0 1 1 1 V6 H8 V4.5 a1 1 0 0 1 1-1Z"/><path d="M8 12 l2.5 2.5 L15 10"/></svg>`,
  producao: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3 v2.4 M12 18.6 V21 M3 12 h2.4 M18.6 12 H21 M5.6 5.6 l1.7 1.7 M16.7 16.7 l1.7 1.7 M18.4 5.6 l-1.7 1.7 M7.3 16.7 l-1.7 1.7"/></svg>`,
  expedicao: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7 h11 v10 H2 Z"/><path d="M13 10 h4 l4 3 v4 h-8 Z"/><circle cx="6.5" cy="18.5" r="1.6"/><circle cx="16.5" cy="18.5" r="1.6"/></svg>`,
  industrializacao: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21 V11 l5 3.5 V11 l5 3.5 V11 l5 3.5 V21 Z"/><path d="M7 11 V6 M17 11 V4"/><path d="M3 21 h18"/></svg>`,
  ponto: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8.5"/><path d="M12 8.5v5l3.5 2.2"/></svg>`,
  dashboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="1.6"/><path d="M8 20 h8 M12 17 v3"/><path d="M7 13 l2.5-3.5 L12 11.5 l4-5"/></svg>`,
};

const MODULOS = [
  { href: 'contratos.html',        icon: ICONS.contratos,        title: 'Contratos',        perfis: ['contratos', 'admin'] },
  { href: 'engenharia.html',       icon: ICONS.engenharia,       title: 'Engenharia',       perfis: ['engenharia', 'pcp', 'admin'] },
  { href: 'cadastro.html',         icon: ICONS.pcp,               title: 'PCP',              perfis: ['pcp', 'admin'] },
  { href: 'apontamento.html',      icon: ICONS.producao,          title: 'Produção',         perfis: ['producao', 'pcp', 'admin'] },
  { href: 'ponto.html',            icon: ICONS.ponto,             title: 'Apontamento de Horas', perfis: ['apontamento', 'producao', 'admin'] },
  { href: 'expedicao.html',        icon: ICONS.expedicao,         title: 'Expedição',        perfis: ['expedicao', 'pcp', 'admin'] },
  { href: 'industrializacao.html', icon: ICONS.industrializacao,  title: 'Industrialização', perfis: ['pcp', 'expedicao', 'admin'] },
  { href: 'dashboard.html',        icon: ICONS.dashboard,         title: 'Dashboard',        perfis: null }, // null = liberado pra todo mundo
];

(async () => {
  const auth = await exigirLogin();
  if (!auth) return;
  document.getElementById('userNome').textContent = auth.nome;
  document.getElementById('userPerfil').textContent = auth.perfil;

  const grid = document.getElementById('modGrid');
  grid.innerHTML = MODULOS.map(m => {
    const liberado = !m.perfis || m.perfis.includes(auth.perfil);
    return `<a class="card${liberado ? '' : ' disabled'}" href="${liberado ? m.href : '#'}">
      <div class="card-icon">${m.icon}</div>
      <div class="card-title">${m.title}</div>
    </a>`;
  }).join('');
})();
</script>
</body>
</html>
