<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Flow Suite">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Flow Suite — Definir senha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f1117; --bg2:#1a1d27; --bg3:#22263a;
  --border:rgba(255,255,255,0.07); --text:#f0f2f8; --text2:#8b92b3;
  --blue:#4f8ef7; --red:#f25c5c; --red-dim:rgba(242,92,92,0.13);
  --green:#3ecf8e; --green-dim:rgba(62,207,142,0.13);
  --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:2rem 1.75rem}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:1.75rem}
.brand .icon-wrap{width:38px;height:38px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#4f8ef7,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff}
.brand h1{font-size:16px;font-weight:700}
.brand span{font-size:11px;color:var(--text2);display:block;margin-top:1px}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text);font-size:14px}
input:focus{outline:none;border-color:var(--blue)}
button{width:100%;margin-top:22px;padding:11px;border:none;border-radius:var(--radius-sm);background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button:hover{opacity:.88}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:14px;padding:9px 12px;border-radius:var(--radius-sm);font-size:12px;display:none}
.msg.err{background:var(--red-dim);color:var(--red)}
.msg.ok{background:var(--green-dim);color:var(--green)}
.msg.show{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="icon-wrap">🏭</div>
    <div><h1>Flow Suite</h1><span>Definir nova senha</span></div>
  </div>
  <form id="form">
    <label for="senha">Nova senha</label>
    <input id="senha" type="password" required minlength="6" autocomplete="new-password">
    <label for="senha2">Confirmar nova senha</label>
    <input id="senha2" type="password" required minlength="6" autocomplete="new-password">
    <button type="submit" id="btn">Salvar senha</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script src="js/supabase-client.js"></script>
<script>
const msgEl = document.getElementById('msg');
function showMsg(text, ok){
  msgEl.textContent = text;
  msgEl.className = 'msg show ' + (ok ? 'ok' : 'err');
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const s1 = document.getElementById('senha').value;
  const s2 = document.getElementById('senha2').value;
  if (s1 !== s2){
    showMsg('As senhas não coincidem.', false);
    return;
  }
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Salvando...';

  const { error } = await sb.auth.updateUser({ password: s1 });
  if (error){
    showMsg('Erro ao salvar: ' + error.message, false);
    btn.disabled = false; btn.textContent = 'Salvar senha';
    return;
  }
  showMsg('Senha definida com sucesso! Redirecionando para o login...', true);
  setTimeout(() => window.location.href = 'login.html', 1800);
});
</script>
</body>
</html>
